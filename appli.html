<style>
/* Layout: plateau CASHFLOW modernisé. Carte héros vert plateau + or Fast Track, puis 4 blocs arrondis 2×2 (Recettes | Dépenses / Actifs | Passifs), barre d'action flottante. */
:root{
  --paper:#eef0eb; --card:#ffffff; --ink:#18201c; --muted:#66706a; --line:#e2e5df; --soft:#f5f6f2;
  --band:#18201c; --band-ink:#f6f5ef;
  --inc:#17945f; --exp:#e0533d; --asset:#2d6bd3; --debt:#c98113;
  --hero:#0b8fb0; --hero-2:#3fd3e3; --hero-ink:#ffffff; --gold:#f2c14e;
  --pos:var(--inc); --neg:var(--exp); --warn:#b7700a; --calm:#5a7fb0; --calm-bg:#e8eef6; --cork:#cdb48c; --cork-2:#bfa47a; --cork-ink:#2e2418; --focus:#2d6bd3; --rule:#b9beb7;
  --overlay:rgba(14,20,17,.45); --shadow:0 1px 2px rgba(20,30,25,.06),0 8px 24px rgba(20,30,25,.07);
  --r:20px; --r-sm:12px;
  --f-display:"Marcellus SC","Trajan Pro",Georgia,serif;
  --f-body:"Libre Franklin","Franklin Gothic Medium","Helvetica Neue",Arial,sans-serif;
  --f-label:"Archivo Narrow","Arial Narrow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0d110f; --card:#161b18; --ink:#ecf0ec; --muted:#9aa49e; --line:#252c28; --soft:#1c221f;
  --band:#ecf0ec; --band-ink:#111512;
  --inc:#3fcf8e; --exp:#ff7b64; --asset:#72a5ff; --debt:#f4b54b;
  --hero:#0a5f78; --hero-2:#14a3b8; --hero-ink:#ffffff; --gold:#f5c95e;
  --warn:#f0b44c; --calm:#9db9e0; --calm-bg:#222c38; --cork:#3a332a; --cork-2:#332d25; --cork-ink:#efe6d6; --focus:#72a5ff; --rule:#3a423d; --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0d110f; --card:#161b18; --ink:#ecf0ec; --muted:#9aa49e; --line:#252c28; --soft:#1c221f;
  --band:#ecf0ec; --band-ink:#111512;
  --inc:#3fcf8e; --exp:#ff7b64; --asset:#72a5ff; --debt:#f4b54b;
  --hero:#0a5f78; --hero-2:#14a3b8; --hero-ink:#ffffff; --gold:#f5c95e;
  --warn:#f0b44c; --calm:#9db9e0; --calm-bg:#222c38; --cork:#3a332a; --cork-2:#332d25; --cork-ink:#efe6d6; --focus:#72a5ff; --rule:#3a423d; --overlay:rgba(0,0,0,.6); --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 130px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.muted{color:var(--muted)} .pos{color:var(--inc)} .neg{color:var(--exp)} .warn{color:var(--warn)}
.small{font-size:12.5px}
h1,h2,h3{margin:0;text-wrap:balance}
.blur .num,.blur .money{filter:blur(7px)}
.tone-inc{--tone:var(--inc)} .tone-exp{--tone:var(--exp)} .tone-asset{--tone:var(--asset)} .tone-debt{--tone:var(--debt)} .tone-ink{--tone:var(--ink)}

/* En-tête */
.top{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.field-band{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0;background:var(--card);border-radius:999px;padding:5px 16px 5px 5px;box-shadow:var(--shadow)}
.tag{background:var(--hero);color:var(--hero-ink);font-family:var(--f-display);font-size:14px;letter-spacing:.06em;padding:6px 14px 5px;border-radius:999px;white-space:nowrap}
.field-band .val{flex:1;min-width:0;font-family:var(--f-label);font-weight:600;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal{margin:14px 2px 4px;font-size:14px;color:var(--muted)}
.goal b{color:var(--ink);font-weight:700}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin:14px 0 4px;padding:5px;background:var(--card);border-radius:999px;box-shadow:var(--shadow);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{font-family:var(--f-label);font-weight:600;font-size:14px;text-decoration:none;color:var(--muted);padding:7px 13px;white-space:nowrap;border-radius:999px}
nav.tabs a:hover{color:var(--ink);background:var(--soft)}
nav.tabs a[aria-current="page"]{color:var(--hero-ink);background:var(--hero)}
nav.subtabs{display:flex;gap:6px;overflow-x:auto;margin:6px 0 2px;padding:2px;scrollbar-width:none}nav.subtabs::-webkit-scrollbar{display:none}
nav.subtabs a{font-family:var(--f-label);font-weight:600;font-size:13px;text-decoration:none;color:var(--muted);padding:6px 12px;white-space:nowrap;border-radius:999px;border:1.5px solid var(--line,rgba(0,0,0,.12))}
nav.subtabs a:hover{color:var(--ink)}nav.subtabs a[aria-current="page"]{color:var(--ink);border-color:var(--ink);background:var(--card)}
.kvbtn{width:100%;text-align:left;background:none;border:0;font:inherit;color:inherit;cursor:pointer;border-radius:8px}.kvbtn:hover{background:var(--soft)}
.backlink{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:600;font-size:14px;text-decoration:none;color:var(--muted);margin:10px 2px 0}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.toolbar .sp{flex:1}
.status-line{font-size:12.5px;color:var(--muted)}

.sheet-title{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.03em;margin:26px 2px 10px}
.band{background:var(--band);color:var(--band-ink);font-family:var(--f-display);font-size:17px;letter-spacing:.05em;padding:9px 16px 7px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-radius:var(--r) var(--r) 0 0}
.band .r{font-family:var(--f-label);font-size:12px;letter-spacing:.04em}
.box{background:var(--card);border-radius:0 0 var(--r) var(--r);padding:6px 16px 14px;box-shadow:var(--shadow)}
.colhead{display:flex;justify-content:space-between;font-family:var(--f-label);font-size:12px;font-weight:700;color:var(--muted);border-bottom:1px solid var(--line);padding:6px 0 4px}
.grp{font-family:var(--f-label);font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin:14px 0 2px;color:var(--muted)}
.row{display:flex;align-items:baseline;gap:10px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:9px 8px 7px;text-align:left;border-radius:10px}
.row .lbl{flex:1;min-width:0;font-family:var(--f-label);font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis}
.row .lbl small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted);white-space:normal}
.row .amt{font-weight:650}
.row .sub{font-size:12px;color:var(--muted);margin-left:6px}
button.row:hover,a.row:hover{background:var(--soft)}
.row .chev{color:var(--muted);font-size:12px}
.row.total{border-bottom:0;border-top:2px solid var(--ink);margin-top:4px;border-radius:0}
.row.total .lbl{font-weight:700}
.empty{padding:12px 0;color:var(--muted);font-size:13.5px}

.sheet{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:860px){.sheet{grid-template-columns:1.1fr .9fr}}
.sheet>*{min-width:0}

.auditor{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.auditor .eyebrow,.eyebrow{font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-label);font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;padding:4px 11px;border-radius:999px;background:color-mix(in srgb,currentColor 14%,transparent)}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.gauge{position:relative;height:14px;border-radius:999px;margin:16px 0 24px;background:var(--soft)}
.gauge .fill{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--ink)}
.gauge .mk{position:absolute;top:-5px;bottom:-5px;width:0;border-left:2px dashed var(--exp)}
.gauge .mk span{position:absolute;top:100%;transform:translateX(-50%);font-family:var(--f-label);font-size:11px;font-weight:700;margin-top:4px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding:8px 0 6px}
.kv:last-child{border-bottom:0}
.kv .k{font-family:var(--f-label);font-weight:600;min-width:0}
.kv .k small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--muted)}
.kv .v{font-weight:700;font-size:16px}
.kv.strong .v{font-size:20px}
.notice{background:color-mix(in srgb,var(--gold) 18%,var(--card));border-radius:var(--r-sm);padding:12px 14px;font-size:13.5px;margin:12px 0}
.notice b{font-family:var(--f-label)}

/* Carte héros Rat Race */
.hero-card{position:relative;overflow:hidden;border-radius:26px;padding:22px clamp(18px,4vw,30px);color:var(--hero-ink);background:radial-gradient(130% 150% at 100% 0%,var(--hero-2) 0%,var(--hero) 62%);box-shadow:var(--shadow)}
.hero-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:28px solid rgba(255,255,255,.14);pointer-events:none}
.hero-card .eyebrow{color:color-mix(in srgb,var(--hero-ink) 70%,transparent)}
.hero-card .pill{color:#fff3c4;background:rgba(0,40,60,.22)}
.hero-card .pill.ok{color:#7ff0b8}
.hero-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;position:relative;z-index:1}
.hero{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;margin:8px 0 2px;position:relative;z-index:1}
.hero .big{font-family:var(--f-display);font-size:clamp(38px,9vw,60px);line-height:1.02;color:#fff;text-shadow:0 2px 12px rgba(0,60,80,.25)}
.hero .per{font-family:var(--f-label);font-weight:600;color:color-mix(in srgb,var(--hero-ink) 70%,transparent)}
.hero-card .gauge{background:rgba(0,40,60,.22);height:16px;position:relative;z-index:1}
.hero-card .gauge .fill{background:linear-gradient(90deg,#e9a93a,var(--gold))}
.hero-card .gauge .mk{border-color:rgba(255,255,255,.55)}
.hero-card .gauge .mk span{color:var(--hero-ink)}
.hstats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;position:relative;z-index:1}
@media (min-width:760px){.hstats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.hstat{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;min-width:0}
.cfbil{position:relative;z-index:1;margin-top:8px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cfl{background:rgba(0,40,60,.2);border-radius:14px;padding:8px 10px;min-width:0;display:flex;flex-direction:column;gap:1px}
.cfl small{font-size:11px;opacity:.75;line-height:1.2}
.cfl small:first-child{font-weight:700;opacity:.9;text-transform:uppercase;letter-spacing:.03em;font-size:10.5px}
.cfl b{font-size:clamp(14px,4vw,19px);font-weight:800;white-space:nowrap}
.cfl .neg{color:#ffd0c4}.cfl .pos{color:#c9ffe4}
.hstat .k{font-family:var(--f-label);font-weight:600;font-size:12.5px;color:color-mix(in srgb,var(--hero-ink) 72%,transparent)}
.hstat .v{font-size:19px;font-weight:700;margin-top:2px}
.hstat small{display:block;font-size:11.5px;color:color-mix(in srgb,var(--hero-ink) 60%,transparent);margin-top:2px}
.hero-card .hint{position:relative;z-index:1;font-size:12.5px;color:color-mix(in srgb,var(--hero-ink) 70%,transparent);margin:10px 0 0}
.hero-card .hint a,.hero-card .btn{color:var(--hero-ink)}
.hero-card .btn.solid{background:var(--gold);border-color:var(--gold);color:#1d1a0f}

/* Tuiles KPI */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
@media (min-width:760px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{background:var(--card);border-radius:18px;padding:14px;box-shadow:var(--shadow);min-width:0;position:relative;overflow:hidden}
.tile::before{content:"";position:absolute;left:14px;top:14px;width:30px;height:30px;border-radius:10px;background:color-mix(in srgb,var(--tone) 16%,transparent)}
.tile::after{content:"";position:absolute;left:25px;top:25px;width:8px;height:8px;border-radius:50%;background:var(--tone)}
.tile .k{font-family:var(--f-label);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:40px 0 0}
.tile .v{font-size:clamp(17px,4.4vw,21px);font-weight:750;margin-top:2px;color:var(--tone)}

/* Quatre blocs */
.quad{display:grid;grid-template-columns:1fr;gap:16px}
@media (min-width:820px){.quad{grid-template-columns:1fr 1fr}}
.quad>*{min-width:0}
.qcard{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.qh{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;color:inherit;cursor:pointer;padding:16px 16px 14px;background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 13%,var(--card)),var(--card))}
.qh .ico{width:38px;height:38px;border-radius:12px;background:var(--tone);color:#fff;display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.qh .t{flex:1;min-width:0}
.qh .tt{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.04em}
.qh .t small{display:block;font-size:12px;color:var(--muted)}
.qh .tot{font-size:20px;font-weight:750;color:var(--tone)}
.qb{padding:2px 12px 14px;flex:1}
.qcard:not(.open) .qb{display:none}
.qcard:not(.open) .qfoot .btn,.qcard:not(.open) .qnote{display:none}
.qchev{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tone) 14%,transparent);color:var(--tone);font-size:13px;flex:none;transition:transform .2s}
.qcard.open .qchev{transform:rotate(180deg)}
.qh:hover .qchev{background:color-mix(in srgb,var(--tone) 24%,transparent)}
.qcard{scroll-margin-top:12px;transition:box-shadow .3s}
.qcard.flash{box-shadow:0 0 0 3px color-mix(in srgb,var(--tone) 55%,transparent),var(--shadow)}
.quad{align-items:start}
button.tile{border:0;text-align:left;color:inherit;font:inherit;cursor:pointer;transition:transform .15s}
button.tile:hover{transform:translateY(-2px)}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;align-items:baseline;width:100%;text-align:left;background:none;border:0;border-radius:12px;padding:8px 8px 7px;color:inherit;text-decoration:none}
.qrow:hover{background:var(--soft)}
.qrow .lbl{font-family:var(--f-label);font-weight:600;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .lbl small{font-family:var(--f-body);font-weight:400;font-size:11.5px;color:var(--muted)}
.qrow .amt{font-weight:650}
.qrow .amt.zero{color:var(--muted);font-weight:400}
.qrow .meta{grid-column:1/-1;font-size:11.5px;color:var(--muted);margin-top:-2px}
.qrow .bar{grid-column:1/-1;height:5px;border-radius:999px;background:var(--soft);overflow:hidden}
.qrow .bar i{display:block;height:100%;border-radius:999px;background:var(--tone)}
.qfoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:12px 16px}
.qfoot .lbl{font-family:var(--f-label);font-weight:700}
.qfoot .v{font-weight:750;font-size:18px;color:var(--tone)}

.strip{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (min-width:700px){.strip{grid-template-columns:repeat(4,minmax(0,1fr))}}
.strip>div{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow)}
.strip .k{font-family:var(--f-label);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.strip .v{font-size:19px;font-weight:700;margin-top:2px}

/* Boutons */
.btn{border:1.5px solid var(--line);background:var(--card);padding:8px 15px;font-family:var(--f-label);font-weight:700;font-size:14px;letter-spacing:.02em;display:inline-flex;align-items:center;gap:6px;min-height:40px;border-radius:999px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.btn:hover{border-color:var(--rule)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{border-color:var(--exp);color:var(--exp)}
.btn.danger.armed{background:var(--exp);color:#fff}
.btn.sm{min-height:32px;padding:4px 12px;font-size:13px}
.aiflag{border-color:var(--warn,#c77700)!important}.aiwarn{display:block;margin-top:4px;font-size:12px;color:var(--warn,#c77700)}.aiwarn.ok{color:var(--muted)}
.aibox{border:1.5px dashed var(--line);border-radius:var(--r-sm);padding:12px;background:var(--soft)}.aibox textarea{min-height:0;font-size:13px}#ai-prompt{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:3px;font-family:var(--f-label);font-weight:600}

.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(180deg,transparent,color-mix(in srgb,var(--paper) 92%,transparent) 35%)}
.actionbar .in{max-width:640px;margin:0 auto;display:flex;gap:10px;padding:6px;background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.actionbar .btn{flex:1;justify-content:center;min-height:50px;font-size:15.5px;border:0;color:#fff}
.actionbar .btn.exp{background:var(--exp)}
.actionbar .btn.inc{background:var(--inc)}
:root[data-theme="dark"] .actionbar .btn{color:#0d110f}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .actionbar .btn{color:#0d110f}}

/* Formulaires */
label.f{display:flex;flex-direction:column;gap:5px;font-family:var(--f-label);font-weight:600;font-size:13.5px;min-width:0}
label.f small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=date],input[type=url],input[type=search],input[type=month],select,textarea{width:100%;border:1.5px solid var(--line);background:var(--soft);padding:9px 12px;border-radius:var(--r-sm);min-height:44px;font-size:16px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--focus);background:var(--card);outline:none}
.amount-in{font-size:32px !important;font-weight:750;text-align:right;min-height:64px !important;padding-right:34px !important;border-radius:16px !important}
.amount-wrap{position:relative}
.amount-wrap::after{content:"€";position:absolute;right:14px;bottom:17px;font-size:22px;font-weight:700;color:var(--muted)}

const $=(s,r=document)=>r.querySelector(s);

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const NF=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const PF=new Intl.NumberFormat('fr-FR',{style:'percent',maximumFractionDigits:0});
function money(c){if(c==null||Number.isNaN(c))return '—';return NF.format(c/100)}
function moneyS(c){if(c==null)return '—';return (c>0?'+':'')+money(c)}
function parseMoney(s){if(s==null)return null;s=String(s).replace(/[\s  €]/g,'').replace(',','.');if(s==='')return null;if(!/^-?\d*\.?\d*$/.test(s))return NaN;const x=Number(s);if(!Number.isFinite(x))return NaN;return Math.round(x*100)}
function cIn(c){return c==null?'':(c/100).toFixed(2).replace('.',',')}
function fdate(iso){if(!iso)return '—';const p=iso.split('-');return p.length===3?`${p[2]}/${p[1]}/${p[0]}`:p.length===2?`${p[1]}/${p[0]}`:iso}
const mk=iso=>iso.slice(0,7);
function addMonths(ym,n){let[y,m]=ym.split('-').map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+'-'+String(m).padStart(2,'0')}
function lastDay(ym){const[y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate()}
function addMonthsISO(iso,n){const ym=addMonths(iso.slice(0,7),n);const d=Math.min(Number(iso.slice(8,10)),lastDay(ym));return ym+'-'+String(d).padStart(2,'0')}
const MFR=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const MFRL=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function mLabel(ym){const[y,m]=ym.split('-').map(Number);return MFR[m-1]+' '+y}
function mLabelL(ym){const[y,m]=ym.split('-').map(Number);return MFRL[m-1]+' '+y}
const LS={get(k,d){try{const v=localStorage.getItem('cf.'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('cf.'+k,JSON.stringify(v))}catch(e){}}};

}

/*PARAMS-START*/
/* Paramètres fiscaux et sociaux de l’année. Version distribuable : remplacés par params.js (un seul fichier à mettre à jour chaque année). */
const CF_PARAMS_BUILTIN={
  version:'2026.1',year:2026,maj:'2026-11-05',
  micro:{
    vente:{label:'Vente de marchandises, hébergement',plafond:203100,urssaf:12.3,cfp:0.1,vl:1,abatt:71},
    bics:{label:'Prestations de services commerciales ou artisanales (BIC)',plafond:83600,urssaf:21.2,cfp:0.1,vl:1.7,abatt:50},

const FP=(window.CF_PARAMS&&window.CF_PARAMS.micro)?window.CF_PARAMS:CF_PARAMS_BUILTIN;
const DIST=!!window.CF_DIST;
const fpPct=x=>String(x).replace('.',',')+' %';
const fpEur=x=>new Intl.NumberFormat('fr-FR').format(x)+' €';
const TAX_YEAR=String(FP.year);
const TAX_PRESETS={
  none:{label:'Aucune retenue automatique',r:{}},
  me_bnc:{label:'Micro-entreprise · libéral non réglementé (BNC, SSI)',r:{urssaf:FP.micro.bnc.urssaf,cfp:FP.micro.bnc.cfp},vl:FP.micro.bnc.vl},
  me_cipav:{label:'Micro-entreprise · libéral réglementé (CIPAV)',r:{urssaf:FP.micro.cipav.urssaf,cfp:FP.micro.cipav.cfp},vl:FP.micro.cipav.vl},
  me_bics:{label:'Micro-entreprise · prestations de services (BIC)',r:{urssaf:FP.micro.bics.urssaf,cfp:FP.micro.bics.cfp},vl:FP.micro.bics.vl},
  me_bicv:{label:'Micro-entreprise · vente de marchandises (BIC)',r:{urssaf:FP.micro.vente.urssaf,cfp:FP.micro.vente.cfp},vl:FP.micro.vente.vl},
  salarie:{label:'Salaire d’employé · cotisations salariales et CSG/CRDS déjà prélevées',r:{urssaf:FP.salarie.cotis,ps:FP.salarie.csg},mode:'net'},
  foncier:{label:'Revenus fonciers (location nue) · prélèvements sociaux',r:{ps:FP.foncier.ps}},
  capital:{label:'Revenus de placement non prélevés à la source',r:{ps:FP.capital.ps}},
  custom:{label:'Taux personnalisés',r:{}}
};
const BUCKET_DEFAULT={'i-locatif':'immo','i-loisirs':'loisirs','i-contraint':'exploit'};
const BUCKETS=[['immo','Immobilier'],['loisirs','Revenus loisirs'],['exploit','Revenus d’exploitation'],['autre','Autres recettes']];
const TAX_DEFAULT=DIST?{'i-locatif':'foncier','i-contraint':'salarie'}:{'i-loisirs':'me_bnc','i-locatif':'foncier','i-contraint':'salarie'};
function taxFromPreset(id){const p=TAX_PRESETS[id]||TAX_PRESETS.none;return {preset:id,urssaf:p.r.urssaf||0,cfp:p.r.cfp||0,ps:p.r.ps||0,ir:0,vl:false,mode:p.mode||'brut',year:TAX_YEAR}}
function migrate(c){
  const d=defaultConfig();
  for(const k of Object.keys(d)) if(c[k]===undefined) c[k]=d[k];
  c.settings={...d.settings,...(c.settings||{})};
  c.player={...d.player,...(c.player||{})};
  c.fastTrack={...d.fastTrack,...(c.fastTrack||{})};
  if(!Array.isArray(c.fastTrack.businesses)) c.fastTrack.businesses=[];
  if(c.fastTrack.exitDate&&c.fastTrack.exitDate>todayISO()&&!c.fastTrack.targetDate){c.fastTrack.targetDate=c.fastTrack.exitDate;c.fastTrack.exitDate=null;if(!c.fastTrack.exitValidated)c.fastTrack.passiveAtExit=c.fastTrack.passiveAtExit??null}
  for(const k of (c.cats||[])) if(k.kind==='inc'&&!k.parent&&!k.tax) k.tax=taxFromPreset(TAX_DEFAULT[k.id]||'none');
  if(!(c.cats||[]).some(x=>x.id==='e-telecom')){const i=c.cats.findIndex(x=>x.id==='e-sante');const add=[{id:'e-telecom',kind:'exp',name:'Téléphonie et internet',parent:null,inRef:true},{id:'e-telecom-mobile',kind:'exp',name:'Forfait mobile',parent:'e-telecom',inRef:true},{id:'e-telecom-box',kind:'exp',name:'Box internet',parent:'e-telecom',inRef:true}];c.cats.splice(i<0?c.cats.length:i,0,...add)}
  for(const k of (c.cats||[]))if(k.id==='i-contraint'&&k.name==='Revenus du travail contraint')k.name='Revenus d’exploitation';
  if((c.taxV||0)<3){if(!(c.cats||[]).some(x=>x.id==='i-netfinal')){const i=(c.cats||[]).findIndex(x=>x.id==='i-declarer');c.cats.splice(i<0?c.cats.length:i+1,0,{id:'i-netfinal',kind:'inc',name:'Net final',parent:null,nature:'actif',netFinal:true,note:'Montant net final, rien à calculer',tax:taxFromPreset('none')})}}
  if((c.taxV||0)<2){const k=(c.cats||[]).find(x=>x.id==='i-contraint');if(k&&(!k.tax||k.tax.preset==='none'))k.tax=taxFromPreset('salarie')}
  if(!c.settings.perV){if(c.settings.expRef==='m3')c.settings.expRef='periode';if(c.settings.passiveSrc==='m3')c.settings.passiveSrc='periode';c.settings.perV=1}
  c.taxV=Math.max(c.taxV||0,3);
  for(const k of (c.cats||[]))if(k.tax&&k.tax.preset&&!['none','custom'].includes(k.tax.preset)&&TAX_PRESETS[k.tax.preset]&&String(k.tax.year||'')<TAX_YEAR){const t=taxFromPreset(k.tax.preset);k.tax={...k.tax,urssaf:t.urssaf,cfp:t.cfp,ps:t.ps,year:TAX_YEAR}}
  /* Entreprises : une par régime micro utilisé, créées une seule fois. */
  if(!Array.isArray(c.companies)){c.companies=[];const micro=c.cats.filter(x=>x.kind==='inc'&&!x.parent&&x.tax&&['me_bnc','me_cipav','me_bics','me_bicv'].includes(x.tax.preset));
    const byP={};for(const x of micro)(byP[x.tax.preset]=byP[x.tax.preset]||[]).push(x.id);
    for(const [pr,ids] of Object.entries(byP))c.companies.push({id:'co-'+pr,name:{me_bnc:'Micro-entreprise BNC',me_cipav:'Micro-entreprise BNC (CIPAV)',me_bics:'Micro-entreprise BIC services',me_bicv:'Micro-entreprise BIC vente'}[pr]||'Mon entreprise',regime:pr,incCats:ids})}
  if(c.companies.length&&!c.cats.some(x=>x.id==='e-pro')){const co=c.companies[0].id;
    c.cats.push({id:'e-pro',kind:'exp',name:'Charges d’entreprise',parent:null,inRef:true,companyId:co,note:'Cotisations, CFE, comptable, banque et assurance pro, logiciels'});
    for(const [id,n] of [['e-pro-cfe','CFE (cotisation foncière des entreprises)'],['e-pro-compta','Expert-comptable'],['e-pro-banque','Banque professionnelle'],['e-pro-assu','Assurance RC pro'],['e-pro-logiciels','Logiciels et abonnements pro'],['e-pro-autres','Autres charges d’entreprise']])c.cats.push({id,kind:'exp',name:n,parent:'e-pro',inRef:true})
    const u=c.cats.find(x=>x.id==='e-impots-urssaf');if(u&&u.companyId===undefined)u.companyId=co}
  /* Une fois : relie les lignes de charges des biens et entreprises aux contrats déjà saisis (même bien ou entreprise, même montant, même périodicité, sans ambiguïté). */
  if(!c.linkV){const cts=c.contracts||[];
    for(const [kind,list] of [['prop',c.properties||[]],['co',c.companies||[]]])for(const ow of list)for(const l of (ow.lines||[])){
      if(l.contractId&&!cts.some(x=>x.id===l.contractId))delete l.contractId;
      if(l.dir==='in'||l.contractId||l.amount==null)continue;
      const m=cts.filter(x=>!x.lineRef&&(kind==='prop'?x.propertyId===ow.id:x.companyId===ow.id)&&x.amount===l.amount&&(Number(x.period)||1)===(Number(l.per)||1));
      if(m.length===1){l.contractId=m[0].id;m[0].lineRef={kind,id:ow.id,line:l.id};MIG.linked++}}
    c.linkV=1;MIG.dirty=true}
  return c;
}
const MIG={dirty:false,linked:0};
let COVM0='m';try{COVM0=localStorage.getItem('cov-mode')||'m'}catch(e){}

const S={covMode:COVM0,covN:12,chartFull:null,cfg:migrate(defaultConfig()),months:{},prices:{history:{},src:{}},db:null,mode:'loading',route:'feuille',

const queues={};
function enqueue(path,fn){
  const p=(queues[path]||Promise.resolve()).then(fn);
  queues[path]=p.catch(e=>{console.warn(e);toast(e&&e.code==='quota_exceeded'?'Stockage plein : exporte puis supprime d’anciennes données.':'Échec de l’enregistrement. Vérifie ta connexion puis réessaie.')});
  return queues[path];
}
function saveCfg(){render();if(!S.db)return Promise.resolve();return enqueue('fin/config',()=>withRetry(()=>S.db.doc('fin/config').set(clone(S.cfg))))}
/* Écriture d’un mois : nouvelle tentative si la base est momentanément saturée ; pendant l’écriture, les mises à jour en direct sont ignorées pour ne pas écraser ce qui part. */
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function withRetry(fn){for(let i=0;;i++){try{return await fn()}catch(e){if(i<4&&e&&(e.code==='resource_exhausted'||e.code==='unavailable')){await sleep(400*(i+1)+Math.random()*300);continue}throw e}}}
function writeMonth(m){if(!S.db)return Promise.resolve();S.inflight=(S.inflight||0)+1;
  return enqueue('months/'+m,()=>withRetry(()=>{const items=clone(S.months[m]||[]);return items.length?S.db.doc('months/'+m).set({items}):S.db.doc('months/'+m).delete()})).finally(()=>{S.inflight--})}
function allOps(){return Object.values(S.months).flat()}
async function putOp(op,prevDate){
  const m=mk(op.date);
  if(prevDate&&mk(prevDate)!==m){const pm=mk(prevDate);S.months[pm]=(S.months[pm]||[]).filter(o=>o.id!==op.id);writeMonth(pm)}
  const arr=(S.months[m]||[]).filter(o=>o.id!==op.id);arr.push(op);S.months[m]=arr;render();
  await writeMonth(m);
  if(op.kind==='inc')await syncUrs(op);
}
/* Écriture groupée : un seul enregistrement par mois touché. */
async function bulkOps(adds,dels){const touched=new Set();
  for(const o of dels){const m=mk(o.date);S.months[m]=(S.months[m]||[]).filter(x=>x.id!==o.id);touched.add(m)}
  for(const o of adds){const m=mk(o.date);const arr=(S.months[m]||[]).filter(x=>x.id!==o.id);arr.push(o);S.months[m]=arr;touched.add(m)}
  render();/* Bloque les instantanés entrants pendant toute la série d’écritures, sinon un instantané intermédiaire écrase les mois pas encore écrits. */
  S.inflight=(S.inflight||0)+1;try{for(const m of [...touched].sort()){await writeMonth(m);await sleep(120)}}finally{S.inflight--}}
async function delOp(op){const m=mk(op.date);S.months[m]=(S.months[m]||[]).filter(o=>o.id!==op.id);render();await writeMonth(m);
  if(op.kind==='inc'){const l=findOp(URS.opId(op));if(l)await delOp(l)}}
function findOp(id){return allOps().find(o=>o.id===id)}

/* ==================== Calculs (centralisés) ==================== */
const C={
  cat(id){return S.cfg.cats.find(c=>c.id===id)},
  root(id){let c=C.cat(id),g=0;while(c&&c.parent&&g++<6){const p=C.cat(c.parent);if(!p)break;c=p}return c},
  catName(id){const c=C.cat(id);if(!c)return 'Sans catégorie';if(c.parent){const p=C.cat(c.parent);return (p?p.name+' › ':'')+c.name}return c.name},

  /* Montant qui touche le compte = o.amount. Net disponible = amount − retenues encore à payer. */

  opName(o){if(o.recName)return o.recName;const c=o.contractId&&S.cfg.contracts.find(x=>x.id===o.contractId);if(c)return c.name;return o.desc||C.catName(o.catId)},
  /* Dépense récurrente « obligatoire » : liée à un contrat, ou cotisation URSSAF liée à une recette. Les dépenses marquées récurrentes sans contrat (abonnements, dons…) restent des dépenses courantes. */
  /* Entreprise d’une dépense : choix manuel > cotisation liée à une recette > catégorie marquée. '-' = aucune. */
  companyOf(o){if(o.kind!=='exp')return null;const L=S.cfg.companies||[];if(!L.length)return null;
    if(o.companyId)return o.companyId==='-'?null:(L.some(x=>x.id===o.companyId)?o.companyId:null);
    const src=URS.src(o);if(src){const inc=findOp(src);if(inc){const rt=C.root(inc.catId);const co=rt&&L.find(x=>(x.incCats||[]).includes(rt.id));if(co)return co.id}}
    let c=C.cat(o.catId),g=0;while(c&&g++<6){if(c.companyId)return L.some(x=>x.id===c.companyId)?c.companyId:null;c=c.parent?C.cat(c.parent):null}return null},

  /* Une sous-catégorie peut porter son propre régime (ex. aides sociales non imposables sous Revenus d’exploitation). */

  irRate(t){return (Number(t.ir)||0)+(t.vl&&TAX_PRESETS[t.preset]&&TAX_PRESETS[t.preset].vl?TAX_PRESETS[t.preset].vl:0)},

    if(t.mode==='net'){const R=((Number(t.urssaf)||0)+(Number(t.cfp)||0)+(Number(t.ps)||0)+C.irRate(t))/100;if(R>=1)return null;base=amount/(1-R)}

  taxSummary(t){if(!t||t.preset==='none')return 'Aucune retenue automatique';const f=x=>String(x).replace('.',',')+' %';const parts=[];if(Number(t.urssaf))parts.push((t.mode==='net'?'Cotisations salariales ':'URSSAF ')+f(t.urssaf));if(Number(t.cfp))parts.push('CFP '+f(t.cfp));if(Number(t.ps))parts.push((t.mode==='net'?'CSG/CRDS ':'Prélèvements sociaux ')+f(t.ps));const ir=C.irRate(t);if(ir)parts.push((t.vl?'Impôt (dont versement libératoire) ':t.mode==='net'?'Prélèvement à la source ':'Impôt estimé ')+f(Math.round(ir*100)/100));return parts.join(' · ')||'Aucun taux'},

  range(from,to,ops){return (ops||allOps()).filter(o=>o.date>=from&&o.date<=to)},
  period(from,to){
    const r={inc:0,exp:0,incPrev:0,expPrev:0,rembours:0,exceptional:0,provision:0,passive:0,byCat:{},byCatPrev:{},count:0,toDeclare:0};

  firstMonth(){const ks=Object.keys(S.months).filter(k=>(S.months[k]||[]).length).sort();return ks[0]||null},
  /* Fenêtre des N derniers mois complets, sans remonter avant le premier mois saisi. */
  window(n){const cur=mk(todayISO());const first=C.firstMonth();if(!first)return {months:[],partial:false};

    if(!ms.length)return {months:[cur],partial:true};return {months:ms,partial:false}},
  monthAgg(ym){const from=ym+'-01',to=ym+'-'+String(lastDay(ym)).padStart(2,'0');return C.rangeAgg(from,to)},
  rangeAgg(from,to){let exp=0,pas=0,inc=0,out=0,pure=0,semi=0,rch=0;for(const o of C.range(from,to)){exp+=C.expRef(o);if(o.kind==='exp'&&C.isReal(o)&&o.propertyId&&C.isRental(o.propertyId))rch+=o.amount;pas+=C.passive(o);const z=C.pasSplit(o);pure+=z.pure;semi+=z.semi;if(C.isReal(o)){if(o.kind==='inc')inc+=o.amount;if(o.kind==='exp')out+=o.amount}}return {exp,pas,inc,out,cash:inc-out,pure,semi,rch}},
  propMonthly(p){let s=0;for(const l of p.lines||[]){if(l.amount==null)continue;const m=l.amount/(Number(l.per)||1);s+=l.dir==='in'?m:-m}
    if(p.detention==='indivision'&&p.mode==='detail'){if(p.quote==null)return null;s*=p.quote/100}return Math.round(s)},
  /* Rentabilité d'un bien, ramenée à ta quote-part. Montants en centimes, par an. */
  isFinLine(l){return l.fin!=null?!!l.fin:/cr[ée]dit|pr[êe]t|ptz|emprunt|kereis/i.test(l.label||'')},
  isRecupLine(l){return /r[ée]cup/i.test(l.label||'')},
  propYield(p){const sh=C.share(p);if(sh==null)return null;
    const ann=l=>l.amount==null?0:l.amount*12/(Number(l.per)||1);const rev=p.mode==='reverse';const k=rev?1:sh;

    const r=(a,b)=>a!=null&&b?a/b:null;const t=todayISO();const capY=LOAN.ok(p.loan)?Math.round(Math.max(0,LOAN.crdAt(p.loan,t)-LOAN.crdAt(p.loan,addMonthsISO(t,12)))*sh):0;
    return {sh,rev,rent:Math.round(rent),recup:Math.round(recup),opex:Math.round(opex),fin:Math.round(fin),noi:Math.round(noi),cf:Math.round(cf),cost,val,debt,
      gross:rev?null:r(rent,cost),net:r(noi,cost),netVal:r(noi,val),cfYield:r(cf,cost),coc:p.apport?r(cf,Math.round(p.apport*sh)):null,
      capY,total:r(cf+capY,cost),pv:cost!=null&&val!=null?val-cost:null,equity:val!=null?val-debt:null,eqYield:val!=null&&val-debt>0?cf/(val-debt):null}},
  passiveEstimated(){let s=0,missing=[];for(const p of S.cfg.properties){if(p.rental===false)continue;const v=C.propMonthly(p);if(v==null){missing.push(p.name);continue}s+=v}
    for(const x of S.cfg.passiveSources){if(C.isPassiveNature(x.nature||'passif'))s+=x.monthly||0}return {value:s,missing}},
  rr(range){
    const st=S.cfg.settings;const out={ref:null,refLabel:'',passive:0,pasLabel:'',pure:0,semi:0,target:Number(st.target)||100,partial:false,notes:[],perLabel:''};
    const R=range||periodRange();const nm=Math.max(1,R.months||1);const cur=todayISO();const part=R.from<=cur&&R.to>=cur&&R.to!==cur;
    const P=C.rangeAgg(R.from,R.to);const per=nm>1?`Moyenne/mois · ${R.label}`:(part?`${R.label} · en cours`:R.label);
    const win=n=>{const w=C.window(n);if(!w.months.length)return null;const a=w.months.map(C.monthAgg);const avg=k=>Math.round(a.reduce((s,x)=>s+x[k],0)/a.length);return {avg,lbl:w.partial?'Mois en cours (incomplet)':`Moyenne sur ${w.months.length} mois`,partial:w.partial}};

  balance(a,upto){if(a.initial==null)return null;if(upto&&a.initialDate&&upto<a.initialDate)return null;let b=a.initial;const since=a.initialDate||'0000-00-00';
    for(const o of allOps()){if(!C.isReal(o)||o.date<since||(upto&&o.date>upto))continue;

  /* Patrimoine à une date : soldes et capital des prêts recalculés à cette date ; autres valeurs prises dans leur historique. */
  netWorth(date){

  occurrences(r,untilISO){const out=[];if(!r.start||!r.freq)return out;let d=r.start,i=0;while(d<=untilISO&&i<400){if(!r.end||d<=r.end)out.push(d);i++;d=addMonthsISO(r.start,Number(r.freq)*i)}return out},
  pending(untilISO){const res=[];for(const r of S.cfg.recurrences){const done=r.done||{};for(const d of C.occurrences(r,untilISO)){if(done[d])continue;res.push({r,date:d})}}

/* ==================== Période ==================== */
function perNorm(){const p=S.period||{},t=todayISO(),cur=mk(t),cy=Number(t.slice(0,4)),cq=Math.ceil(Number(t.slice(5,7))/3);
  return {mode:p.mode||'month',ym:p.ym||cur,y:p.y||cy,q:p.q||cq,from:p.from,to:p.to,cur,cy,cq}}
function periodRange(){
  const n=perNorm();
  if(n.mode==='quarter'){const m0=n.y+'-'+String((n.q-1)*3+1).padStart(2,'0'),m2=addMonths(m0,2);const isCur=n.cur>=m0&&n.cur<=m2;
    return {from:m0+'-01',to:m2+'-'+lastDay(m2),label:`T${n.q} ${n.y}`,sub:`${MFR[(n.q-1)*3]} – ${MFR[(n.q-1)*3+2]}`,months:isCur?(Number(n.cur.slice(5,7))-((n.q-1)*3)):3,kind:'Trimestre'}}
  if(n.mode==='year'){return {from:n.y+'-01-01',to:n.y+'-12-31',label:'Année '+n.y,sub:'',months:n.y===n.cy?Number(n.cur.slice(5,7)):12,kind:'Année'}}
  if(n.mode==='12m'){const m=addMonths(n.cur,-11);return {from:m+'-01',to:n.cur+'-'+lastDay(n.cur),label:'12 derniers mois',sub:'',months:12,kind:'Période',nostep:true}}
  if(n.mode==='custom'&&n.from&&n.to){const a=new Date(n.from),b=new Date(n.to);const months=Math.max(1,Math.round((b-a)/2629800000));return {from:n.from,to:n.to,label:`${fdate(n.from)} → ${fdate(n.to)}`,sub:'',months,kind:'Période',nostep:true}}
  const label=mLabelL(n.ym);return {from:n.ym+'-01',to:n.ym+'-'+lastDay(n.ym),label:label.charAt(0).toUpperCase()+label.slice(1),sub:n.ym===n.cur?'mois en cours':'',months:1,kind:'Mois'};
}
function setPeriod(p){const n={...perNorm(),...p};const out={mode:n.mode};
  if(n.mode==='month'&&n.ym!==n.cur)out.ym=n.ym;
  if(n.mode==='quarter'&&!(n.y===n.cy&&n.q===n.cq)){out.y=n.y;out.q=n.q}
  if(n.mode==='year'&&n.y!==n.cy)out.y=n.y;
  if(n.mode==='custom'){out.from=n.from;out.to=n.to}
  S.period=out;LS.set('period2',out);render()}
function stepPeriod(d){const n=perNorm();
  if(n.mode==='month')setPeriod({mode:'month',ym:addMonths(n.ym,d)});
  else if(n.mode==='quarter'){let q=n.q+d,y=n.y;if(q<1){q=4;y--}if(q>4){q=1;y++}setPeriod({mode:'quarter',q,y})}
  else if(n.mode==='year')setPeriod({mode:'year',y:n.y+d})}
function periodPicker(tab){
  const n=perNorm();tab=tab||(['month','quarter','year'].includes(n.mode)?n.mode:'custom');let y=S.pickY||n.y;
  const body=()=>{let g='';
    if(tab==='month')g=`<div class="pk-grid c3">${MFRL.map((m,i)=>{const ym=y+'-'+String(i+1).padStart(2,'0');const on=n.mode==='month'&&n.ym===ym;return `<button class="pk ${on?'on':''} ${ym===n.cur?'cur':''}" data-act="pk-month" data-v="${ym}">${m}</button>`}).join('')}</div>`;

function covData(n){const first=C.firstMonth();if(!first)return null;const cur=mk(todayISO());

function niceMax(v){if(v<=0)return 100;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=1?1:n<=2?2:n<=5?5:10)*p}

function lineChart(labels,series,H=200,fmt=axisFmt,W=640){

  const mx=niceMax(Math.max(...all,0)),mn=Math.min(0,...all);const lo=mn<0?-niceMax(-mn):0;
  const x=i=>pl+(labels.length<=1?0:i*(W-pl-pr)/(labels.length-1));const y=v=>pt+(H-pt-pb)*(1-(v-lo)/(mx-lo));
  let g='';for(let k=0;k<=4;k++){const v=lo+(mx-lo)*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${fmt(v)}</text>`}
  {const ev=Math.max(1,Math.ceil(labels.length/Math.max(2,Math.floor((W-pl-pr)/52))));const lst=labels.length-1;labels.forEach((l,i)=>{if(!(i===lst||(i%ev===0&&lst-i>=Math.max(2,ev*0.75))))return;g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${i===labels.length-1&&labels.length>1?'end':'middle'}">${esc(l)}</text>`})}
  for(const s of series){let d='',pen=false;s.vals.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2"${s.dash?' stroke-dasharray="5 4" opacity=".7"':''}/>`;const li=s.vals.map((v,i)=>v==null?-1:i).filter(i=>i>=0).pop();if(li!=null&&li>=0)g+=`<circle cx="${x(li)}" cy="${y(s.vals[li])}" r="3.5" fill="${s.color}"/>`}
  return `<div class="legend">${series.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div><svg class="chart money" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(series.map(s=>s.name).join(', '))}">${g}</svg>`;
}
function barChart(labels,series,H=220,W=640){

  let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${axisFmt(v)}</text>`}

/* ==================== Guide : générer du cash et économiser ==================== */
const ACT_TYPES={presta:'Prestation (ton temps)',produit:'Produit / vente scalable',passif:'Revenu passif'};
const ACT_SUGG=['Coaching individuel','Coaching collectif','École de trail','Stage','Préparation physique','Copywriting','La Forme Durable','Zone 4E','Le Code du Mouvement','Le Guerrier Moderne','AURA'];
function planCfg(){S.cfg.plan=S.cfg.plan||{};const p=S.cfg.plan;p.activities=p.activities||[];if(!p.goalMode)p.goalMode='depenses';if(p.yieldPct==null)p.yieldPct=5;if(p.reducePct==null)p.reducePct=10;return p}
const ACT={
  /* Gain net d’une unité vendue : prix − cotisations calculées par la catégorie − frais directs. */
  unit(a){if(a.price==null)return null;const ar=a.catId?C.autoRet(a.catId,a.price):null;const t=a.catId?C.taxOf(a.catId):null;const ret=ar&&(!t||t.mode!=='net')?Object.values(ar).reduce((s,v)=>s+v,0):0;return {gross:a.price,ret,cost:a.cost||0,net:a.price-ret-(a.cost||0)}},
  hourly(a){const u=ACT.unit(a);return u&&a.hours?Math.round(u.net/a.hours):null},
  realized(a,from,to){let n=0,amt=0,ca=0;const kw=(a.keyword||'').trim().toLowerCase();if(!a.catId)return null;
    for(const o of C.range(from,to)){if(o.kind!=='inc'||!C.isReal(o))continue;const r=C.root(o.catId);if(o.catId!==a.catId&&(!r||r.id!==a.catId))continue;
      if(kw&&!((o.desc||'')+' '+(o.recName||'')+' '+(o.comment||'')).toLowerCase().includes(kw))continue;n++;amt+=C.net(o);ca+=o.amount}return {n,amt,ca}}
};
function planGoal(){const p=planCfg(),rr=C.rr();const cur=mk(todayISO()),from=cur+'-01',to=cur+'-'+lastDay(cur);
  if(p.goalMode==='custom')return {v:p.goalCustom||0,label:'Objectif personnalisé de cashflow',done:C.period(from,to).cashflow,doneLabel:'Cashflow déjà fait ce mois',doneSub:'recettes − dépenses'};
  let act=0;for(const o of C.range(from,to)){if(o.kind==='inc'&&C.isReal(o)&&!C.isPassiveNature(C.nature(o)))act+=C.net(o)}
  const v=rr.ref==null?null:(p.goalMode==='securite'?Math.round(rr.ref*1.2):rr.ref)-rr.passive;
  return {v,label:p.goalMode==='securite'?'Couvrir 120 % de tes dépenses, revenus passifs déduits':'Couvrir tes dépenses, revenus passifs déduits',done:act,doneLabel:'Déjà encaissé ce mois',doneSub:'revenus d’activité nets'};
}
function vGuide(){
  const tab=S.guideTab||'ft';
  const tabs=`<div class="seg" style="margin-top:6px">${[['cash','Générer du cash'],['eco','Économiser'],['ft','Feuille Fast Track']].map(([k,l])=>`<label><input type="radio" name="guide-tab" value="${k}" ${tab===k?'checked':''}>${l}</label>`).join('')}</div>`;
  return tabs+(tab==='cash'?vCash():tab==='eco'?vEco():vFast());
}
function vCash(){
  const p=planCfg(),rr=C.rr(),g=planGoal(),r=periodRange(),cur=mk(todayISO());const mFrom=cur+'-01',mTo=cur+'-'+lastDay(cur);
  const acts=p.activities;const vol=S.simVol||{};
  /* Volume par défaut du simulateur : ce qu’il reste à vendre ce mois par rapport à l’objectif de l’activité. */
  const contrib=acts.map((a,i)=>{const u=ACT.unit(a);const rz=ACT.realized(a,mFrom,mTo);const base=a.target!=null?a.target:(a.current||0);const v=vol[a.id]!=null?vol[a.id]:Math.max(0,base-(rz?rz.n:0));return {a,u,v,net:u?u.net*v:0,col:GREENS[i%GREENS.length]}});
  const total=contrib.reduce((s,x)=>s+x.net,0);const goal=g.v==null?null:Math.max(0,g.v-g.done);const pct=goal>0?Math.min(130,total/goal*100):(goal===0?100:0);
  let h=`<section class="hero-card plan-hero"><div class="hero-top"><span class="eyebrow">${esc(g.label)}</span><span class="pill">${goal==null?'objectif à définir':goal===0?'Objectif du mois atteint':total>=goal?'Couvert par ton plan':'Plan : il manque '+money(Math.max(0,goal-total))}</span></div>
    <div class="hero"><span class="big money num">${money(goal)}</span><span class="per">reste à générer ce mois</span></div>
    <div class="gauge" role="img" aria-label="Plan : ${Math.round(pct)} % de l’objectif"><div class="fill" style="width:${(pct/130*100).toFixed(1)}%"></div><div class="mk" style="left:${(100/130*100).toFixed(1)}%"><span>objectif</span></div></div>
    <div class="hstats"><div class="hstat"><div class="k">Objectif</div><div class="v num money">${money(g.v)}</div><small>par mois</small></div>
      <div class="hstat"><div class="k">${esc(g.doneLabel)}</div><div class="v num money">${moneyS(g.done)}</div><small>${esc(g.doneSub)}</small></div>
      <div class="hstat"><div class="k">Ton plan</div><div class="v num money">${money(total)}</div><small>ventes restantes</small></div></div></section>
  <div class="toolbar"><span class="small muted">Objectif</span><div class="miniseg">${[['depenses','Dépenses'],['securite','120 %'],['custom','Perso']].map(([k,l])=>`<button style="width:auto;padding:0 12px;border-radius:999px" class="${p.goalMode===k?'on':''}" data-act="plan-goal" data-v="${k}">${l}</button>`).join('')}</div>${p.goalMode==='custom'?`<input type="text" inputmode="decimal" id="plan-custom" value="${esc(cIn(p.goalCustom))}" placeholder="ex. 2 500" style="max-width:130px;min-height:36px"><button class="btn sm" data-act="plan-custom">OK</button>`:''}</div>`;
  /* Activités */
  h+=`<div class="panel"><div class="toolbar" style="margin:0 0 6px"><h3 style="margin:0">Tes activités</h3><span class="sp"></span><button class="btn sm" data-act="act-edit">+ Ajouter</button></div>
    ${acts.map(a=>{const u=ACT.unit(a),hr=ACT.hourly(a),rz=ACT.realized(a,mFrom,mTo);const tg=a.target||0;
      return `<div class="actrow"><button class="am" data-act="act-edit" data-id="${a.id}"><b>${esc(a.name)}</b><small>${esc(ACT_TYPES[a.type]||'')} · ${a.price==null?'<span class="warn">prix à compléter</span>':money(a.price)+' / '+esc(a.unit||'unité')}${u?` · net <b class="money">${money(u.net)}</b>`:''}${hr!=null?` · <b class="money">${money(hr)}</b>/h net`:''}</small></button>
        ${rz?`<div class="actprog"><span class="small">Ce mois : <b>${rz.n}</b>${tg?' / '+tg:''} · <b class="money pos">${money(rz.amt)}</b></span><span class="bar"><i style="width:${tg?Math.min(100,rz.n/tg*100):0}%"></i></span></div>`:''}</div>`}).join('')}
    ${(()=>{const have=new Set(acts.map(x=>(x.name||'').trim().toLowerCase()));const sug=ACT_SUGG.filter(n=>!have.has(n.toLowerCase()));
      const chips=`<div class="chips" style="margin-bottom:8px">${sug.map(n=>`<button class="chip" data-act="act-edit" data-name="${esc(n)}">+ ${esc(n)}</button>`).join('')}<button class="chip" data-act="act-edit">+ Autre activité</button></div>`;
      return acts.length?`<p class="small muted" style="margin:12px 0 6px">Ajouter une activité :</p>${chips}`
        :`<p class="small muted" style="margin:0 0 8px">Ajoute ce que tu vends : prix, durée, frais. Les cotisations sont déduites selon la catégorie de recette choisie. Idées :</p>${chips}`})()}
</div>`;
  if(acts.length){
    /* Évolution du chiffre d’affaires : somme des produits choisis */
    {const C2=caData(p,acts,cur);
      h+=`<div class="panel"><div class="toolbar" style="margin:0 0 6px"><h3 style="margin:0">Chiffre d’affaires par mois</h3><button class="btn sm ghost" data-act="ca-full" aria-label="Agrandir le graphique en plein écran" title="Plein écran">⤢</button><span class="sp"></span>
        <div class="miniseg">${[[6,'6 m'],[12,'12 m'],[24,'24 m']].map(([k,l])=>`<button style="width:auto;padding:0 10px;border-radius:999px" class="${C2.nM===k?'on':''}" data-act="ca-months" data-v="${k}">${l}</button>`).join('')}</div>
        <button class="btn sm" data-act="ca-pick">Produits (${C2.sel.length}/${acts.length})</button></div>
        ${C2.sel.length?caChart(C2,640,240):'<p class="empty">Choisis au moins un produit.</p>'}
        <p class="small muted" style="margin:4px 0 0">${caCaption(C2)}</p></div>`}
    /* Simulateur */
    h+=`<div class="panel"><h3>Simulateur</h3><p class="small muted" style="margin:0 0 8px">Fais varier les ventes ou clients qu’il te reste à faire ce mois, au-delà de ce qui est déjà encaissé. « Enregistrer » ajoute ce qui est déjà vendu et en fait ton objectif mensuel.</p>
      <div class="stackbar" role="img" aria-label="Contribution de chaque activité à l’objectif">${contrib.filter(x=>x.net>0).map(x=>`<i style="width:${Math.min(100,x.net/Math.max(goal||0,total||1)*100).toFixed(2)}%;background:${x.col}" title="${esc(x.a.name)} : ${money(x.net)}"></i>`).join('')}${goal>0&&total<goal?'':''}</div>
      <div class="stacklegend"><span>${money(total)} / ${money(goal)}</span><span class="${total>=goal?'pos':'neg'}">${goal==null?'':total>=goal?'+'+money(total-goal)+' de marge':'manque '+money(goal-total)}</span></div>
      ${contrib.map(x=>{const max=Math.max(20,Math.ceil((x.v||0)*2),x.a.target||0,x.u&&goal>0?Math.ceil(goal/Math.max(1,x.u.net)):0);const alone=x.u&&x.u.net>0&&goal>0?Math.ceil(goal/x.u.net):null;
        return `<div class="simrow"><div class="simh"><span><i style="background:${x.col}"></i>${esc(x.a.name)}</span><b class="num"><span id="sv-${x.a.id}">${x.v}</span> ${esc(x.a.unitPlural||x.a.unit||'unités')}/mois · <span class="money" id="sn-${x.a.id}">${money(x.net)}</span></b></div>
          <input type="range" min="0" max="${max}" step="1" value="${x.v}" data-sim="${x.a.id}" aria-label="${esc(x.a.name)} par mois" ${x.u?'':'disabled'}>
          <small class="muted">${x.u?`${alone!=null?`Seule, cette activité couvre l’objectif avec ${alone} ${esc(x.a.unitPlural||x.a.unit||'unités')}/mois${x.a.hours?' ('+Math.round(alone*x.a.hours)+' h)':''}.`:''}`:'Ajoute un prix pour simuler.'}</small></div>`}).join('')}
      <div class="toolbar" style="margin:10px 0 0"><button class="btn sm ghost" data-act="sim-reset">Revenir aux objectifs</button><span class="sp"></span><button class="btn sm solid" data-act="sim-save">Enregistrer comme objectifs</button></div></div>`;
    /* Projection 12 mois */
    const now=contrib.reduce((s,x)=>s+(x.u?x.u.net*(x.a.current||0):0),0);const full=contrib.reduce((s,x)=>s+(x.u?x.u.net*(x.a.target!=null?x.a.target:(x.a.current||0)):0),0);const G=g.v||0;const labs=[],cA=[],cB=[];let a1=0,b1=0;for(let i=1;i<=12;i++){labs.push(mLabel(addMonths(cur,i)).split(' ')[0]);a1+=now-G;b1+=full-G;cA.push(a1);cB.push(b1)}
    h+=`<div class="panel"><h3>Cash cumulé sur 12 mois</h3><p class="small muted" style="margin:0 0 6px">Ce qui reste (ou manque) chaque mois après l’objectif, cumulé : rythme actuel contre ton plan.</p>${lineChart(labs,[{name:'Rythme actuel',vals:cA,color:'var(--exp)'},{name:'Ton plan',vals:cB,color:'var(--inc)'}],200)}</div>`;
  }
  /* Vers la sortie de la Rat Race */
  const y=(Number(p.yieldPct)||5)/100;const capital=rr.missing100!=null&&y>0?Math.round(rr.missing100*12/y):null;
  const ms=C.window(3).months;const save=ms.length?Math.round(ms.reduce((s,m)=>s+C.monthAgg(m).cash,0)/ms.length):null;const planSave=acts.reduce((s,a)=>{const u=ACT.unit(a);return s+(u?u.net*(a.target!=null?a.target:(a.current||0)):0)},0)+(rr.passive||0)-(rr.ref||0);
  const yrs=(m)=>m>0&&capital?(capital/m/12):null;
  h+=`<div class="panel"><h3>Transformer ce cash en revenus passifs</h3><p class="small" style="margin:0 0 8px">Les revenus d’activité paient tes dépenses ; seuls des actifs te sortent de la Rat Race. Le surplus de ton plan devient du capital à placer.</p>
    <div class="grid2"><label class="f">Rendement net supposé des placements (%)<input type="number" step="0.5" id="plan-yield" value="${esc(p.yieldPct)}" data-change="plan-yield"></label><div class="kv"><span class="k">Capital nécessaire<small>pour ${money(rr.missing100)}/mois de passif à ${String(p.yieldPct).replace('.',',')} %</small></span><span class="v num money">${money(capital)}</span></div></div>
    <div class="kv"><span class="k">Rythme actuel<small>cashflow moyen des derniers mois</small></span><span class="v small">${save==null?'—':money(save)+'/mois'}${yrs(save)?' · '+yrs(save).toFixed(1).replace('.',',')+' ans':''}</span></div>
    <div class="kv"><span class="k">Avec ton plan<small>surplus mensuel une fois les dépenses couvertes</small></span><span class="v small">${money(planSave)}/mois${yrs(planSave)?' · <b>'+yrs(planSave).toFixed(1).replace('.',',')+' ans</b>':''}</span></div>
    <p class="small muted" style="margin:6px 0 0">Ordre de grandeur sans intérêts composés, avec une hypothèse de rendement à adapter. Pas un conseil en investissement.</p></div>`;
  return h;
}

/* ---------- Graphique du chiffre d’affaires ---------- */
function caData(p,acts,cur){const nM=Number(p.chartMonths)||12;const sel=(p.chartSel&&p.chartSel.length?p.chartSel:acts.map(a=>a.id)).map(id=>acts.find(a=>a.id===id)).filter(Boolean);
  const ms=[];for(let i=nM-1;i>=0;i--)ms.push(addMonths(cur,-i));let n=0;
  const vals=ms.map(m=>sel.reduce((t,a)=>{const z=ACT.realized(a,m+'-01',m+'-'+lastDay(m));if(z)n+=z.n;return t+(z?z.ca:0)},0));
  const goal=sel.reduce((t,a)=>t+(a.price||0)*(a.target!=null?a.target:(a.current||0)),0);
  return {nM,sel,ms,vals,goal,n,total:vals.reduce((a,b)=>a+b,0)}}
function caCaption(D){if(!D.sel.length)return '';const last=D.vals[D.vals.length-1];
  return `<b class="money">${money(D.total)}</b> sur ${D.nM} mois · ${D.n} vente${D.n>1?'s':''}${D.goal?` · ce mois <b class="money">${money(last)}</b> / objectif <b class="money">${money(D.goal)}</b> (${Math.round(last/D.goal*100)} %)`:' · ajoute un objectif par mois à tes activités pour voir la ligne d’objectif'}. Somme des produits choisis, montants encaissés avant cotisations.`}
function caChart(D,W,H){const pl=58,pr=14,pt=14,pb=28;const mx=niceMax(Math.max(...D.vals,D.goal||0,1));
  const x=i=>pl+(D.ms.length<=1?0:i*(W-pl-pr)/(D.ms.length-1)),y=v=>pt+(H-pt-pb)*(1-v/mx);const fs=Math.max(11,Math.round(W/60));
  let g='';for(let k=0;k<=4;k++){const v=mx*k/4;g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end" style="font-size:${fs}px">${axisFmt(v)}</text>`}
  const step=Math.ceil(D.ms.length/Math.max(3,Math.floor((W-pl-pr)/(fs*4.2))));
  D.ms.forEach((m,i)=>{if(i%step&&i!==D.ms.length-1)return;g+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===D.ms.length-1?'end':i===0?'start':'middle'}" style="font-size:${fs}px">${esc(mLabel(m).replace(' 20',' '))}</text>`});
  if(D.goal){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(D.goal)}" y2="${y(D.goal)}" stroke="var(--gold)" stroke-width="2.5" stroke-dasharray="7 5"/><text x="${W-pr}" y="${y(D.goal)-6}" text-anchor="end" style="font-size:${fs}px;fill:#a97a00;font-weight:700">Objectif ${axisFmt(D.goal)}</text>`}
  for(let i=1;i<D.vals.length;i++){const up=D.vals[i]>=D.vals[i-1];g+=`<line x1="${x(i-1)}" y1="${y(D.vals[i-1])}" x2="${x(i)}" y2="${y(D.vals[i])}" stroke="${up?'var(--ink)':'var(--exp)'}" stroke-width="3" stroke-linecap="round"/>`}
  D.vals.forEach((v,i)=>{const up=i===0||v>=D.vals[i-1];g+=`<circle cx="${x(i)}" cy="${y(v)}" r="${i===D.vals.length-1?5:3.2}" fill="${up?'var(--ink)':'var(--exp)'}"><title>${esc(mLabelL(D.ms[i]))} : ${money(v)}</title></circle>`});
  return `<div class="legend"><span><i style="background:var(--ink)"></i>En hausse</span><span><i style="background:var(--exp)"></i>En baisse</span>${D.goal?'<span><i style="background:var(--gold)"></i>Objectif du mois</span>':''}</div><svg class="chart money" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chiffre d’affaires mensuel des produits choisis">${g}</svg>`}
function caFull(){const p=planCfg(),acts=p.activities;const D=caData(p,acts,mk(todayISO()));
  const W=Math.max(300,Math.min(window.innerWidth-24,1400)),H=Math.max(300,window.innerHeight-(window.innerWidth<700?230:200));
  openModal('Chiffre d’affaires · '+(D.sel.length===acts.length?'tous les produits':D.sel.map(a=>a.name).join(', ')),`${caChart(D,W-32,H)}<p class="small muted" style="margin:0">${caCaption(D)}</p>`,'',{wide:true});
  const m=$('.modal');if(m){m.classList.add('fullchart')}}
function actForm(id,name){
  const p=planCfg();const a=id?p.activities.find(x=>x.id===id):{id:uid(),name:name||'',type:/zone|code|guerrier|aura|forme durable/i.test(name||'')?'produit':'presta',unit:/zone|code|guerrier|aura|forme durable/i.test(name||'')?'vente':'séance',catId:/copywriting/i.test(name||'')?'i-contraint':'i-loisirs'};
  cfgForm(id?'Activité · '+a.name:'Nouvelle activité',[
    {k:'name',l:'Nom',req:true},{k:'type',l:'Type',t:'select',o:Object.entries(ACT_TYPES)},
    {k:'catId',l:'Catégorie de recette (pour les cotisations et le suivi)',t:'select',o:[['','Aucune'],...S.cfg.cats.filter(c=>c.kind==='inc'&&!c.parent).map(c=>[c.id,c.name])]},
    {k:'price',l:'Prix de vente',t:'money'},{k:'unit',l:'Unité',ph:'séance, heure, stage, vente, mois…'},{k:'unitPlural',l:'Unité au pluriel',ph:'séances, ventes…'},
    {k:'hours',l:'Temps passé par unité (heures, préparation et trajet compris)',t:'number',h:'Sert à calculer ton taux horaire réel.'},
    {k:'cost',l:'Frais directs par unité',t:'money',h:'Déplacement, matériel, commission de plateforme…'},
    {k:'current',l:'Volume actuel par mois',t:'number'},{k:'target',l:'Objectif par mois',t:'number'},
    {k:'keyword',l:'Mot-clé pour retrouver les ventes dans tes recettes',ph:'ex. stage, Zone 4E',h:'Les recettes de la catégorie contenant ce mot sont comptées dans « Ce mois ».'},{k:'notes',l:'Notes',t:'area'}],a,(o)=>{
      for(const k of ['hours','current','target'])if(o[k]!=null&&o[k]<0){$('#cf-err').textContent='Les nombres doivent être positifs.';return false}
      Object.assign(a,o);if(!id)p.activities.push(a);if(S.simVol)delete S.simVol[a.id];saveCfg();toast('Activité enregistrée')},
    {onDelete:id?()=>{p.activities=p.activities.filter(x=>x.id!==id);saveCfg()}:null});
}
/* Mise à jour du simulateur sans tout redessiner */
document.addEventListener('input',e=>{const id=e.target.dataset&&e.target.dataset.sim;if(!id)return;S.simVol=S.simVol||{};S.simVol[id]=Number(e.target.value);
  const a=planCfg().activities.find(x=>x.id===id);const u=ACT.unit(a);const sv=$('#sv-'+id),sn=$('#sn-'+id);if(sv)sv.textContent=e.target.value;if(sn&&u)sn.textContent=money(u.net*Number(e.target.value));

/* ---------- Économies ---------- */
const ECO_TIPS={
  'e-frais':{t:'Frais de tenue de compte : une banque en ligne sans frais (tu as déjà BoursoBank) peut les supprimer.',pct:100},
  'e-transport-assu':{t:'Assurance auto : après un an de contrat, elle se résilie à tout moment (loi Hamon). Compare à garanties égales.',pct:15},
  'e-assurances':{t:'Vérifie l’utilité du contrat et mets-le en concurrence à garanties égales.',pct:10},
  'e-sante':{t:'Mutuelle : résiliable à tout moment après un an ; compare les garanties dont tu te sers vraiment.',pct:10},
  'e-telecom':{t:'Téléphonie et internet : compare ton forfait mobile et ta box à ton usage réel ; les offres sans engagement se changent facilement.',pct:30},
  'e-loisirs':{t:'Abonnements et loisirs : liste ce que tu utilises vraiment chaque mois.',pct:20},
  'e-restos':{t:'Sorties et restaurants : fixe une enveloppe mensuelle.',pct:20},
  'e-courses':{t:'Courses : liste, achats groupés, marques distributeur.',pct:10},
  'e-transport':{t:'Transport : regroupe les trajets, compare les carburants, covoiturage pour les stages.',pct:10}
};
function ecoTip(c){const n=(c.name+' '+(c.org||'')).toLowerCase();
  if(/emprunteur|kereis/.test(n))return {t:'Assurance emprunteur : changeable à tout moment, sans frais (loi Lemoine). Compare avec des offres en délégation.',pct:15};
  if(/habitation/.test(n))return {t:'Assurance habitation : résiliable à tout moment après un an (loi Hamon). Compare à garanties égales.',pct:15};
  if(/auto/.test(n))return ECO_TIPS['e-transport-assu'];
  if(/bpce vie/.test(n))return {t:'Vérifie ce que couvre ce contrat (prévoyance, obsèques, épargne…) et s’il fait doublon avec un autre.',pct:0};
  if(/iard/.test(n))return {t:'Précise l’objet de ce contrat : vérifie qu’il ne fait pas doublon avec ton assurance habitation GMF.',pct:0};
  const r=C.root(c.catId);return ECO_TIPS[c.catId]||(r&&ECO_TIPS[r.id])||null}
function vEco(){
  const p=planCfg(),rr=C.rr();const red=(Number(p.reducePct)||0)/100;
  const cts=S.cfg.contracts.filter(c=>CT.active(c)&&CT.monthly(c)!=null).map(c=>({c,m:CT.monthly(c),tip:ecoTip(c)})).sort((a,b)=>b.m-a.m);
  const ms=C.window(3).months;const cour={};for(const m of ms){const from=m+'-01',to=m+'-'+lastDay(m);for(const o of C.range(from,to)){if(o.kind!=='exp'||!C.isReal(o)||C.isRecurringOp(o))continue;const r=C.root(o.catId);const k=r?r.id:'_none';cour[k]=(cour[k]||0)+o.amount}}
  const courL=Object.entries(cour).map(([k,v])=>({k,m:Math.round(v/Math.max(1,ms.length)),tip:ECO_TIPS[k]})).sort((a,b)=>b.m-a.m);
  const potC=cts.reduce((s,x)=>s+(x.tip?Math.round(x.m*x.tip.pct/100):0),0);const potV=courL.reduce((s,x)=>s+Math.round(x.m*red),0);const pot=potC+potV;
  const y=(Number(p.yieldPct)||5)/100;
  let h=`<section class="hero-card eco-hero"><div class="hero-top"><span class="eyebrow">Économies possibles, selon les hypothèses ci-dessous</span></div>
    <div class="hero"><span class="big money num">${money(pot)}</span><span class="per">par mois · ${money(pot*12)} par an</span></div>
    <div class="hstats"><div class="hstat"><div class="k">Charges fixes</div><div class="v num money">${money(potC)}</div><small>en renégociant</small></div>
      <div class="hstat"><div class="k">Dépenses courantes</div><div class="v num money">${money(potV)}</div><small>à −${p.reducePct} %</small></div>
      <div class="hstat"><div class="k">Effet Rat Race</div><div class="v num money">${money(y>0?Math.round(pot*12/y):null)}</div><small>de capital en moins à réunir</small></div></div></section>
  <p class="small muted" style="margin:10px 2px 0">Chaque euro économisé par mois baisse tes dépenses de référence : il faut alors moins de revenus passifs pour sortir de la Rat Race.</p>`;
  h+=`<div class="panel"><h3>Charges fixes, de la plus lourde à la plus légère</h3>${cts.length?cts.map(x=>`<div class="ecorow"><button class="am" data-act="edit-contract" data-id="${x.c.id}"><b>${esc(x.c.name)}</b><small>${esc(x.c.org||'')} · ${money(x.m)}/mois · ${money(x.m*12)}/an</small>${x.tip?`<span class="small">${esc(x.tip.t)}</span>`:''}</button><span class="ecopot">${x.tip&&x.tip.pct?`<b class="money pos">−${money(Math.round(x.m*x.tip.pct/100))}</b><small>/mois si −${x.tip.pct} %</small>`:x.tip?'<small class="warn">à vérifier</small>':'<small class="muted">peu de marge</small>'}</span></div>`).join(''):'<p class="empty">Aucune charge fixe chiffrée.</p>'}</div>`;
  h+=`<div class="panel"><div class="toolbar" style="margin:0 0 6px"><h3 style="margin:0">Dépenses courantes</h3><span class="sp"></span><label class="small" style="display:flex;align-items:center;gap:6px">Réduction visée <input type="number" id="eco-red" min="0" max="80" step="5" value="${esc(p.reducePct)}" data-change="eco-red" style="width:76px;min-height:34px"> %</label></div>
    <p class="small muted" style="margin:0 0 6px">Moyenne mensuelle sur ${ms.length||0} mois, hors charges récurrentes.</p>
    ${courL.length?courL.map(x=>`<div class="ecorow"><div class="am"><b>${esc(x.k==='_none'?'Sans catégorie':(C.cat(x.k)||{}).name)}</b><small>${money(x.m)}/mois</small>${x.tip?`<span class="small">${esc(x.tip.t)}</span>`:''}</div><span class="ecopot"><b class="money pos">−${money(Math.round(x.m*red))}</b><small>/mois</small></span></div>`).join(''):'<p class="empty">Pas encore assez de dépenses courantes saisies. Elles apparaîtront ici au fil du mois.</p>'}</div>
  <p class="small muted" style="margin:10px 2px 0">Les pourcentages sont des hypothèses pour donner un ordre de grandeur : compare les offres avant de résilier quoi que ce soit.</p>`;
  return h;
}

  let cum=start||0;const rows=ft.businesses.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(b=>{cum+=b.monthly||0;return {b,cum}});

  if(!out)h+=`<div class="locked"><b>Où tu en es :</b> <span class="num money">${money(rr.passive)}</span> de revenus passifs nets pour <span class="num money">${money(rr.ref)}</span> de dépenses de référence (${rr.coverage==null?'—':PF.format(rr.coverage)}). Il te manque <b class="num money">${money(rr.missing100)}</b> par mois.

    <p class="small muted" style="margin:8px 0 0">Tu peux déjà préparer ton Rêve et ta date de sortie visée.</p></div>`;
