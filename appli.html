    <ol style="margin:6px 0 0;padding-left:20px"><li>Acheter ton <b>Rêve</b>.</li><li>Augmenter ton cashflow mensuel en ajoutant des sources de revenus passifs.</li></ol>
    <div class="grp">Tu gagnes si</div>
    <p style="margin:4px 0 0">A) tu achètes ton Rêve, <b>ou</b><br>B) tu atteins ton objectif de revenu Fast Track.</p>
    <div class="ft-box" style="margin-top:14px"><div class="band">Ton Rêve</div><div class="in">
      <div class="kv"><span class="k">Rêve</span><span class="v">${esc(ft.dreamName||'à définir')}</span></div>
      <div class="kv"><span class="k">Coût</span><span class="v num money">${money(ft.dreamCost)}</span></div>
      <div class="kv"><span class="k">Déjà mis de côté</span><span class="v num money">${money(ft.dreamSaved)}</span></div>
      ${ft.dreamCost?`<div class="gauge" style="margin:12px 0 6px"><div class="fill" style="width:${Math.min(100,100*(ft.dreamSaved||0)/ft.dreamCost).toFixed(1)}%"></div></div>`:''}
      <p style="margin:10px 0 0"><button class="btn sm" data-act="ft-edit">Modifier le Rêve et l’objectif</button></p></div></div>
  </div><div>
    <div class="ft-box"><div class="band">Ton départ</div><div class="in">
      <div class="kv"><span class="k">Revenu passif net à la sortie</span><span class="v num money">${money(start)}</span></div>
      <div class="kv"><span class="k">Date de sortie réelle<small>enregistrée en validant ta sortie</small></span><span class="v num">${fdate(ft.exitDate)}</span></div>
      <div class="kv"><span class="k">Date de sortie visée<small>ton objectif</small></span><span class="v num">${fdate(ft.targetDate)}</span></div>
      ${ft.exitDate?'<p style="margin:8px 0 0"><button class="btn sm ghost" data-act="ft-unvalidate">Annuler la sortie enregistrée</button></p>':''}</div></div>
    <div class="ft-box" style="margin-top:14px"><div class="band">Comment gagner</div><div class="in">
      <div class="kv"><span class="k">Revenu Fast Track de départ</span><span class="v num money">${money(start)}</span></div>
      <div class="kv"><span class="k">Cashflow supplémentaire visé</span><span class="v num money">${ft.goalExtra==null?'à définir':'+ '+money(ft.goalExtra)}</span></div>
      <div class="kv strong"><span class="k">Ton objectif de revenu Fast Track</span><span class="v num money">${money(goal)}</span></div></div></div>
  </div></div>
  <div class="band" style="margin-top:20px;justify-content:center">Registre de tes revenus Fast Track</div>
  <div class="box"><p class="small muted" style="margin:8px 0">Ton revenu Fast Track = revenu de départ + le cashflow de chaque nouvelle source de revenus passifs acquise après ta sortie.</p>
  <div class="kv"><span class="k">Revenu Fast Track de départ</span><span class="v num money">${money(start)}</span></div>
  <div class="scrollx" style="border:0;margin-top:6px"><table class="year" style="min-width:520px"><thead><tr><th>Source / entreprise</th><th>Date</th><th>Cashflow mensuel</th><th>Nouveau revenu Fast Track</th></tr></thead><tbody>
  ${rows.length?rows.map(({b,cum})=>`<tr><td><button class="linkbtn" data-act="ft-biz" data-id="${b.id}">${esc(b.name)}</button></td><td>${fdate(b.date)}</td><td class="money">${money(b.monthly)}</td><td class="money">${start==null?'—':money(cum)}</td></tr>`).join(''):`<tr><td colspan="4" style="text-align:left" class="muted">Aucune source ajoutée pour l’instant.</td></tr>`}
  </tbody></table></div>
  ${goal!=null&&cur!=null?`<div class="kv strong"><span class="k">Revenu Fast Track actuel</span><span class="v num money ${cur>=goal?'pos':''}">${money(cur)}</span></div>`:''}
  <p style="margin:10px 0 0"><button class="btn sm" data-act="ft-biz">+ Ajouter une source</button></p></div>`;
  return h;
}

/* ==================== Vue : Historique ==================== */
function vHist(){
  if(S.histOpen==null){try{S.histOpen=localStorage.getItem('hist-open')!=='0'}catch(e){S.histOpen=true}}
  const f=S.hist;const accs=S.cfg.accounts;
  let ops=allOps().slice();
  if(f.from)ops=ops.filter(o=>o.date>=f.from);if(f.to)ops=ops.filter(o=>o.date<=f.to);
  if(f.kind)ops=ops.filter(o=>o.kind===f.kind);
  if(f.cat)ops=ops.filter(o=>o.catId===f.cat||(C.cat(o.catId)&&C.cat(o.catId).parent===f.cat));
  if(f.acc)ops=ops.filter(o=>o.accountId===f.acc||o.toAccountId===f.acc);
  if(f.prop)ops=ops.filter(o=>o.propertyId===f.prop);
  if(f.status==='reel')ops=ops.filter(C.isReal);if(f.status==='prevu')ops=ops.filter(o=>!C.isReal(o));
  if(f.q){const q=f.q.toLowerCase();ops=ops.filter(o=>[o.desc,o.comment,C.catName(o.catId),o.origin,o.activity].join(' ').toLowerCase().includes(q))}
  ops.sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||'').localeCompare(a.createdAt||''));
  const shown=ops.slice(0,300);
  let h=`<div class="panel" style="margin-top:6px"><h3>Filtres</h3><div class="grid3">
    <label class="f">Du<input type="date" id="hf-from" data-change="hist" value="${esc(f.from||'')}"></label>
    <label class="f">Au<input type="date" id="hf-to" data-change="hist" value="${esc(f.to||'')}"></label>
    <label class="f">Type<select id="hf-kind" data-change="hist"><option value="">Tout</option><option value="exp" ${f.kind==='exp'?'selected':''}>Dépenses</option><option value="inc" ${f.kind==='inc'?'selected':''}>Recettes</option><option value="tr" ${f.kind==='tr'?'selected':''}>Transferts</option></select></label>
    <label class="f">Catégorie<select id="hf-cat" data-change="hist"><option value="">Toutes</option>${catOptions(null,f.cat)}</select></label>
    <label class="f">Compte<select id="hf-acc" data-change="hist"><option value="">Tous</option>${accs.map(a=>`<option value="${a.id}" ${f.acc===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></label>
    <label class="f">Bien<select id="hf-prop" data-change="hist"><option value="">Tous</option>${S.cfg.properties.map(p=>`<option value="${p.id}" ${f.prop===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label>
    <label class="f">Statut<select id="hf-status" data-change="hist"><option value="">Tous</option><option value="reel" ${f.status==='reel'?'selected':''}>Payé / encaissé</option><option value="prevu" ${f.status==='prevu'?'selected':''}>Prévu / à encaisser</option></select></label>
    <label class="f" style="grid-column:span 2">Mot-clé<input type="search" id="hf-q" data-change="hist" value="${esc(f.q)}" placeholder="Description, commentaire…"></label>
  </div><div class="toolbar"><button class="btn ghost sm" data-act="hist-reset">Effacer les filtres</button><span class="sp"></span><span class="small muted">${ops.length} opération${ops.length>1?'s':''}${ops.length>300?' (300 premières affichées)':''}</span></div></div>`;
  const open=S.histOpen!==false;
  h+=`<div class="panel"><div class="toolbar" style="margin:0 0 ${open?'6px':'0'}"><h3 style="margin:0">Opérations</h3><span class="sp"></span><button class="btn sm" data-act="hist-toggle" aria-expanded="${open}">${open?'▴ Réduire':'▾ Afficher les '+ops.length}</button></div>${open?(shown.length?opList(shown):'<p class="empty">Aucune opération ne correspond. Ajoute une dépense ou une recette avec les boutons en bas.</p>')+(shown.length>8?'<p style="margin:8px 0 0;text-align:center"><button class="btn sm ghost" data-act="hist-toggle">▴ Réduire la liste pour voir les graphiques</button></p>':''):''}</div>`;
  h+=`<a class="panel linkpanel" href="#graphiques"><b>Graphiques</b><span class="small muted">Recettes et dépenses, revenus passifs, cashflow, patrimoine et vue annuelle</span><span aria-hidden="true">›</span></a>`;
  return h;
}
function vGraphiques(){return analyses()}
function opLine(o){
  const isT=o.kind==='tr';const sign=o.kind==='exp'?'-':o.kind==='inc'?'+':'';const cls=o.kind==='exp'?'neg':o.kind==='inc'?'pos':'';
  const a=C.acc(o.accountId),b=C.acc(o.toAccountId);
  const badges=[];if(!C.isReal(o))badges.push(`<span class="badge warn">${o.kind==='inc'&&o.status==='a_encaisser'?'à encaisser':'prévu'}</span>`);
  if(C.incomplete(o))badges.push('<span class="badge">incomplet</span>');
  const root=C.root(o.catId);if(root&&root.declarer&&o.declStatus)badges.push(`<span class="badge warn">${esc(DECL[o.declStatus]||'')}</span>`);
  if(o.anticip&&o.date>todayISO())badges.push('<span class="badge warn">à venir</span>');if(o.recur==='recurrent')badges.push('<span class="badge">récurrent</span>');if(o.recur==='exceptionnel')badges.push('<span class="badge">exceptionnel</span>');
  return `<button class="op" data-act="edit-op" data-id="${o.id}"><span class="t">${esc(isT?(o.desc||'Transfert'):C.opName(o))}${badges.join('')}</span><span class="a num money ${cls}">${sign}${money(o.amount)}</span>
    <span class="m">${isT?`${esc(a?a.name:'?')} → ${esc(b?b.name:'?')}`:`${esc(C.catName(o.catId))} · ${esc(a?a.name:'compte ?')}`}${o.propertyId&&C.prop(o.propertyId)?' · '+esc(C.prop(o.propertyId).name):''}</span><span class="m" style="text-align:right">${o.kind==='inc'&&C.retTotal(o)?'net '+money(C.net(o)):''}</span></button>`;
}
function opList(ops){let h='<div class="oplist">',d=null;for(const o of ops){if(o.date!==d){d=o.date;h+=`<div class="daysep">${fdate(d)}</div>`}h+=opLine(o)}return h+'</div>'}
function analyses(){
  const cur=mk(todayISO());const ms=[];for(let i=11;i>=0;i--)ms.push(addMonths(cur,-i));
  const ag=ms.map(m=>C.monthAgg(m));const labs=ms.map(m=>mLabel(m).split(' ')[0]);
  let h=chartPanel('an-rd','Recettes et dépenses, 12 derniers mois',(W,H)=>barChart(labs,[{name:'Recettes',vals:ag.map(a=>a.inc),color:'var(--pos)'},{name:'Dépenses',vals:ag.map(a=>a.out),color:'var(--neg)'}],H,W),{H:220});
  h+=miniCoverage();
  h+=chartPanel('an-cf','Cashflow mensuel et revenus passifs',(W,H)=>lineChart(labs,[{name:'Cashflow mensuel',vals:ag.map(a=>a.cash),color:'var(--ink)'},{name:'Revenus passifs nets',vals:ag.map(a=>a.pas),color:'var(--pos)'}],H,axisFmt,W));
  h+=chartPanel('an-cov','Progression vers la sortie de la Rat Race',(W,H)=>lineChart(labs,[{name:'Couverture des dépenses par les revenus passifs',vals:ag.map(a=>a.exp?Math.round(a.pas/a.exp*100):null),color:'var(--pos)'}],H,v=>Math.round(v)+' %',W));
  /* Répartition des dépenses (12 mois) et moyennes */
  const from=ms[0]+'-01',to=cur+'-'+lastDay(cur);const st=C.period(from,to);
  const exps=S.cfg.cats.filter(c=>c.kind==='exp'&&!c.parent).map(c=>[c,st.byCat[c.id]||0]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]);
  const mx=exps.length?exps[0][1]:1;const nM=C.firstMonth()?Math.max(1,ms.filter(m=>m>=C.firstMonth()).length):1;
  h+=`<div class="panel"><h3>Répartition des dépenses (12 mois) et moyenne mensuelle</h3>${exps.length?exps.map(([c,v])=>`<div class="hbar"><span class="n">${esc(c.name)}</span><span><span class="b" style="display:block;width:${(v/mx*100).toFixed(1)}%"></span></span><span class="num money">${money(v)} <span class="muted">· ${money(Math.round(v/nM))}/mois</span></span></div>`).join(''):'<p class="empty">Pas encore de dépenses.</p>'}</div>`;
  /* Patrimoine */
  const nwh=S.cfg.nwHistory||[];if(nwh.length>1)h+=chartPanel('an-nw','Évolution du patrimoine net',(W,H)=>lineChart(nwh.map(x=>mLabel(x.m)),[{name:'Patrimoine net',vals:nwh.map(x=>x.assets-x.debts),color:'var(--ink)'}],H,axisFmt,W));
  /* Vue annuelle */
  const y=S.hist.year;const yms=[];for(let i=1;i<=12;i++)yms.push(y+'-'+String(i).padStart(2,'0'));
  const per=yms.map(m=>C.period(m+'-01',m+'-'+lastDay(m)));
  const line=(c)=>{const vals=per.map(p=>p.byCat[c.id]||0);const t=vals.reduce((a,b)=>a+b,0);if(!t)return '';return `<tr><td>${esc(c.name)}</td>${vals.map(v=>`<td class="money">${v?money(v):''}</td>`).join('')}<td class="money"><b>${money(t)}</b></td></tr>`};
  const sum=(k)=>per.map(p=>p[k]);
  h+=`<div class="panel"><div class="toolbar" style="margin:0 0 8px"><h3 style="margin:0">Vue annuelle</h3><span class="sp"></span><button class="btn sm ghost" data-act="year" data-d="-1">‹ ${y-1}</button><b>${y}</b><button class="btn sm ghost" data-act="year" data-d="1">${y+1} ›</button></div>
  <div class="scrollx"><table class="year"><thead><tr><th>Catégorie</th>${MFR.map(m=>`<th>${m}</th>`).join('')}<th>Total</th></tr></thead><tbody>
  <tr><td colspan="14" style="text-align:left"><b>Recettes</b></td></tr>${S.cfg.cats.filter(c=>c.kind==='inc'&&!c.parent).map(line).join('')}
  <tr class="tot"><td>Total recettes</td>${sum('inc').map(v=>`<td class="money">${money(v)}</td>`).join('')}<td class="money">${money(sum('inc').reduce((a,b)=>a+b,0))}</td></tr>
  <tr><td colspan="14" style="text-align:left"><b>Dépenses</b></td></tr>${S.cfg.cats.filter(c=>c.kind==='exp'&&!c.parent).map(line).join('')}
  <tr class="tot"><td>Total dépenses</td>${sum('exp').map(v=>`<td class="money">${money(v)}</td>`).join('')}<td class="money">${money(sum('exp').reduce((a,b)=>a+b,0))}</td></tr>
  <tr class="tot"><td>Cashflow</td>${sum('cashflow').map(v=>`<td class="money ${v<0?'neg':''}">${money(v)}</td>`).join('')}<td class="money">${money(sum('cashflow').reduce((a,b)=>a+b,0))}</td></tr>
  <tr class="tot"><td>Revenus passifs nets</td>${sum('passive').map(v=>`<td class="money">${money(v)}</td>`).join('')}<td class="money">${money(sum('passive').reduce((a,b)=>a+b,0))}</td></tr>
  </tbody></table></div></div>`;
  return h;
}

/* ==================== Vue : Comptes ==================== */
function vComptes(){
  let h=`<div class="toolbar"><h2 class="sheet-title" style="margin:6px 0">Mes comptes</h2><span class="sp"></span><button class="btn" data-act="new-tr">⇄ Transfert entre mes comptes</button><button class="btn" data-act="new-account">+ Ajouter un compte</button></div>
  <p class="small muted">Le solde théorique part du solde initial et ajoute les opérations payées ou encaissées depuis sa date. Ce n’est pas un solde bancaire officiel : compare-le de temps en temps avec ton appli bancaire. Aucun identifiant bancaire n’est demandé ni stocké.</p><div class="cards">`;
  for(const a of S.cfg.accounts){const b=C.balance(a);const gap=b!=null&&a.real!=null?a.real-b:null;
    h+=`<div class="card"><div class="ch"><h3>${esc(a.name)}</h3><span class="small">${esc(a.type||'')}</span></div><div class="cb">
      <div class="kv strong"><span class="k">Solde théorique</span><span class="v num money">${b==null?'—':money(b)}</span></div>
      ${b==null?'<p class="small warn" style="margin:6px 0">Renseigne un solde initial et sa date pour calculer le solde.</p>':''}
      <div class="kv"><span class="k">Solde initial<small>${a.initialDate?'au '+fdate(a.initialDate):'date à renseigner'}</small></span><span class="v num money">${money(a.initial)}</span></div>
      <div class="kv"><span class="k">Solde réel relevé<small>${a.realDate?'le '+fdate(a.realDate):'jamais relevé'}</small></span><span class="v num money">${money(a.real)}</span></div>
      ${gap!=null?`<div class="kv"><span class="k">Écart réel − théorique</span><span class="v num money ${gap?'warn':'pos'}">${moneyS(gap)}</span></div>`:''}

const GREENS=['#2fae74','#4fc08b','#73cfa3','#97ddbb','#b8e9d0','#d4f3e3','#e8f9f0'];
const REDS=['#ec7464','#f08c7e','#f4a498','#f7bbb2','#f9cec7','#fbdfda','#fdeeeb'];
function accData(aid,from,to){
  const inc={},out={};const add=(m,k,l,o,a)=>{const x=m[k]=m[k]||{k,label:l,amount:0,ops:[]};x.amount+=a;x.ops.push(o)};
  for(const o of C.range(from,to)){if(!C.isReal(o))continue;
    if(o.kind==='tr'){if(o.toAccountId===aid)add(inc,'_tr','Virements reçus',o,o.amount);if(o.accountId===aid)add(out,'_tr','Virements émis',o,o.amount);continue}
    if(o.accountId!==aid)continue;const r=C.root(o.catId);const k=r?r.id:'_none',l=r?r.name:'Sans catégorie';
    if(o.kind==='inc')add(inc,k,l,o,o.amount);else add(out,k,l,o,o.amount)}
  const sort=m=>Object.values(m).sort((a,b)=>b.amount-a.amount);
  const I=sort(inc),O=sort(out);return {inc:I,out:O,ti:I.reduce((s,x)=>s+x.amount,0),to:O.reduce((s,x)=>s+x.amount,0)};
}
function accMini(a){const r=periodRange();const d=accData(a.id,r.from,r.to);const tot=d.ti+d.to;

    <span class="am-bar">${tot?`<i style="width:${(d.ti/tot*100).toFixed(1)}%;background:${GREENS[0]}"></i><i style="width:${(d.to/tot*100).toFixed(1)}%;background:${REDS[0]}"></i>`:'<i style="width:100%;background:var(--line)"></i>'}</span>
    <span class="am-t"><b class="pos money">+${money(d.ti)}</b> <b class="neg money">−${money(d.to)}</b><small>${esc(r.label)} · Répartition</small></span></button>`}
function donut(items,total,pal,side,sel){
  if(!total)return `<div class="donut-empty">Aucune ${side==='in'?'entrée':'sortie'} sur la période</div>`;
  const R=70,r0=44,cx=90,cy=90;let a0=-Math.PI/2;let g='';
  items.forEach((x,i)=>{const frac=x.amount/total;const a1=a0+frac*Math.PI*2;const big=a1-a0>Math.PI?1:0;const on=sel===side+':'+x.k;const RR=on?R+6:R;
    const p=frac>=0.9999?`M${cx} ${cy-RR}A${RR} ${RR} 0 1 1 ${cx-0.01} ${cy-RR}L${cx-0.01} ${cy-r0}A${r0} ${r0} 0 1 0 ${cx} ${cy-r0}Z`
      :`M${cx+RR*Math.cos(a0)} ${cy+RR*Math.sin(a0)}A${RR} ${RR} 0 ${big} 1 ${cx+RR*Math.cos(a1)} ${cy+RR*Math.sin(a1)}L${cx+r0*Math.cos(a1)} ${cy+r0*Math.sin(a1)}A${r0} ${r0} 0 ${big} 0 ${cx+r0*Math.cos(a0)} ${cy+r0*Math.sin(a0)}Z`;
    g+=`<path d="${p}" fill="${pal[i%pal.length]}" stroke="var(--card)" stroke-width="2" data-act="acc-sel" data-k="${side}:${x.k}" style="cursor:pointer;opacity:${sel&&!on?.55:1}"><title>${esc(x.label)} : ${money(x.amount)}</title></path>`;a0=a1});
  return `<svg viewBox="0 0 180 180" class="donut" role="img" aria-label="Répartition${side==='in'?' des entrées':side==='out'?' des sorties':''}">${g}<text x="90" y="86" text-anchor="middle" class="d-k">${side==='in'?'Entrées':side==='out'?'Sorties':'Total'}</text><text x="90" y="104" text-anchor="middle" class="d-v money">${esc(money(total))}</text></svg>`;
}

}

/* ==================== Bilan complet façon Rich Dad ==================== */
/* Compte de résultat (revenus | cashflow) puis bilan patrimonial (actifs | passifs). Montants par mois. */
function bilanData(){
  const r=periodRange(),nm=Math.max(1,r.months||1),A=v=>Math.round(v);
  const ops=C.range(r.from,r.to).filter(o=>o.kind!=='tr'&&C.isReal(o));
  const inc={exploit:{},loisirs:{},autre:{}};const props={};let inv=0;
  const add=(m,k,v,lbl)=>{const x=m[k]=m[k]||{label:lbl,v:0};x.v+=v};
  const recG={},dayG={},proG={};
  for(const o of ops){
    const rental=o.propertyId&&C.isRental(o.propertyId);
    if(rental){const p=props[o.propertyId]=props[o.propertyId]||{rent:0,ch:0};if(o.kind==='inc')p.rent+=o.amount;else p.ch+=o.amount;continue}
    if(o.kind==='inc'){const n=C.nature(o),b=C.bucket(o.catId);
      if(n==='passif'&&b!=='immo'){inv+=o.amount;continue}
      if(b==='immo'){const p=props._other=props._other||{rent:0,ch:0};p.rent+=o.amount;continue}
      const bk=b==='loisirs'?'loisirs':b==='exploit'?'exploit':'autre';add(inc[bk],o.catId,o.amount,C.catName(o.catId));continue}
    const rt=C.root(o.catId),rid=rt?rt.id:'_none',rname=rt?rt.name:'Sans catégorie';
    const co=C.companyOf(o);if(co){const g=proG[co]=proG[co]||{label:(C.company(co)||{}).name||'Entreprise',v:0,items:{}};g.v+=o.amount;const c=C.cat(o.catId);add(g.items,c?c.name:rname,o.amount,c?c.name:rname);continue}
    if(C.isRecurringOp(o)){const g=recG[rid]=recG[rid]||{label:rname,v:0,items:{}};g.v+=o.amount;add(g.items,C.opName(o),o.amount,C.opName(o))}
    else{const g=dayG[rid]=dayG[rid]||{label:rname,v:0,items:{}};g.v+=o.amount;const c=C.cat(o.catId);const lbl=c&&c.parent?c.name:'Divers '+rname.toLowerCase();add(g.items,lbl,o.amount,lbl)}
  }
  const list=m=>Object.values(m).map(x=>({...x,v:A(x.v)})).filter(x=>x.v).sort((a,b)=>b.v-a.v);
  const groups=m=>Object.values(m).map(g=>({label:g.label,v:A(g.v),items:list(g.items)})).filter(g=>g.v).sort((a,b)=>b.v-a.v);
  const pr=Object.entries(props).map(([id,x])=>({label:id==='_other'?'Autres revenus immobiliers':(C.prop(id)||{}).name||'Bien',rent:A(x.rent),ch:A(x.ch),net:A(x.rent-x.ch),v:A(x.rent)})).sort((a,b)=>b.v-a.v);
  const X=list(inc.exploit),L=list(inc.loisirs),O=list(inc.autre),rec=groups(recG),day=groups(dayG),pro=groups(proG);
  const sum=a=>a.reduce((s,x)=>s+x.v,0);
  const t={exploit:sum(X),loisirs:sum(L),autre:sum(O),immo:sum(pr),inv:A(inv),rec:sum(rec),day:sum(day),pro:sum(pro),immoCh:pr.reduce((a,x)=>a+x.ch,0)};
  t.passif=t.immo+t.inv;t.inc=t.exploit+t.loisirs+t.autre+t.passif;t.exp=t.rec+t.day+t.pro+t.immoCh;
  t.cfPassif=t.passif-t.exp;t.cfSemi=t.passif+t.loisirs-t.exp;t.cash=t.inc-t.exp;
  {const e=t.exp-t.immoCh;t.cov=e?(t.passif-t.immoCh)/e:null;t.covSemi=e?(t.passif-t.immoCh+t.loisirs)/e:null}
  /* Bilan patrimonial à la fin de la période */
  const D=r.to<todayISO()?r.to:null;const nw=C.netWorth(D);
  const assets=[],liabs=[];
  if(S.cfg.settings.includeAccounts!==false){const it=S.cfg.accounts.map(a=>({label:a.name,v:C.balance(a,D)})).filter(x=>x.v!=null);if(it.length)assets.push({label:'Liquidités',items:it,v:sum(it)})}
  const ACATS=['Épargne','Bourse et fonds','Autres actifs financiers mobiliers','Parts d’entreprises ou actifs professionnels','Autres actifs'];
  for(const cat of ACATS){const it=S.cfg.assets.filter(x=>x.cat===cat).map(x=>({label:x.name,v:C.valAt(x,'value',D)||0}));if(it.length)assets.push({label:cat,items:it,v:sum(it)})}
  if(pfCfg().positions.length){const P=pfSummary(D||undefined);const it=P.G.map(g=>({label:g.label+' · '+g.ps.length+' ligne'+(g.ps.length>1?'s':''),v:Math.round(g.v*100),pl:Math.round((g.v-g.c)*100),c:Math.round(g.c*100)}));
    assets.push({label:'Placements mobiliers',items:it,v:sum(it),pl:Math.round((P.t.v-P.t.c)*100),c:Math.round(P.t.c*100)})}
  {const it=S.cfg.properties.map(p=>{const sh=C.share(p);return {label:p.name+(sh!=null&&sh<1?` (${Math.round(sh*100)} %)`:''),v:sh==null||p.value==null?0:Math.round(p.value*sh)}});if(it.length)assets.push({label:'Immobilier · ta quote-part',items:it,v:sum(it)})}
  {const it=S.cfg.properties.map(p=>{const sh=C.share(p);const cr=C.crd(p,D||undefined);return {label:'Crédit '+p.name,v:cr==null||sh==null?0:Math.round(cr*sh)}}).filter(x=>x.v);if(it.length)liabs.push({label:'Crédits immobiliers',items:it,v:sum(it)})}
  const DCATS=[...new Set(S.cfg.debts.map(d=>d.cat||'Autres engagements financiers'))];
  for(const cat of DCATS){const it=S.cfg.debts.filter(d=>(d.cat||'Autres engagements financiers')===cat).map(d=>({label:d.name,v:C.valAt(d,'crd',D)||0})).filter(x=>x.v);if(it.length)liabs.push({label:cat,items:it,v:sum(it)})}
  const ta=sum(assets),tl=sum(liabs);
  return {r,nm,D,X,L,O,pr,rec,day,pro,t,assets,liabs,ta,tl,net:ta-tl};
}

function bilanBlocks(){

  if(B.day.length){L.push({t:'sub',l:'Dépenses du quotidien',v:money(t.day)});for(const g of B.day)L.push({t:'grp',l:g.label,v:money(g.v)})}

  R.push({t:'line',l:'Revenus d’exploitation',v:money(t.exploit+t.autre)},{t:'line',l:'Revenus semi-passifs · loisirs',v:money(t.loisirs)},{t:'line',l:'Revenus passifs · loyers perçus',v:money(t.passif)},{t:'tot',l:'Total des revenus',v:money(t.inc)},{t:'tot',l:'Dépenses totales',v:'−'+money(t.exp),neg:true},{t:'gap'},
    {t:'big',l:'Cashflow passif',s:'revenus passifs − dépenses',v:moneyS(t.cfPassif),neg:t.cfPassif<0},{t:'big',l:'Cashflow semi-passif',s:'passifs + loisirs − dépenses',v:moneyS(t.cfSemi),neg:t.cfSemi<0},{t:'big',l:'Cashflow · trésorerie',s:'tous les revenus − toutes les dépenses',v:moneyS(t.cash),neg:t.cash<0,pay:true},{t:'gap'},
    {t:'line',l:'Couverture par le passif net',v:t.cov==null?'—':PF.format(t.cov)},{t:'gauge',v:t.cov||0},
    {t:'note',l:t.cfPassif>=0?'Tes revenus passifs couvrent tes dépenses : tu es sorti de la Rat Race.':`Il manque ${money(Math.round(-t.cfPassif/B.nm))} de revenus passifs par mois pour sortir de la Rat Race.`});
  AL.push({t:'head',l:'Actifs',v:money(B.ta),tone:'asset'});for(const g of B.assets){AL.push({t:'grp',l:g.label,v:money(g.v)+pl(g)});for(const x of g.items)AL.push({t:'item',l:x.label,v:money(x.v)+pl(x)})}

  return {B,L,R,AL,AR};

function pfEvoData(){const t=todayISO(),f=PFL.firstDate();if(!f)return null;const ms=[];let m=mk(f);while(m<mk(t)&&ms.length<240){ms.push(m);m=addMonths(m,1)}

const PF_TRIGGER='trig_01QayZDaxK7npSUqnPuJLPD8';
/* Lance la tâche programmée qui récupère les cours sur le web et les inscrit dans la base. */
async function pfRefresh(){
  let mcp=null;try{mcp=window.claude&&window.claude.use?await window.claude.use('mcp'):null}catch(e){}
  if(!mcp){toast('La mise à jour en un clic fonctionne depuis l’appli ouverte dans Claude.');return}
  S.pfBusy=true;render();
  try{await mcp.callTool('Claude Code Remote','fire_trigger',{trigger_id:PF_TRIGGER},{cache:false});S.pfPending=Date.now();toast('Mise à jour lancée : les cours arrivent d’ici quelques minutes.')}
  catch(e){const c=e&&e.code;
    const msg=c==='server_not_connected'?'Le connecteur « Claude Code Remote » n’est pas activé : ajoute-le dans les réglages de Claude, rubrique Connecteurs.'
      :c==='needs_reauth'?'Reconnecte « Claude Code Remote » dans les réglages de Claude, rubrique Connecteurs.'
      :c==='approval_required'||c==='not_in_manifest'||c==='consent_required'?'Autorisation refusée : réessaie et accepte la demande d’accès pour lancer la mise à jour.'
      :c==='tool_error'?'La tâche de mise à jour n’a pas pu démarrer. Demande à Claude dans la conversation de vérifier la tâche « Mise à jour des cours du portefeuille ».'
      :c==='server_unavailable'||c==='upstream_error'?'Service momentanément indisponible. La mise à jour a peut-être démarré : attends quelques minutes avant de recliquer.'
      :'Mise à jour impossible depuis cette vue ('+(c||'erreur')+').';
    toast(msg)}
  finally{S.pfBusy=false;render()}
}

      else if(f&&e)e.insertAdjacentHTML('afterend',`<small class="aiwarn ok">${f.d?'cours du '+fdate(f.d):'date non donnée'}${f.cur&&f.cur!=='EUR'?' · '+nf(f.native)+' '+esc(f.cur)+' converti':''}${f.src?' · '+esc(f.src):''}</small>`)}
    const n=Object.keys(r.rows).length;
    msg(n?`<b>${n} cours sur ${ps.length} remplis.</b>${warns.length?` <span class="warn">À vérifier (en orange) : ${warns.join(', ')}.</span>`:' Aucune anomalie détectée.'} Vérifie puis enregistre.`:'Aucun cours reconnu : vérifie que la réponse reprend bien les codes (ISIN ou crypto).')})}
/* Mise à jour des cours via n'importe quelle IA : une demande à copier (tableau des lignes + format de réponse imposé), puis lecture de la réponse collée,
   avec contrôles : devise non convertie, écart de plus de 30 % avec le dernier cours, cours daté de plus de 3 jours. */
const PFAI={
  full(x){if(x==null)return '';if(Math.abs(x)>=1e-6)return String(Number(x.toPrecision(12)));return x.toFixed(14).replace(/0+$/,'')},
  prompt(ps){const today=todayISO();
    const rows=ps.map(p=>{const q=PFL.quote(p);return [pfKey(p),(p.name||'').replace(/[;\n]/g,' '),p.kind==='crypto'?'Crypto':pfGroup(p)==='action'?'Action':'ETF / fonds',q?PFAI.full(q.p):'',q?q.d:'']});
    const csv='CODE;NOM;TYPE;DERNIER_COURS_EUR;DATE_DERNIER_COURS\n'+rows.map(r=>r.join(';')).join('\n');
    const text=`Donne-moi le cours le plus récent de chacune des lignes ci-dessous. Nous sommes le ${today}.

Règles :
- CODE = code ISIN pour les actions, ETF et fonds ; symbole pour les cryptos.
- Cherche chaque cours sur le web (Boursorama, Euronext, Yahoo Finance, Morningstar, Google Finance, CoinGecko…). N'utilise pas de cours tiré de ta mémoire.
- Action ou ETF : cours de clôture de la dernière séance de Bourse. Fonds : dernière valeur liquidative publiée. Crypto : cours actuel.
- La date doit être celle de la dernière séance ou d'aujourd'hui. Si tu ne trouves qu'un cours plus ancien, donne-le avec sa vraie date.
- Indique le cours dans sa devise de cotation (USD, EUR…), puis sa valeur en euros (COURS_EUR) convertie au taux de change du jour. Si la devise est EUR, COURS_EUR = COURS.
- Nombres : point décimal, aucun séparateur de milliers, au moins 4 chiffres significatifs (ex. 68044.50 ; 0.1069 ; 0.000004576).
- SOURCE = nom du site où tu as lu le cours.
- Si tu n'es pas sûr d'un cours, écris ? à la place du nombre plutôt que d'inventer.

Réponds UNIQUEMENT avec les lignes de résultat, dans un seul bloc de code, sans titre, sans en-tête, sans phrase ni commentaire, une ligne par actif, dans ce format exact :
CODE;COURS;DEVISE;COURS_EUR;DATE_AAAA-MM-JJ;SOURCE

Exemple de ligne : US0000000000;33.10;USD;28.52;2026-01-09;Yahoo Finance

Mes lignes :
${csv}`;
    return {text,csv}},
  num(t){t=String(t).replace(/[€\s  ']/g,'').replace(/EUR$/i,'');if(/e-?\d+$/i.test(t)){const x=Number(t.replace(',','.'));return x>0&&isFinite(x)?x:null}
    if(t.includes(',')&&t.includes('.'))t=t.lastIndexOf(',')>t.lastIndexOf('.')?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');else t=t.replace(',','.');const x=Number(t);return x>0&&isFinite(x)?x:null},
  isNum(c){return /^[€]?\s*\d[\d\s  .,']*(e-?\d+)?\s*(€|EUR)?$/i.test(c)},
  parse(txt,ps){const rows={},warn={};const keys=ps.map(p=>[p,pfKey(p)]).filter(x=>x[1]).sort((a,b)=>b[1].length-a[1].length);const today=todayISO();
    const add=(id,t)=>{(warn[id]=warn[id]||[]).push(t)};
    /* Réponse collée sur une seule ligne (retours à la ligne perdus au copier) : on recoupe avant chaque code suivi d'un séparateur. */
    const esc2=k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const cut=new RegExp('(^|[\\s|])('+keys.map(x=>esc2(x[1])).join('|')+')(?=\\s*[;|\\t])','gi');
    txt=String(txt||'').replace(cut,(m,a,k)=>(a==='|'?'\n|':'\n')+k);
    for(let line of txt.split(/\r?\n/)){const U=line.toUpperCase();
      const hit=keys.find(([p,k])=>new RegExp('(^|[^A-Z0-9])'+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'($|[^A-Z0-9])').test(U));if(!hit)continue;
      const [p,k]=hit;if(rows[p.id])continue;let rest=line.slice(U.indexOf(k)+k.length);
      const dm=rest.match(/(\d{4})-(\d{2})-(\d{2})|(\d{2})\/(\d{2})\/(\d{4})/);let d=null;
      if(dm){d=dm[1]?`${dm[1]}-${dm[2]}-${dm[3]}`:`${dm[6]}-${dm[5]}-${dm[4]}`;rest=rest.replace(dm[0],' ')}
      const cells=rest.split(/[;|\t]/).map(x=>x.trim()).filter(Boolean);
      const ci=cells.findIndex((c,i)=>i>0&&/^[A-Z]{3}$/i.test(c)&&(cells[i-1]==='?'||PFAI.isNum(cells[i-1])));const curC=ci>=0?cells[ci]:null;const cur=curC?curC.toUpperCase():null;const after=ci>=0?cells.slice(ci+1):cells;const before=ci>=0?cells.slice(0,ci):[];
      const nb=before.filter(c=>PFAI.isNum(c)).map(PFAI.num).filter(Boolean);const na=after.find(c=>c==='?'||PFAI.isNum(c));
      let x=null,native=nb[0]??null;
      if(ci>=0){if(na&&na!=='?')x=PFAI.num(na);else if(!na&&cur==='EUR')x=native;}
      else{const n=cells.filter(c=>PFAI.isNum(c)).map(PFAI.num).filter(Boolean);x=n.length>=2?n[1]:n[0]??null;native=n.length>=2?n[0]:null}
      if(!x){if(cur&&cur!=='EUR'&&native)add(p.id,`cours en ${cur} non converti en euros : saisis-le en euros`);continue}
      if(d&&!(d>='2000-01-01'&&d<=today))d=null;
      rows[p.id]={x,d,cur,native,src:(after.filter(c=>c!==na&&!PFAI.isNum(c)&&c!=='?').join(' ')||'').slice(0,40)};
      if(cur&&cur!=='EUR'&&native&&Math.abs(x/native-1)<0.015)add(p.id,`même valeur en ${cur} et en euros : conversion oubliée ?`);
      const q=PFL.quote(p);if(q&&q.p>0&&Math.abs(x/q.p-1)>0.3)add(p.id,`${x>q.p?'+':''}${Math.round((x/q.p-1)*100)} % depuis le dernier cours (${PFAI.full(q.p).replace('.',',')} €)`);
      if(!d)add(p.id,'date non donnée');else if((new Date(today)-new Date(d))/864e5>3)add(p.id,'cours du '+fdate(d)+', plus de 3 jours');}
    return {rows,warn}}
};

const CT={
  active(c){return c.active!==false},
  per(c){return c.period==null||c.period===''?null:Number(c.period)},
  /* Prélèvement : montant saisi, sinon montant contractuel réparti sur la fréquence de prélèvement (contrat annuel mensualisé). */
  debitPer(c){return c.debitPeriod?Number(c.debitPeriod):CT.per(c)},
  debitAmount(c){if(c.debitAmount!=null)return c.debitAmount;const p=CT.per(c),d=CT.debitPer(c);if(c.amount!=null&&p&&d&&d!==p)return Math.round(c.amount*d/p);return c.amount},
  debitComputed(c){return c.debitAmount==null&&c.amount!=null&&CT.per(c)&&CT.debitPer(c)&&CT.debitPer(c)!==CT.per(c)},
  monthly(c){const p=CT.per(c);if(c.amount==null||!p)return null;return Math.round(c.amount/p)},
  skipLabel(c){return (c.skipMonths||[]).length?'sauf '+c.skipMonths.map(m=>MFR[m-1]).join(', '):''},
  missing(c){const m=[];if(c.amount==null)m.push('montant');if(!CT.per(c))m.push('périodicité');if(!c.accountId)m.push('banque');if(!c.nextDate)m.push('prochain prélèvement');if(!c.org)m.push('organisme');return m},
  opId(c,d){return 'op-'+c.id+'-'+d},
  occurrences(c,untilISO){const p=CT.debitPer(c);if(!CT.active(c)||!c.nextDate||!p||CT.debitAmount(c)==null||!c.catId)return [];const skip=(c.skipMonths||[]).map(Number);const out=[];let i=0,d=c.nextDate;while(d<=untilISO&&i<400){if(c.endDate&&d>c.endDate)break;if(!skip.includes(Number(d.slice(5,7))))out.push(d);i++;d=addMonthsISO(c.nextDate,p*i)}return out},
  isDone(c,d){return !!((c.done||{})[d])||!!findOp(CT.opId(c,d))},
  makeOp(c,d){return {id:CT.opId(c,d),kind:'exp',amount:CT.debitAmount(c),date:d,catId:c.catId,accountId:c.accountId||'',desc:c.name,comment:'',status:'paye',recur:'recurrent',propertyId:c.propertyId||'',...(c.companyId?{companyId:c.companyId}:{}),contractId:c.id,amountType:'net',retMode:'a_payer',retenues:{},createdAt:new Date().toISOString()}},

};

/* Prêt amortissable à échéances constantes : capital restant dû recalculé à chaque échéance, à partir d’un relevé de la banque. */
const LOAN={
  ok(l){return !!(l&&l.refCrd!=null&&l.refDate&&l.payment&&l.endDate)},
  i(l){return (Number(l.rate)||0)/1200},
  dueAfter(l,k){const ym=addMonths(l.refDate.slice(0,7),k);return ym+'-'+String(Math.min(Number(l.day)||Number(l.refDate.slice(8,10)),lastDay(ym))).padStart(2,'0')},
  /* Échéances postérieures au relevé, jusqu’à la date donnée (et jusqu’à la fin du prêt). */
  schedule(l,untilISO){const out=[];let c=l.refCrd/100;const i=LOAN.i(l),pm=l.payment/100;for(let k=1;k<600;k++){const d=LOAN.dueAfter(l,k);if(d>l.endDate||d>untilISO)break;const int=c*i;let cap=pm-int;if(d===l.endDate||cap>c)cap=c;c=Math.max(0,c-cap);out.push({date:d,interest:Math.round(int*100),capital:Math.round(cap*100),crd:Math.round(c*100)})}return out},
  /* Avant le relevé : on remonte les échéances (capital avant = (capital après + échéance) / (1 + taux)). */
  crdAt(l,date){if(date<l.refDate){const i=LOAN.i(l),pm=l.payment/100;let c=l.refCrd/100;for(let k=0;k>-600;k--){const d=LOAN.dueAfter(l,k);if(d<=date)break;c=(c+pm)/(1+i)}return Math.round(c*100)}
    const s=LOAN.schedule(l,date);return s.length?s[s.length-1].crd:l.refCrd},
  next(l,date){const s=LOAN.schedule(l,'2100-01-01');return s.find(x=>x.date>date)||null},
  remaining(l,date){const s=LOAN.schedule(l,'2100-01-01').filter(x=>x.date>date);return {n:s.length,interest:s.reduce((a,x)=>a+x.interest,0),capital:s.reduce((a,x)=>a+x.capital,0)}}
};

/* Loyers : les lignes « recette » d’un bien loué deviennent une recette récurrente mensuelle. */
const RENT={
  monthly(p){let s=0;for(const l of p.lines||[])if(l.dir==='in'&&l.amount!=null)s+=l.amount/(Number(l.per)||1);return Math.round(s)},
  date(p,ym){const d=Math.min(Number(p.rentDay)||1,lastDay(ym));return ym+'-'+String(d).padStart(2,'0')},
  opId(p,ym){return 'op-rent-'+p.id+'-'+ym},
  catId(){const c=S.cfg.cats.find(x=>x.id==='i-locatif')||S.cfg.cats.find(x=>x.kind==='inc'&&!x.parent&&C.bucket(x.id)==='immo');return c?c.id:''},
  dates(p,untilISO){if(!p.incomeAuto||p.rental===false||!p.rentFrom||!RENT.monthly(p))return [];const out=[];let ym=p.rentFrom,i=0;while(i<240){const d=RENT.date(p,ym);if(d>untilISO)break;out.push([ym,d]);ym=addMonths(ym,1);i++}return out},
  makeOp(p,ym,d){return {id:RENT.opId(p,ym),kind:'inc',amount:RENT.monthly(p),date:d,catId:RENT.catId(),accountId:p.rentAccountId||'',desc:'Loyer '+p.name,recName:'Loyer '+p.name,comment:'',status:'encaisse',recur:'recurrent',propertyId:p.id,contractId:'',amountType:'net',retMode:'deja',retenues:{},autoRet:false,createdAt:new Date().toISOString()}}
};
/* Génère les prélèvements des charges en « paiement automatique ». Identifiant déterministe : jamais de doublon. */
let autoBusy=false;
async function autoGenerate(){
  if(autoBusy)return;if(S.mode==='db'&&!(S.cfgLoaded&&S.monthsLoaded))return;autoBusy=true;
  try{const t=todayISO();let n=0,cfgChanged=false;
    /* Option « fin de mois » : horizon = dernier jour du mois en cours (échéances à confirmer incluses, à partir du 1er). */
    const ant=!!S.cfg.settings.anticipate,ym0=t.slice(0,7),m0=ym0+'-01',H=ant?ym0+'-'+String(lastDay(ym0)).padStart(2,'0'):t;
    const mark=op=>{if(op&&op.date>t)op.anticip=true;return op};
    if(!ant){const dels=allOps().filter(o=>o.anticip&&o.date>t);if(dels.length){
      for(const o of dels){for(const c of S.cfg.contracts)if(c.done&&c.done[o.date]===o.id)delete c.done[o.date];for(const r of S.cfg.recurrences)if(r.done&&r.done[o.date]===o.id)delete r.done[o.date];for(const p of S.cfg.properties)if(p.rentDone){const k=o.date.slice(0,7);if(p.rentDone[k]===o.id)delete p.rentDone[k]}}
      await bulkOps([],dels);cfgChanged=true}}
    /* Rétroactif : prélèvements passés depuis la date de début, et retrait de ceux générés avant cette date. */
    {const adds=[],dels=[];
      for(const c of S.cfg.contracts){if(!CT.active(c)||!c.start||!c.nextDate||c.backfill===false)continue;const p=CT.debitPer(c);if(!p||CT.debitAmount(c)==null||!c.catId)continue;
        c.done=c.done||{};const skip=(c.skipMonths||[]).map(Number);
        for(let k=1;k<1200;k++){const d=addMonthsISO(c.nextDate,-p*k);if(d<c.start)break;if(d>t||skip.includes(Number(d.slice(5,7))))continue;const v=c.done[d];if(v==='skip'||v==='deleted')continue;const id=CT.opId(c,d);if(!findOp(id)&&!(v&&findOp(v)))adds.push(CT.makeOp(c,d));if(v!==id&&!(v&&findOp(v))){c.done[d]=id;cfgChanged=true}}
        for(const o of allOps()){if(o.contractId===c.id&&o.id.startsWith('op-'+c.id+'-')&&o.date<c.start){dels.push(o);delete c.done[o.date];cfgChanged=true}}}
      if(adds.length||dels.length){await bulkOps(adds,dels);n+=adds.length}}
    for(const c of S.cfg.contracts){if(!CT.active(c)||(!c.autoPay&&!ant))continue;c.done=c.done||{};
      for(const d of CT.occurrences(c,H)){if(!c.autoPay&&d<m0)continue;if(c.autoFrom&&d<c.autoFrom)continue;const v=c.done[d];if(v==='skip'||v==='deleted'||(v&&findOp(v)))continue;
        if(!findOp(CT.opId(c,d))){await putOp(mark(CT.makeOp(c,d)));n++}c.done[d]=CT.opId(c,d);cfgChanged=true}}
    /* Un contrat relié à un bien (ou recatégorisé) après coup : ses prélèvements générés suivent. */
    {const fix=[];for(const o of allOps()){if(!o.contractId||!String(o.id).startsWith('op-'+o.contractId+'-'))continue;const c=S.cfg.contracts.find(x=>x.id===o.contractId);if(!c)continue;
        const pid=c.propertyId||'',cat=c.catId||o.catId;if((o.propertyId||'')!==pid||o.catId!==cat)fix.push({...o,propertyId:pid,catId:cat})}
      if(fix.length)await bulkOps(fix,[])}
    for(const o of allOps()){if(o.kind==='inc'&&URS.amountFor(o)&&!findOp(URS.opId(o))){const u=URS.build(o);if(o.anticip&&u.date>t)u.anticip=true;await putOp(u);n++}}
    for(const r of S.cfg.recurrences){if(!r.autoPay&&!ant)continue;r.done=r.done||{};for(const d of C.occurrences(r,H)){if(!r.autoPay&&d<m0)continue;if(r.autoFrom&&d<r.autoFrom)continue;const v=r.done[d];if(v==='skip'||v==='deleted'||(v&&findOp(v)))continue;const op=mark(makeRecOp(r,d));if(!findOp(op.id)){await putOp(op);n++}r.done[d]=op.id;cfgChanged=true}}
    for(const p of S.cfg.properties){p.rentDone=p.rentDone||{};for(const [ym,d] of RENT.dates(p,H)){const v=p.rentDone[ym];if(v==='skip'||v==='deleted'||(v&&findOp(v)))continue;
        if(!findOp(RENT.opId(p,ym))){await putOp(mark(RENT.makeOp(p,ym,d)));n++}p.rentDone[ym]=RENT.opId(p,ym);cfgChanged=true}}
    if(cfgChanged)await saveCfg();if(n)toast(n+' opération'+(n>1?'s':'')+' récurrente'+(n>1?'s':'')+' enregistrée'+(n>1?'s':'')+' automatiquement');
  }finally{autoBusy=false}
}

    const b=B[t.preset]=B[t.preset]||{preset:t.preset,label:MICRO_CASES[t.preset][2],months:{},tot:{ca:0,soc:0,cfp:0,vl:0,urs:0,pro:0}};
    const m=o.date.slice(0,7);const x=b.months[m]=b.months[m]||{ca:0,soc:0,cfp:0,vl:0,urs:0,pro:0};const r=o.retenues||{};
    const add={ca:C.brut(o),soc:r.urssaf||0,cfp:r.cotis||0,vl:t.vl?(r.ir||0):0};add.urs=add.soc+add.cfp+add.vl;
    for(const k in add){x[k]+=add[k];b.tot[k]+=add[k]}}
  const keys=Object.keys(B);if(keys.length){const b=B[keys[0]];/* dépenses pro rattachées à la première entreprise */
    for(const o of C.range(from,to)){if(o.kind!=='exp'||!C.isReal(o))continue;const rt=C.root(o.catId);if(!rt||rt.id!=='e-invpro')continue;const m=o.date.slice(0,7);const x=b.months[m]=b.months[m]||{ca:0,soc:0,cfp:0,vl:0,urs:0,pro:0};x.pro+=o.amount;b.tot.pro+=o.amount}}
  return Object.values(B)}
function bizPanel(){const ys=[...new Set(allOps().filter(o=>o.kind==='inc'&&C.taxOf(o.catId)&&MICRO_CASES[C.taxOf(o.catId).preset]).map(o=>Number(o.date.slice(0,4))))].sort();
  const cy=Number(todayISO().slice(0,4));if(!ys.includes(cy))ys.push(cy);const y=S.bizY&&ys.includes(S.bizY)?S.bizY:cy;const BS=bizData(y);
  const sel=`<div class="miniseg" role="group" aria-label="Année">${ys.map(v=>`<button style="width:auto;padding:0 12px;border-radius:999px" class="${v===y?'on':''}" data-act="biz-y" data-v="${v}" aria-pressed="${v===y}">${v}</button>`).join('')}</div>`;
  let h=`<div class="panel"><div class="toolbar" style="margin:0 0 6px"><h3 style="margin:0">Bilan de ton entreprise</h3><span class="sp"></span>${sel}</div>`;
  if(!BS.length)return h+'<p class="empty">Aucune recette de micro-entreprise encaissée cette année.</p></div>';
  for(const b of BS){const T=b.tot,net=T.ca-T.urs;const ms=Object.keys(b.months).sort();
    h+=`<p class="small muted" style="margin:0 0 8px">${esc(b.label)} · recettes encaissées en ${y}, telles que déclarées à l’URSSAF.</p>
    <div class="bizkpi"><div><span>Chiffre d’affaires brut</span><b class="num money">${money(T.ca)}</b></div><div><span>URSSAF${T.vl?' (dont impôt '+money(T.vl)+')':''}</span><b class="num money calm">−${money(T.urs)}</b></div><div class="hl"><span>Net, URSSAF déduite</span><b class="num money pos">${money(net)}</b></div>${T.pro?`<div><span>Dépenses pro (investissement)</span><b class="num money">−${money(T.pro)}</b></div><div class="hl"><span>Net après dépenses pro</span><b class="num money ${net-T.pro>=0?'pos':'neg'}">${money(net-T.pro)}</b></div>`:''}</div>
    <div class="scrollx" style="border:0;margin-top:10px"><table class="year" style="min-width:560px"><thead><tr><th>Mois</th><th>CA brut</th><th>Cotisations</th><th>CFP</th><th>Impôt (VL)</th><th>Net</th>${T.pro?'<th>Dépenses pro</th>':''}</tr></thead><tbody>
    ${ms.map(m=>{const x=b.months[m];return `<tr><th>${esc(mLabel(m))}</th><td class="num money">${money(x.ca)}</td><td class="num money">${money(x.soc)}</td><td class="num money">${money(x.cfp)}</td><td class="num money">${money(x.vl)}</td><td class="num money"><b>${money(x.ca-x.urs)}</b></td>${T.pro?`<td class="num money">${money(x.pro)}</td>`:''}</tr>`}).join('')}
    <tr><th>Total ${y}</th><td class="num money"><b>${money(T.ca)}</b></td><td class="num money">${money(T.soc)}</td><td class="num money">${money(T.cfp)}</td><td class="num money">${money(T.vl)}</td><td class="num money"><b>${money(net)}</b></td>${T.pro?`<td class="num money">${money(T.pro)}</td>`:''}</tr></tbody></table></div>`}
  return h+`<p class="small muted" style="margin:8px 0 0">Les montants URSSAF sont ceux calculés sur chaque recette (taux de ta catégorie). Une autre entreprise apparaîtra ici dès qu’une catégorie de recettes utilise un autre régime.</p></div>`}

      <span class="num money uv">${money(rest||p.due)}</span>

  const ds=URS.debts();

    ${ds.length?ds.map(d=>`<div class="urow"><div class="um"><b>${esc(d.name)}</b><small>Mis à jour le ${fdate(d.date)}${d.comment?' · '+esc(d.comment):''}</small></div><span class="num money uv">${money(d.crd)}</span><span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn sm solid" data-act="urs-debt-pay" data-id="${d.id}">Payer</button><button class="btn sm ghost" data-act="edit-debt" data-id="${d.id}">Modifier</button></span></div>`).join(''):'<p class="empty">Aucun. Ajoute ici ce que tu dois à l’URSSAF en dehors des cotisations du mois.</p>'}
    <p class="small muted" style="margin:8px 0 0">Ces montants apparaissent aussi dans le bloc Passifs de ta feuille.</p></div>`;
  return h;
}
function ursPayForm(k){

function ursDebtPay(id){
  const d=S.cfg.debts.find(x=>x.id===id);

  const ret={urssaf:0,cotis:0,csg:0,ir:0,autres:0},deja={urssaf:0,cotis:0,csg:0,ir:0,autres:0};for(const o of ops)if(o.kind==='inc'&&C.isReal(o)){const tgt=o.retMode==='deja'?deja:ret;for(const k in tgt)tgt[k]+=Number((o.retenues||{})[k])||0}

  <div class="panel"><h3>Déjà prélevé à la source (salaires)</h3><p class="small muted">Retenues reconstituées sur tes recettes nettes : rien à payer en plus.</p>
   ${[['urssaf','Cotisations salariales'],['cotis','Autres cotisations'],['csg','CSG/CRDS'],['ir','Prélèvement à la source'],['autres','Autres retenues']].map(([k,l])=>`<div class="kv"><span class="k">${l}</span><span class="v num money">${money(deja[k])}</span></div>`).join('')}</div>
  <div class="panel"><h3>Autres revenus à déclarer</h3>${decl.length?opList(decl.sort((a,b)=>b.date.localeCompare(a.date))):'<p class="empty">Aucun revenu dans « Autre revenu à déclarer » cette année.</p>'}</div>

    <p style="margin:0"><b>Cashflow (PAYDAY)</b> : recettes encaissées − dépenses payées sur la période, transferts internes exclus. Les montants prévus n’y entrent pas.</p>

    <p style="margin:0"><b>Patrimoine net</b> = actifs (soldes théoriques, épargne, placements, quote-part des biens) − dettes (capital restant dû × quote-part, autres dettes). Le crédit d’un bien n’est compté qu’une fois, sur la fiche du bien.</p>

function vMemos(){const all=S.memos||[];const cat=S.mcat||'',q=(S.mq||'').trim().toLowerCase();

async function memoSave(n,quiet){S.memos=S.memos||[];const i=S.memos.findIndex(x=>x.id===n.id);if(i>=0)S.memos[i]=n;else S.memos.push(n);if(!quiet)render();

let modalState=null;
function openModal(title,body,footer,opts={}){

  $('#modal-root').innerHTML=`<div class="modal-bg" data-act="modal-bg"><div class="modal ${opts.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="mh"><h2>${esc(title)}</h2><button data-act="modal-close" aria-label="Fermer">×</button></div><div id="dirty-slot"></div><div class="mb" id="mb">${body}</div>${footer?`<div class="mf">${footer}</div>`:''}</div></div>`;
  const m=$('.modal');m.addEventListener('input',()=>{modalState&&(modalState.dirty=true)});m.addEventListener('change',()=>{modalState&&(modalState.dirty=true)});
  if(opts.focus){const f=$(opts.focus);if(f)setTimeout(()=>f.focus(),30)}
  if(opts.refresh)S.modalRefresh=opts.refresh;
}
function closeModal(force){
  if(!modalState)return;
  if(modalState.dirty&&!force){$('#dirty-slot').innerHTML=`<div class="dirty-bar"><span>Tu as des modifications non enregistrées.</span><span style="flex:1"></span><button class="btn sm" data-act="dirty-stay">Continuer la saisie</button><button class="btn sm danger" data-act="dirty-leave">Abandonner</button></div>`;return}
  const oc=modalState.onClose;$('#modal-root').innerHTML='';modalState=null;S.modalRefresh=null;if(oc)try{oc()}catch(e){}
}

      const ck=$('#op-mkct');if(ck&&ck.checked&&!d.contractId){const per=Number(val('op-mkct-per'))||1;const ct={id:uid(),name:d.recName,org:'',catId:d.catId,amount:d.amount,period:per,debitAmount:null,debitPeriod:null,accountId:d.accountId||'',nextDate:addMonthsISO(d.date,per),autoPay:false,autoFrom:null,propertyId:d.propertyId||'',url:'',login:'',notes:'Créée depuis une dépense récurrente.',active:true,history:[],done:{}};S.cfg.contracts.push(ct);d.contractId=ct.id;saveCfg()}}

/* ---------- Détail d'une catégorie ---------- */
function catDetail(id){
  const c=C.cat(id);let q='';
  const body=()=>{const r=periodRange();let ops=C.range(r.from,r.to).filter(o=>o.catId===id||(C.cat(o.catId)&&C.cat(o.catId).parent===id));
    if(q){const ql=q.toLowerCase();ops=ops.filter(o=>[o.desc,o.comment].join(' ').toLowerCase().includes(ql))}
    ops.sort((a,b)=>b.date.localeCompare(a.date));const tot=ops.filter(C.isReal).reduce((s,o)=>s+o.amount,0);
    return `<p class="small muted" style="margin:0">${esc(r.label)}${c.note?' · '+esc(c.note):''}</p><div class="kv strong"><span class="k">Total réel</span><span class="v num money">${money(tot)}</span></div>${ops.length?opList(ops):'<p class="empty">Aucune opération dans cette catégorie sur la période.</p>'}`};
  openModal(c.name,`<input type="search" id="cd-q" placeholder="Rechercher…" aria-label="Rechercher"><div id="cd-body">${body()}</div>`,`<span class="sp"></span><button class="btn solid" data-act="cd-add" data-id="${id}">+ Ajouter dans ${esc(c.name)}</button>`,{refresh:()=>{const e=$('#cd-body');if(e)e.innerHTML=body()}});
  $('#cd-q').addEventListener('input',e=>{q=e.target.value;$('#cd-body').innerHTML=body()});modalState.dirty=false;
  const m=$('.modal');m.addEventListener('input',()=>{modalState&&(modalState.dirty=false)});
}

function cfgForm(title,fields,obj,onSave,opts={}){
  const b=fields.map(f=>{const v=obj[f.k];const id='cf-'+f.k;
    if(f.t==='money')return `<label class="f">${f.l}${f.h?`<small>${f.h}</small>`:''}<input type="text" inputmode="decimal" id="${id}" value="${esc(cIn(v))}" placeholder="${f.ph||'à compléter'}"></label>`;
    if(f.t==='select')return `<label class="f">${f.l}${f.h?`<small>${f.h}</small>`:''}<select id="${id}">${f.o.map(([a,b])=>`<option value="${esc(a)}" ${String(v??'')===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select></label>`;
    if(f.t==='check')return `<label class="check"><input type="checkbox" id="${id}" ${v?'checked':''}> ${f.l}</label>`;
    if(f.t==='area')return `<label class="f">${f.l}<textarea id="${id}">${esc(v||'')}</textarea></label>`;
    if(f.t==='html')return f.html;
    if(f.t==='date')return `<div class="f datef"><label class="f" for="${id}">${f.l}${f.h?`<small>${f.h}</small>`:''}</label><span class="dwrap"><input type="date" id="${id}" value="${esc(v??'')}"><button type="button" class="btn sm ghost" data-act="clear-date" data-for="${id}" aria-label="Effacer la date">Effacer</button></span></div>`;
    return `<label class="f">${f.l}${f.h?`<small>${f.h}</small>`:''}<input type="${f.t||'text'}" id="${id}" value="${esc(v??'')}" ${f.list?`list="${f.list}"`:''} ${f.t==='number'?'step="any" inputmode="decimal"':''} placeholder="${esc(f.ph||'')}"></label>`}).join('')+(opts.extra||'')+'<p class="err" id="cf-err" role="alert"></p>';
  const foot=`${opts.onDelete?'<button class="btn danger" data-act="cf-delete">Supprimer</button>':''}<span class="sp"></span><button class="btn ghost" data-act="modal-close">Annuler</button><button class="btn solid" data-act="cf-save">Enregistrer</button>`;
  openModal(title,b,foot,{wide:opts.wide,focus:fields[0]&&fields[0].t!=='html'?'#cf-'+fields[0].k:null});
  modalState.cfgSave=()=>{const out={};for(const f of fields){if(f.t==='html')continue;const e=document.getElementById('cf-'+f.k);if(!e)continue;
      if(f.t==='money'){const m=parseMoney(e.value);if(Number.isNaN(m)){$('#cf-err').textContent=`« ${f.l} » : montant invalide.`;return false}out[f.k]=m}
      else if(f.t==='check')out[f.k]=e.checked;else if(f.t==='number')out[f.k]=e.value===''?null:Number(e.value);else out[f.k]=e.value.trim()}
    if(fields[0]&&fields[0].req&&!out[fields[0].k]){$('#cf-err').textContent=`« ${fields[0].l} » est obligatoire.`;return false}
    const r=onSave(out);if(r===false)return false;return true};
  modalState.cfgDelete=opts.onDelete;
}

async function recConfirm(rid,date,skip,src,quiet){
  if(src==='rent'){const p=C.prop(rid);if(!p)return;p.rentDone=p.rentDone||{};const ym=mk(date);
    if(skip){p.rentDone[ym]='skip';saveCfg();toast('Échéance ignorée');return}
    if(!findOp(RENT.opId(p,ym)))await putOp(RENT.makeOp(p,ym,date));p.rentDone[ym]=RENT.opId(p,ym);await saveCfg();if(!quiet)toast('Loyer encaissé');return}
  if(src==='ct'){const c=S.cfg.contracts.find(x=>x.id===rid);if(!c)return;c.done=c.done||{};
    if(skip){c.done[date]='skip';saveCfg();toast('Échéance ignorée');return}
    if(!findOp(CT.opId(c,date)))await putOp(CT.makeOp(c,date));c.done[date]=CT.opId(c,date);await saveCfg();if(!quiet)toast('Prélèvement confirmé');return}
  const r=S.cfg.recurrences.find(x=>x.id===rid);if(!r)return;r.done=r.done||{};
  if(skip){r.done[date]='skip';saveCfg();toast('Échéance ignorée');return}
  if(findOp('op-rec-'+r.id+'-'+date)){r.done[date]='op-rec-'+r.id+'-'+date;await saveCfg();return}
  const op=makeRecOp(r,date);
  r.done[date]=op.id;await saveCfg();await putOp(op);if(!quiet)toast('Échéance confirmée');
}
function makeRecOp(r,date){

}

async function offerFile(filename,data){
  if(DIST){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:/\.csv$/.test(filename)?'text/csv;charset=utf-8':'application/json'}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);toast('Fichier téléchargé');return}catch(e){}}
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
  if(dl){try{await dl.save({filename,data});toast('Fichier prêt');return}catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('Une demande est déjà ouverte. Réessaie dans un instant.');return}}}
  openModal('Copie de sauvegarde',`<p class="small">Le téléchargement n’est pas disponible ici. Copie ce contenu dans un fichier <b>${esc(filename)}</b>.</p><textarea id="exp-text" style="min-height:260px;font-family:monospace;font-size:12px" readonly>${esc(data)}</textarea>`,`<span class="sp"></span><button class="btn solid" data-act="copy-exp">Copier</button>`);
}

function exportCSV(){const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';const nb=c=>c==null?'':(c/100).toFixed(2).replace('.',',');

  for(const o of allOps().sort((a,b)=>a.date.localeCompare(b.date)))rows.push([fdate(o.date),o.kind==='exp'?'Dépense':o.kind==='inc'?'Recette':'Transfert',o.status,o.kind==='tr'?'':C.catName(o.catId),(C.acc(o.accountId)||{}).name,(C.acc(o.toAccountId)||{}).name,nb(o.amount),o.kind==='inc'?nb(C.net(o)):'',o.kind==='inc'?nb(C.retTotal(o)):'',o.desc,o.comment,(C.prop(o.propertyId)||{}).name,(S.cfg.contracts.find(c=>c.id===o.contractId)||{}).name,o.recur,o.declStatus?DECL[o.declStatus]:''].map(q).join(';'));
  offerFile('cashflow-operations-'+todayISO()+'.csv','﻿'+rows.join('\r\n'))}
function importJSON(file){const fr=new FileReader();fr.onload=()=>{let j;try{j=JSON.parse(fr.result)}catch(e){toast('Ce fichier n’est pas un JSON valide.');return}

    <div class="toolbar" style="margin:0"><button class="btn solid" data-act="ob-open">Importer mon carnet</button>${sh?`<a class="btn" style="text-decoration:none;color:inherit" href="${sh.livre}">Ouvrir le livre</a><a class="btn ghost" style="text-decoration:none;color:inherit" href="${sh.home}">Accueil</a>`:''}</div>
    ${sh?`<p class="small muted" style="margin:0">Version ${esc(sh.version)} · paramètres fiscaux ${esc(String(FP.year))} (${esc(FP.version||'')}). <button class="btn sm ghost" data-act="shell-update">Rechercher une mise à jour</button></p>`:''}
  </div></div>`}
const CARNET_KEY='rr-carnet';
function carnetRead(){try{const c=JSON.parse(localStorage.getItem(CARNET_KEY)||'null');return c&&typeof c==='object'&&Object.keys(c).some(k=>!k.startsWith('_'))?c:null}catch(e){return null}}
function carnetPct(cn){const ks=['dep_total','rev_passif','logement','vehicule_credit','autres_credits','rev_salaire','rev_activite','dep_courses','dep_transport','dep_abonnements','dep_assurances','dep_loisirs','epargne_dispo','pay_first','arbre','statut','immo','pl_livrets','payday_jour','reve','reve_cout','sortie_date','action_1'];return Math.round(ks.filter(k=>cn[k]!=null&&cn[k]!=='').length/ks.length*100)}
const CN_MICRO={bnc:'me_bnc',cipav:'me_cipav',bic:'me_bics',vente:'me_bicv'};
const CN_PROF={salarie:'Salarié',micro:'Micro-entrepreneur',ei_reel:'Entrepreneur individuel',eurl:'Gérant d’EURL',sasu:'Président de SASU'};
/* Traduit les réponses du carnet en éléments de la feuille, groupés pour que la personne choisisse ce qu’elle importe. */
function carnetPlan(cn){
  const eu=v=>{const n=Number(v);return Number.isFinite(n)&&n>0?Math.round(n*100):null};
  const today=todayISO(),d1=today.slice(0,7)+'-01';
  const acc=S.cfg.accounts.some(a=>a.id==='a-courant')?'a-courant':((S.cfg.accounts[0]||{}).id||'');
  const micro=cn.statut==='micro'&&CN_MICRO[cn.micro_type]?CN_MICRO[cn.micro_type]:null;
  const G={flux:[],biens:[],assets:[],debts:[],sources:[],memos:[],reve:null,compte:null,budget:null,micro:null};
  const rec=(id,label,kind,catId,v)=>{const a=eu(v);if(a)G.flux.push({id:'cn-'+id,label,kind,catId,amount:a,freq:1,start:d1,accountId:acc,autoPay:false,autoFrom:null})};
  if(cn.logement==='locataire')rec('loyer','Loyer','exp','e-logement',cn.logement_cout);
  if(cn.logement==='proprio_credit')rec('credit-rp','Crédit de la résidence principale','exp','e-credits',cn.logement_cout);
  rec('vehicule','Crédit ou location de véhicule','exp','e-credits',cn.vehicule_credit);
  rec('credits','Autres crédits','exp','e-credits',cn.autres_credits);
  rec('abos','Abonnements (téléphone, internet, streaming, sport)','exp','e-telecom',cn.dep_abonnements);
  rec('assu','Assurances et santé','exp','e-assurances',cn.dep_assurances);
  rec('impots','Impôts prélevés chaque mois','exp','e-impots-ir',cn.dep_impots);
  rec('salaire','Salaire net','inc','i-contraint',cn.rev_salaire);
  if(micro){G.micro={preset:micro,vl:cn.micro_vl==='oui'};rec('activite','Chiffre d’affaires de ma micro-entreprise','inc','i-activite',cn.ca_mensuel??cn.rev_activite)}
  else rec('activite','Revenus de mon activité','inc','i-autres',cn.rev_activite);
  rec('aides','Aides, pensions, autres revenus','inc','i-autres',cn.rev_aides);
  const dep=['logement_cout','vehicule_credit','autres_credits','dep_courses','dep_transport','dep_abonnements','dep_assurances','dep_loisirs','dep_impots','dep_autres'].reduce((t,k)=>t+(Number(cn[k])||0),0);
  if(dep>0)G.budget=Math.round(dep*100);
  if(cn.epargne_dispo!=null){const v=Math.max(0,(Number(cn.epargne_dispo)||0)-(Number(cn.pl_livrets)||0));G.compte={id:acc,initial:Math.round(v*100),initialDate:today}}
  if(cn.immo==='oui')(cn.biens||[]).forEach((b,i)=>{if(!b||!Object.keys(b).some(k=>b[k]!=null&&b[k]!==''))return;
    const lines=[];const L=(id,label,v,dir)=>{const a=eu(v);if(a)lines.push({id:'cn-l'+i+'-'+id,label,amount:a,per:1,dir,verify:false})};
    L('loyer','Loyer encaissé',b.loyer,'in');L('credit','Mensualité de crédit',b.credit,'out');L('charges','Charges, taxe foncière, assurance',b.charges,'out');
    const US={nu:'Location vide',meuble:'Location meublée',courte:'Location courte durée',vide:'Non loué'},RG={micro_foncier:'micro-foncier',reel_2044:'réel (2044)',micro_bic:'micro-BIC',lmnp_reel:'LMNP au réel',sci_is:'SCI à l’IS'};
    G.biens.push({id:'cn-bien-'+i,name:b.nom||'Bien '+(i+1),usage:US[b.usage]||'',detention:b.detention==='indivision'?'indivision':'pleine',quote:b.detention==='indivision'&&b.quote?Number(b.quote):null,mode:'detail',rental:!!b.usage&&b.usage!=='vide',
      value:eu(b.valeur),valueDate:b.valeur?today:null,crd:eu(b.crd),crdDate:b.crd?today:null,lines,incomeAuto:false,toConfirm:true,notes:'Créé depuis ton carnet'+(RG[b.regime]?' · régime '+RG[b.regime]:'')+'. Complète l’achat et active le loyer automatique si tu veux.'})});
  const A=(id,name,cat,v,comment)=>{const a=eu(v);if(a)G.assets.push({id:'cn-'+id,name,cat,value:a,date:today,history:[],comment:comment||''})};
  A('livrets','Livrets (A, LDDS, LEP)','Épargne',cn.pl_livrets);A('pea','PEA','Bourse et fonds',cn.pl_pea);A('cto','Compte-titres','Bourse et fonds',cn.pl_cto);
  A('av','Assurance-vie','Autres actifs financiers mobiliers',cn.pl_av);A('per','PER (retraite)','Autres actifs financiers mobiliers',cn.pl_per);A('crypto','Cryptomonnaies','Autres actifs financiers mobiliers',cn.pl_crypto);
  if(cn.logement==='proprio_credit'||cn.logement==='proprio')A('rp','Résidence principale','Autres actifs',cn.logement_valeur,'Elle compte dans ton patrimoine, mais pas dans tes revenus passifs : elle ne te verse rien.');
  const D=(id,name,v)=>{const a=eu(v);if(a)G.debts.push({id:'cn-'+id,name,cat:'Autres crédits',crd:a,date:today,history:[],comment:''})};
  if(cn.logement==='proprio_credit')D('credit-rp','Crédit de la résidence principale',cn.logement_crd);
  D('dettes','Autres crédits',cn.dettes_crd);
  {const a=eu(cn.pl_revenus);if(a)G.sources.push({id:'cn-src-pl',name:'Revenus de mes placements',monthly:a,nature:'passif',note:'Moyenne indiquée dans ton carnet'})}
  if(cn.reve||cn.reve_cout||cn.sortie_date)G.reve={dreamName:cn.reve||'',dreamCost:eu(cn.reve_cout),targetDate:cn.sortie_date&&cn.sortie_date+'-01'>today?cn.sortie_date+'-01':null};
  const nextDay=j=>{j=Math.min(28,Math.max(1,Number(j)||1));const d=new Date();let y=d.getFullYear(),m=d.getMonth();if(d.getDate()>j){m++;if(m>11){m=0;y++}}return y+'-'+String(m+1).padStart(2,'0')+'-'+String(j).padStart(2,'0')};
  const M=(id,title,body,cat,due)=>G.memos.push({id:'cn-m-'+id,title,body,cat,color:mcolKey(mcat(cat)[2]),due:due||'',done:false});
  if(Number(cn.pay_first)>0)M('payfirst','Me payer en premier',`Virer ${money(eu(cn.pay_first))} ${cn.pay_first_jour?'le '+cn.pay_first_jour+' de chaque mois ':'chaque mois '}${cn.pay_first_compte?'vers '+cn.pay_first_compte:'vers mon compte d’investissement'}. Un virement automatique, programmé une fois pour toutes.`,'provision',cn.pay_first_jour?nextDay(cn.pay_first_jour):'');
  if(cn.payday_jour)M('payday','Mon PAYDAY',`Le ${cn.payday_jour} de chaque mois : un quart d’heure pour mettre ma feuille à jour, relever mes soldes et regarder ma jauge.`,'rappel',nextDay(cn.payday_jour));
  if(cn.action_1)M('action','Ma première action',String(cn.action_1),'rappel',(()=>{const d=new Date();d.setDate(d.getDate()+7);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')})());
  if(cn.arbre){const T={placement:'placement',produit:'produit à vendre',location:'location',service:'service récurrent',autre:'autre'};M('arbre','Mon premier arbre à fruits',`${cn.arbre}${T[cn.arbre_type]?' ('+T[cn.arbre_type]+')':''}${Number(cn.arbre_cible)>0?'. Objectif : '+money(eu(cn.arbre_cible))+' par mois d’ici un an.':''}`,'divers')}
  if(cn.act_nom)M('activite','Une activité à vendre',`${cn.act_nom}${Number(cn.act_prix)>0?' · prix '+money(eu(cn.act_prix)):''}${Number(cn.act_obj)>0?' · objectif '+cn.act_obj+' ventes par mois':''}${Number(cn.act_prix)>0&&Number(cn.act_obj)>0?' · '+money(eu(cn.act_prix*cn.act_obj))+' de chiffre d’affaires visé par mois':''}.`,'entreprise');
  return G}
function obGroups(G){const n=(k,one,many)=>k===1?one:k+' '+many;const out=[];
  if(G.flux.length)out.push(['flux',n(G.flux.length,'1 charge ou revenu mensuel','charges et revenus mensuels'),'À confirmer chaque mois dans Prévisions : '+G.flux.map(r=>r.label+' '+money(r.amount)).join(' · ')]);
  if(G.micro)out.push(['micro','Ta micro-entreprise',esc(TAX_PRESETS[G.micro.preset].label)+(G.micro.vl?', avec versement libératoire':'')+' : cotisations calculées à chaque recette, onglet URSSAF prêt.']);
  if(G.compte||G.budget)out.push(['compte','Ton compte et ton budget',[G.compte?'Solde de départ du compte courant : '+money(G.compte.initial):'',G.budget?'Dépenses mensuelles de départ : '+money(G.budget):''].filter(Boolean).join(' · ')]);
  if(G.biens.length)out.push(['biens',n(G.biens.length,'1 bien immobilier','biens immobiliers'),G.biens.map(b=>b.name).join(' · ')]);
  if(G.assets.length||G.debts.length||G.sources.length)out.push(['patri','Placements et dettes',[...G.assets.map(a=>a.name+' '+money(a.value)),...G.debts.map(d=>d.name+' '+money(d.crd)),...G.sources.map(x=>x.name+' '+money(x.monthly)+' / mois')].join(' · ')]);
  if(G.reve)out.push(['reve','Ton rêve et ta date de sortie',[G.reve.dreamName,G.reve.dreamCost?money(G.reve.dreamCost):'',G.reve.targetDate?'sortie visée en '+mLabelL(G.reve.targetDate.slice(0,7)):''].filter(Boolean).map(esc).join(' · ')]);
  if(G.memos.length)out.push(['memos',n(G.memos.length,'1 mémo','mémos'),G.memos.map(m=>m.title).join(' · ')]);
  return out}
function obOpen(first){const cn=carnetRead();const G=cn?carnetPlan(cn):null;const gr=G?obGroups(G):[];const p=S.cfg.player;
  S.obPlan=G;
  const body=`<div class="stack">
    ${first?`<p style="margin:0">Bienvenue. Cette appli est ta feuille de jeu : tu y notes ce qui entre, ce qui sort, ce que tu possèdes et ce que tu dois, et elle te montre où tu en es sur la sortie de la Rat Race.</p>`:''}
    <div class="grid2"><label class="f">Ton prénom<input type="text" id="ob-name" value="${esc(p.name||'')}" autocomplete="given-name"></label>
    <label class="f">Ta profession<input type="text" id="ob-prof" value="${esc(p.profession||(cn&&CN_PROF[cn.statut])||'')}"></label></div>
    ${cn?`<div class="grp">Depuis ton carnet du livre (rempli à ${carnetPct(cn)} %)</div>
      ${gr.length?gr.map(([k,t,d])=>`<label class="check" style="align-items:flex-start"><input type="checkbox" data-ob="${k}" checked><span><b>${esc(t)}</b><br><span class="small muted">${d}</span></span></label>`).join(''):'<p class="small muted" style="margin:0">Ton carnet ne contient pas encore de montants à reprendre.</p>'}
      <p class="small muted" style="margin:0">Tout reste modifiable ensuite. Si tu réimportes plus tard, ces éléments sont mis à jour sans doublon.</p>`
      :`<p class="small muted" style="margin:0">Tu n’as pas encore rempli le carnet du livre. Ce n’est pas grave : commence avec une feuille vide, ou lis le livre et remplis le carnet, puis reviens dans Réglages › « Importer mon carnet ».</p>`}
    <p class="small muted" style="margin:0">Tes données restent dans ce navigateur, sur cet appareil. Pense à faire une sauvegarde chaque mois avec le bouton « Sauvegarder » en haut de l’écran.</p></div>`;
  openModal(first?'Ta feuille de départ':'Importer mon carnet',body,`${first&&window.CFShell?`<a class="btn ghost" style="text-decoration:none;color:inherit" href="${window.CFShell.livre}">Lire le livre d’abord</a>`:''}<span class="sp"></span><button class="btn solid" data-act="ob-go">${gr.length?'Créer ma feuille':'Commencer'}</button>`,{wide:true})}
async function obApply(){const G=S.obPlan;const sel=new Set([...document.querySelectorAll('[data-ob]')].filter(e=>e.checked).map(e=>e.dataset.ob));const on=k=>sel.has(k);
  const name=val('ob-name').trim(),prof=val('ob-prof').trim();S.cfg.player.name=name;S.cfg.player.profession=prof;S.cfg.onboarded=true;
  const put=(arr,x,keep)=>{const i=arr.findIndex(y=>y.id===x.id);if(i<0){arr.push(x);return}const old=arr[i];const o={...old,...x};for(const k of keep||[])if(old[k]!=null)o[k]=old[k];arr[i]=o};
  let n=0;
  if(G){
    if(G.micro&&on('micro')){let c=S.cfg.cats.find(x=>x.id==='i-activite');if(!c){c={id:'i-activite',kind:'inc',name:'Chiffre d’affaires micro-entreprise',parent:null,nature:'actif',bucket:'exploit'};const i=S.cfg.cats.findIndex(x=>x.id==='i-declarer');S.cfg.cats.splice(i<0?S.cfg.cats.length:i,0,c)}
      c.tax={...taxFromPreset(G.micro.preset),vl:G.micro.vl};S.cfg.companies=S.cfg.companies||[];
      if(!S.cfg.companies.some(x=>(x.incCats||[]).includes('i-activite')))S.cfg.companies.push({id:'co-'+G.micro.preset,name:'Ma micro-entreprise',regime:G.micro.preset,incCats:['i-activite']});
      S.cfg=migrate(S.cfg);n++}
    if(on('flux'))for(const r of G.flux){if(r.catId==='i-activite'&&!S.cfg.cats.some(x=>x.id==='i-activite'))r.catId='i-autres';put(S.cfg.recurrences,{...r,done:{},history:[]},['done','history','start']);n++}
    if(on('compte')){if(G.compte){const a=S.cfg.accounts.find(x=>x.id===G.compte.id);if(a&&a.initial==null){a.initial=G.compte.initial;a.initialDate=G.compte.initialDate}}if(G.budget)S.cfg.settings.budget=G.budget;n++}
    if(on('biens'))for(const b of G.biens){put(S.cfg.properties,{...b,events:[],history:[]},['events','history','rentDone','incomeAuto','rentDay','rentAccountId','rentFrom','buyPrice','buyFees','buyDate','apport']);n++}
    if(on('patri')){for(const a of G.assets)put(S.cfg.assets,a,['history']);for(const d of G.debts)put(S.cfg.debts,d,['history']);for(const x of G.sources)put(S.cfg.passiveSources,x);n++}
    if((on('biens')&&G.biens.some(b=>b.rental))||(on('patri')&&G.sources.length))S.cfg.settings.passiveSrc='estime';
    if(G.reve&&on('reve')){const ft=S.cfg.fastTrack;ft.dreamName=G.reve.dreamName||ft.dreamName;ft.dreamCost=G.reve.dreamCost??ft.dreamCost;ft.targetDate=G.reve.targetDate||ft.targetDate||null;n++}
  }
  closeModal(true);if(typeof nwSnapshot==='function')try{nwSnapshot()}catch(e){}
  await saveCfg();
  if(G&&on('memos'))for(const m of G.memos){const old=(S.memos||[]).find(x=>x.id===m.id);await memoSave(old?{...old,...m,done:old.done}:m,true)}
  render();autoGenerate();toast(n?'Ta feuille est prête. Les montants mensuels t’attendent dans Prévisions.':'C’est parti !')}
function maybeOnboard(){if(!DIST||S.obShown||S.cfg.onboarded||!S.cfgLoaded||!S.monthsLoaded)return;if(Object.keys(S.months).length){S.cfg.onboarded=true;saveCfg();return}S.obShown=true;setTimeout(()=>obOpen(true),60)}

/* ==================== Démarrage ==================== */
async function boot(){
  render();
  let db=null;
  try{db=window.claude&&window.claude.use?await window.claude.use('db'):null}catch(e){db=null}
  if(!db){S.mode='local';render();autoGenerate();return}
  S.db=db;S.mode='db';render();
  db.doc('fin/prices').onSnapshot(snap=>{if(snap.exists){const d=clone(snap.data());S.prices={history:d.history||{},src:d.src||{},updatedAt:d.updatedAt||null};if(S.pfPending&&S.prices.updatedAt&&Date.parse(S.prices.updatedAt)>S.pfPending){S.pfPending=null;toast('Cours mis à jour')}}render()},err=>console.warn(err));
  db.doc('fin/config').onSnapshot(snap=>{if(snap.exists){MIG.dirty=false;MIG.linked=0;S.cfg=migrate(clone(snap.data()));if(MIG.dirty){saveCfg();if(MIG.linked)toast(MIG.linked+(MIG.linked>1?' lignes de biens reliées à leurs contrats':' ligne reliée à son contrat'))}}S.cfgLoaded=true;render();autoGenerate();maybeOnboard()},err=>{console.warn(err);toast('Lecture des réglages impossible pour le moment.')});
  db.collection('memos').onSnapshot(qs=>{S.memos=qs.docs.map(d=>({id:d.id,...d.data()}));S.memosLoaded=true;if(S.route==='memos')render()},err=>console.warn(err));
  db.collection('months').onSnapshot(qs=>{if(S.inflight>0)return;const m={};qs.docs.forEach(d=>{const x=d.data();m[d.id]=(x&&x.items)||[]});S.months=m;S.monthsLoaded=true;render();autoGenerate();maybeOnboard()},err=>{console.warn(err);toast('Lecture des opérations impossible pour le moment.')});
}
boot();
</script>
