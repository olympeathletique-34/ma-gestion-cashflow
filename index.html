<script>
"use strict";
/* =====================================================================
   EMPIRE — jeu de gestion financière (esprit CASHFLOW), un seul fichier.
   Chiffres volontairement simplifiés : le but est de comprendre les mécanismes.
   ===================================================================== */
const $=s=>document.querySelector(s);
const rnd=Math.random,pick=a=>a[Math.floor(rnd()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const gauss=()=>{let u=0,v=0;while(!u)u=rnd();while(!v)v=rnd();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v);};
const fmt=n=>{n=Math.round(n);const s=Math.abs(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');return (n<0?'−':'')+s+' €';};
const fmtK=n=>Math.abs(n)>=1e6?(n/1e6).toFixed(2).replace('.',',')+' M€':Math.abs(n)>=1e4?Math.round(n/1000)+' k€':fmt(n);
const pct=(x,d)=>(x*100).toFixed(d==null?1:d).replace('.',',')+' %';
const kk=n=>n>=1000?(Math.round(n/100)/10).toString().replace('.',',')+' k€':fmt(n);
const sg=n=>(n>=0?'+':'')+fmt(n);
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function payment(L,rate,n){const r=rate/12;return r>0?L*r/(1-Math.pow(1+r,-n)):L/n;}
function wpick(o){let t=0;for(const k in o)t+=o[k];let r=rnd()*t;for(const k in o){r-=o[k];if(r<=0)return k;}return Object.keys(o)[0];}

/* ---------- données ---------- */
const W=31,H=25,OX=H*32+60,OY=190,SCW=(W+H+4)*32+120,SCH=(W+H)*16+OY+70;
const P=(x,y)=>[OX+(x-y)*32,OY+(x+y)*16];

function value(p){const t=TYPES[p.type];if(t.pub)return 0;return t.price*DIST[p.dist].pi*S.di[p.dist]*S.mkt*(0.6+0.4*p.etat/100);}

const rentOf=p=>rentBase(p)*LVL[p.rentLvl]*(p.meuble?1.12:1);
const chargesOf=p=>rentBase(p)*0.08+value(p)*0.0015/12;
const tfOf=p=>value(p)*0.0042/12;
const isRentable=p=>{const t=TYPES[p.type];return !t.pub&&t.rent>0;};
function propLoan(p){return S.loans.find(l=>l.prop===p.id);}
function propCashflow(p){ // cashflow mensuel estimé d'un bien du joueur (avant impôt)
 const l=propLoan(p);let cf=-chargesOf(p)-tfOf(p)-(l?l.pay:0);
 if(p.renting&&p.tenant&&!p.renov&&!p.build)cf+=rentOf(p)*(p.agence?0.93:1);
 return cf;
}
function stockValue(){let v=0;for(const k in S.stk)v+=S.stk[k].q*S.stk[k].p;return v;}
function compValue(){
 const c=S.comp;if(!c)return 0;const h=c.hist.slice(-12);if(!h.length)return Math.max(0,c.tres);
 const avg=h.reduce((s,x)=>s+x.ebe,0)/h.length;
 const norm=c.gerant?0:2500;
 const proDebt=S.loans.filter(l=>l.kind==='pro').reduce((s,l)=>s+l.rest,0);
 return Math.max(0,(avg-norm)*12*(c.gerant?4:2.5))+Math.max(0,c.tres)-proDebt;
}
function debts(perso){return S.loans.filter(l=>perso?l.kind!=='pro':true).reduce((s,l)=>s+l.rest,0)+(S.ft?S.ft.hold.reduce((s,h)=>s+(h.debt||0),0):0);}
function netWorth(){
 let v=S.P.cash+S.P.livret+stockValue()+compValue()-debts(true);
 for(const p of S.props)if(p.owner===0)v+=value(p);
 if(S.ft)for(const h of S.ft.hold)v+=h.val;
 return v;
}
function rivalWorth(r){let v=r.cash;for(const p of S.props)if(p.owner===r.id)v+=value(p);for(const l of r.loans)v-=l.rest;return v;}

function bankIncome(extraRent){
 let rev=S.P.job?S.P.salary:0;const c=S.comp;
 if(c&&c.age>=24){const h=c.hist.slice(-12);rev+=Math.max(0,h.reduce((s,x)=>s+x.owner,0)/Math.max(1,h.length));}
 let rents=extraRent||0;for(const p of S.props)if(p.owner===0&&p.tenant&&p.renting)rents+=rentOf(p);
 return rev+.7*rents;
}
function bankCheck(newPay,newRent){
 const rev=bankIncome(newRent);
 const cur=S.loans.filter(l=>l.kind!=='pro').reduce((s,l)=>s+l.pay,0);
 if(rev<=0)return {ok:false,ratio:1,msg:'Refusé : la banque ne voit aucun revenu stable (salaire, 2 ans de bilans, loyers).'};
 const ratio=(cur+newPay)/rev;
 if(ratio<=.35)return {ok:true,ratio,msg:'Accordé : taux d\'endettement '+pct(ratio,0)+' (maximum 35 %).'};
 if(ratio<=.45&&newRent*.92-newPay>=0)return {ok:true,ratio,msg:'Accordé par dérogation : '+pct(ratio,0)+' d\'endettement, mais l\'opération s\'autofinance.'};
 return {ok:false,ratio,msg:'Refusé : taux d\'endettement '+pct(ratio,0)+' (maximum 35 %). Augmente ton apport, tes revenus, ou choisis un bien qui s\'autofinance.'};
}
const loanRate=dur=>S.rate+(dur===15?-.002:dur===25?.002:0);

/* ---------- comptes du mois ---------- */
function ledger(){
 const p=S.P,L={};
 L.salaire=p.job?p.salary:0;L.chom=p.chom.m>0?p.chom.amt:0;
 let loyers=0,charges=0,tf=0,agence=0,homeCh=0,intImmo=0,payImmo=0,payHome=0,payPerso=0,meub=0,meubCh=0;
 for(const q of S.props){
  if(q.owner!==0)continue;
  if(q.home){homeCh+=chargesOf(q)+tfOf(q);continue;}
  charges+=chargesOf(q);tf+=tfOf(q);
  if(q.renting&&q.tenant&&!q.renov&&!q.build&&q.noRent<=0){const r=rentOf(q);loyers+=r;if(q.agence)agence+=.07*r;if(q.meuble)meub+=r;}
  if(q.meuble)meubCh+=chargesOf(q)+tfOf(q);
 }
 for(const l of S.loans){
  if(l.kind==='pro')continue;
  const pr=l.prop?propById(l.prop):null;
  if(pr&&pr.home)payHome+=l.pay;else if(pr){payImmo+=l.pay;if(!pr.meuble)intImmo+=l.rest*l.rate/12;}else payPerso+=l.pay;
 }
 const c=S.comp;L.boite=c&&c.last?c.last.owner:0;L.boitePassif=!!(c&&c.gerant);
 let div=0;for(const k in S.stk)div+=S.stk[k].q*S.stk[k].p*ASSETS[k].div/12;
 L.div=div*.7;L.livret=p.livret*.017/12;
 const base=(loyers-meub)-(charges+tf-meubCh)-agence-intImmo-p.travauxM;
 L.meub=meub;
 let def=p.deficit,taxF=0;
 if(base>0){const t=Math.max(0,base-def);def=Math.max(0,def-base);taxF=.3*t;}else def=Math.min(200000,def-base);
 L.newDef=def;
 L.loyers=loyers;L.charges=charges;L.tf=tf;L.agence=agence;L.taxF=taxF;L.payImmo=payImmo;
 L.vie=p.vie;L.logement=p.home?0:p.logement;L.homeCh=homeCh;L.payHome=payHome;L.payPerso=payPerso;
 const remSoc=c&&c.statut!=='micro'?L.boite:0;
 L.ir=.1*(L.salaire+remSoc)+.06*L.chom;
 L.actif=L.salaire+L.chom+(L.boitePassif?0:L.boite);
 let ftCf=0;if(S.ft)for(const h of S.ft.hold)ftCf+=h.cf||0;L.ftCf=ftCf;L.life=S.ft?lifeCost():0;
 L.pas=loyers-charges-tf-agence-payImmo-taxF+L.div+L.livret+(L.boitePassif?L.boite:0)+ftCf;
 L.dep=L.vie+L.logement+homeCh+payHome+payPerso+L.life;
 L.cf=L.actif+L.pas-L.dep-L.ir;
 return L;
}

/* ---------- entreprise ---------- */
function createCompany(act,statut,prop,silent){
 const a=ACT[act];
 S.comp={act,statut,prop:prop?prop.id:null,rentPaid:0,price:a.price0,q:1,pub:0,emp:0,empExtra:0,gerant:false,rem:0,tres:0,rep:.3,aud:0,age:0,hist:[],last:null,caYear:0,over:0,compBoost:0,repBoost:0,malus:0,created:S.day};
 if(prop){
  prop.biz=0;prop.forSale=false;
  if(prop.owner===0){prop.renting=false;prop.tenant=false;}else{prop.tenant=false;S.comp.rentPaid=rentBase(prop);}
 }
 S.flags.hadComp=true;sceneDirty=true;
 if(!silent){S.P.cash-=a.setup;journal('Création de ta boîte : '+a.n+' ('+STATUTS[statut].n+')');toast('🏢 Ta boîte est créée !','g');}
}
function closeCompany(){
 const c=S.comp;if(!c)return;
 const pr=c.prop?propById(c.prop):null;
 if(pr){pr.biz=null;if(pr.owner===0){pr.renting=true;pr.tenant=false;}else pr.tenant=true;}
 if(c.tres>0)S.P.cash+=c.tres*.7;
 S.loans=S.loans.filter(l=>l.kind!=='pro');
 S.comp=null;sceneDirty=true;
}
function compCapacity(c){
 const a=ACT[c.act];if(a.scal)return 1e9;
 const ownerF=c.gerant?0:(S.P.job?.35:1)*S.P.ownerMul;
 return a.ownerCap*ownerF+a.empCap*c.emp+(c.gerant?a.ownerCap:0);
}
function simComp(){
 const c=S.comp,a=ACT[c.act];c.age++;
 const pr=c.prop?propById(c.prop):null;
 const loc=pr?DIST[pr.dist].traffic:1;
 const ref=a.price0*[.85,1,1.25][c.q];
 const priceF=Math.pow(ref/c.price,a.el);
 const pubF=1+1.3*c.pub/(c.pub+a.pubK);
 let nComp=S.rivals.filter(r=>r.biz&&r.biz.act===c.act&&!r.bankrupt).length+(c.compBoost>0?1:0);
 const compF=1/(1+.3*nComp);
 const ramp=Math.min(1,.3+.12*c.age);
 let audF=1;
 if(a.scal){const ownerF=c.gerant?1:(S.P.job?.35:1);c.aud=c.aud*.97+c.pub*.35+ownerF*30+c.emp*120;audF=1+c.aud/600;}
 const capa=compCapacity(c);
 const D=a.base*loc*priceF*(.5+c.rep)*pubF*compF*ramp*audF*(S.recession>0?.75:1)*(c.malus>0?.6:1)*(.9+.2*rnd());
 const sold=Math.min(D,capa);
 let target=[.35,.55,.8][c.q];if(D>capa*1.15)target-=.15;
 c.rep=clamp(c.rep+(target-c.rep)*.1+c.repBoost,.05,1);c.repBoost=0;
 const CA=sold*c.price,achats=CA*a.cogs*[.8,1,1.35][c.q];
 const sal=c.emp*a.empCost+c.empExtra+(c.gerant?3000:0);
 const loyer=c.rentPaid,pub=c.pub,divers=120+.02*CA+(c.statut!=='micro'?180:0);
 let proPay=0;for(const l of S.loans)if(l.kind==='pro')proPay+=l.pay;
 const res=CA-achats-sal-loyer-pub-divers-proPay;
 const o={D,sold,capa,CA,achats,sal,loyer,pub,divers,proPay,res,cotis:0,remCost:0,IS:0,owner:0,ebe:res};
 if(c.statut==='micro'){o.cotis=CA*(a.comm?.133:.234);o.owner=res-o.cotis;c.caYear+=CA;}
 else{
  o.remCost=c.rem*(c.statut==='eurl'?1.45:1.82);
  const b=res-o.remCost;o.IS=b>0?(b<=3541?.15*b:531+.25*(b-3541)):0;
  c.tres+=b-o.IS;o.owner=c.rem;o.net=b-o.IS;
 }
 c.last=o;c.hist.push({CA,res:c.statut==='micro'?o.owner:o.net,ebe:res-(c.statut==='micro'?o.cotis:0)+(c.gerant?0:0),owner:o.owner});
 if(c.hist.length>36)c.hist.shift();
 if(c.compBoost>0)c.compBoost--;if(c.malus>0)c.malus--;
 if(c.statut!=='micro'&&c.tres<-3000&&!S.evq.some(e=>e.id==='redressement'))queueEvent('redressement');
 if(month()%12===11&&c.statut==='micro'){
  const plaf=a.comm?188700:77700;
  if(c.caYear>plaf){c.over++;
   if(c.over>=2){c.statut='eurl';c.rem=Math.max(1500,Math.round(o.owner/250)*250);modalMsg('Fin de la micro-entreprise','<p>Ton chiffre d\'affaires a dépassé le plafond deux années de suite : ta boîte passe automatiquement en <b>EURL</b>.</p><div class="lecon">💡 La micro-entreprise est faite pour démarrer. Quand ça grossit, une société permet de déduire les charges et de choisir ta rémunération.</div>');}
   else toast('⚠️ Ton chiffre d\'affaires dépasse le plafond de la micro-entreprise ('+fmt(plaf)+'). Pense à passer en société.','a',7000);
  }
  c.caYear=0;
 }
}

/* ---------- concurrents ---------- */
function rivalMonth(r){
 if(r.bankrupt)return;
 let inc=r.salary-r.life;
 for(const p of S.props)if(p.owner===r.id){inc+=rentOf(p)*(r.id===1?.85+rnd()*.15:.95)-chargesOf(p)-tfOf(p);}
 for(const l of r.loans){inc-=l.pay;l.rest=Math.max(0,l.rest-(l.pay-l.rest*l.rate/12));}
 r.loans=r.loans.filter(l=>l.rest>1);
 r.cash+=inc;
 if(rnd()<.6){
  const c=S.props.filter(p=>p.forSale&&p.owner===-1&&isRentable(p)).map(p=>({p,y:rentBase(p)*12/p.ask})).filter(o=>o.y>=r.minY).sort((a,b)=>b.y-a.y);
  if(c.length){const p=c[0].p,need=p.ask*(1-r.lev)+p.ask*.08;
   if(r.cash-need>8000){r.cash-=need;p.owner=r.id;p.forSale=false;p.cost=p.ask;p.tenant=true;
    if(r.lev>0)r.loans.push({prop:p.id,rest:p.ask*r.lev,pay:payment(p.ask*r.lev,S.rate,240),rate:S.rate});
    sceneDirty=true;journal(r.name+' achète un '+TYPES[p.type].n.toLowerCase()+' ('+DIST[p.dist].n+')');}}
 }
 for(const p of S.props)if(p.owner===r.id&&!p.forSale&&p.biz==null&&value(p)>p.cost*1.3&&rnd()<.03){p.forSale=true;p.saleM=0;p.ask=Math.round(value(p)*1.04/500)*500;sceneDirty=true;}
 if(!r.biz&&rnd()<.03){const loc=S.props.find(p=>p.owner===r.id&&TYPES[p.type].biz);if(loc){const act=pick(Object.keys(ACT));r.biz={act,prop:loc.id};loc.biz=r.id;loc.tenant=false;sceneDirty=true;journal(r.name+' ouvre : '+ACT[act].n);if(S.comp&&S.comp.act===act)toast(r.ic+' '+r.name+' ouvre une boîte concurrente de la tienne !','a',6000);}}
 if(r.cash<-15000){
  r.bankrupt=true;journal(r.name+' fait faillite !');
  toast('📰 '+r.name+' fait faillite : ses biens partent aux enchères.','c',7000);
  for(const p of S.props.filter(p=>p.owner===r.id)){p.owner=-1;p.biz=null;p.tenant=true;}
  r.loans=[];r.biz=null;
  const bs=S.props.filter(p=>p.owner===-1&&isRentable(p)&&!p.forSale);
  for(let i=0;i<2;i++)queueEvent('encheres',{prop:pick(bs)});
  sceneDirty=true;
 }
}

/* ---------- temps ---------- */
function stocksDay(){
 const m=gauss();
 for(const k in S.stk){const a=ASSETS[k],s=S.stk[k];
  const e=a.c*m+Math.sqrt(1-a.c*a.c)*gauss();
  s.p*=Math.exp((a.mu-a.vol*a.vol/2)/365+a.vol/Math.sqrt(365)*e);
  if(S.day%7===0){s.h.push(s.p);if(s.h.length>104)s.h.shift();}
 }
}
function dayTick(){
 S.day++;
 stocksDay();
 for(const p of S.props){
  if(p.owner!==0)continue;
  if(p.renov>0){p.renov--;if(p.renov===0){p.etat=100;sceneDirty=true;toast('🔨 Rénovation terminée : '+TYPES[p.type].n,'g');}}
  if(p.build){p.build.d--;if(p.build.d<=0){p.type=p.build.type;p.etat=100;p.build=null;p.renting=true;p.tenant=false;sceneDirty=true;toast('🏗️ Construction terminée : '+TYPES[p.type].n+' !','g');journal('Construction terminée : '+TYPES[p.type].n);}}
  if(p.renting&&!p.tenant&&!p.renov&&!p.build&&isRentable(p)&&p.biz==null){
   const ch=DIST[p.dist].dem*[1.7,1,.5][p.rentLvl]*(p.agence?1.5:1)*(p.etat<40?.5:1)*(S.recession>0?.6:1)/25;
   if(rnd()<ch){p.tenant=true;sceneDirty=true;toast('🔑 Nouveau locataire : '+TYPES[p.type].n+' ('+DIST[p.dist].n+'), '+fmt(rentOf(p))+'/mois','g');}
  }
  if(p.selling&&rnd()<1/(30*p.selling.m))sellProp(p,p.selling.price);
 }
 if(S.day%30===29)monthEnd();
}
function monthEnd(){
 const m=month(),p=S.P;
 // marché
 S.rate=clamp(S.rate+(.034-S.rate)*.03+gauss()*.0008,.012,.065);
 S.mkt=clamp(S.mkt*(1+(.034-S.rate)*.003+gauss()*.004),.6,1.6);
 for(const d in DIST)S.di[d]=clamp(S.di[d]*(1+(DIST[d].trend+S.dtr[d])/12+gauss()*DIST[d].vol/3.5),.5,2.5);
 if(S.dtrM>0&&--S.dtrM===0)for(const d in S.dtr)S.dtr[d]=0;
 if(S.recession>0)S.recession--;
 // annonces
 for(const q of S.props){
  if(!q.forSale)continue;q.saleM++;q.noNego=false;
  if(q.owner===-1){if(q.saleM===3||q.saleM===5)q.ask=Math.round(q.ask*.95/500)*500;if(q.saleM>7){q.forSale=false;sceneDirty=true;}}
 }
 const npc=S.props.filter(q=>q.owner===-1&&!q.forSale&&!TYPES[q.type].pub&&q.biz==null);
 const n=2+Math.floor(rnd()*3);for(let i=0;i<n;i++)putForSale(pick(npc));
 if(S.props.filter(q=>q.forSale&&q.owner<0).length<8)for(let i=0;i<4;i++)putForSale(pick(npc));
 sceneDirty=true;
 for(const r of S.rivals)rivalMonth(r);
 if(S.comp)simComp();
 // comptes
 if(S.ft)simHoldings();
 const L=ledger();S.lastL=L;
 p.cash+=L.cf;p.deficit=L.newDef;p.travauxM=0;
 for(const l of S.loans){const i=l.rest*l.rate/12;if(l.kind==='pro'){S.comp&&(S.comp.tres-=0);}l.rest=Math.max(0,l.rest-(l.pay-i));l.left--;}
 const fin=S.loans.filter(l=>l.left<=0||l.rest<1);
 for(const l of fin)toast('🎉 Crédit terminé : '+l.label+' (−'+fmt(l.pay)+'/mois)','g',6000);
 S.loans=S.loans.filter(l=>l.left>0&&l.rest>=1);
 if(p.chom.m>0){p.chom.m--;if(p.chom.m===0&&!p.job)toast('Tes droits au chômage sont terminés.','a');}
 if(p.jobSearch>0){p.jobSearch--;if(p.jobSearch===0){p.job=true;p.salary=Math.round((p.oldSalary||2200)*.95/50)*50;p.chom.m=0;toast('💼 Tu as retrouvé un emploi : '+fmt(p.salary)+'/mois','g',6000);journal('Nouvel emploi');}}
 // DCA
 if(S.dca>0&&p.cash>=S.dca){buyStock('monde',S.dca,true);}
 // locataires
 let imp=null;
 for(const q of S.props){
  if(q.owner!==0)continue;
  if(q.noRent>0)q.noRent--;
  q.etat=Math.max(5,q.etat-(q.tenant?.4:.2));
  if(q.tenant&&q.renting&&!q.home&&q.biz==null){
   const leave=.022+(q.meuble?.015:0)+(q.rentLvl===2?.02:0)+(q.etat<50?.03:0)+(S.recession>0?.02:0);
   if(rnd()<leave){q.tenant=false;q.noRent=0;sceneDirty=true;toast('🚪 Ton locataire du '+TYPES[q.type].n.toLowerCase()+' ('+DIST[q.dist].n+') est parti.','a');}
   else if(!q.agence&&!imp&&q.noRent<=0&&rnd()<DIST[q.dist].risk*(q.rentLvl===2?1.4:1)*.6)imp=q;
  }
  if(q.tenant&&!q.home)addFloat(q,rentOf(q));
 }
 if(imp)queueEvent('impaye',{prop:imp});
 // nouvel an
 if(m%12===0&&m>0){
  S.rentIdx*=1.022;p.vie*=1.022;p.logement*=1.022;if(p.job)p.salary=Math.round(p.salary*1.015);
  if(S.comp&&S.comp.rentPaid)S.comp.rentPaid*=1.022;
  toast('🎆 Bonne année ! Inflation +2,2 % : loyers, dépenses et salaires augmentent.','c',6000);journal('Inflation annuelle +2,2 %');
 }
 // trésorerie négative
 if(p.cash<0){
  S.negM++;
  if(S.negM===1&&!auto)modalMsg('⚠️ Trésorerie négative','<p>Ton compte est à '+fmt(p.cash)+'. La banque te laisse un mois. Le mois prochain, si c\'est toujours négatif, elle fera vendre un de tes biens à prix cassé.</p><div class="lecon">💡 Solutions : retirer de l\'argent du livret, vendre des actions, baisser tes dépenses, ou vendre un bien qui coûte plus qu\'il ne rapporte.</div>');
  if(S.negM>=2)forcedSale();
 }else S.negM=0;
 // historique
 S.hist.push({m,nw:netWorth(),cf:L.cf,pas:L.pas,dep:L.dep,cash:p.cash});if(S.hist.length>480)S.hist.shift();
 // victoire
 if(!S.won&&L.pas>=L.dep&&L.dep>0){S.won=true;S.wonM=m;journal('Sortie de la Rat Race !');queueEvent('victoire');}
 else if(S.ft&&!S.ft.active&&L.pas>=L.dep&&L.dep>0){S.ft.active=true;S.ft.neg=0;toast('🌟 Te revoilà dans la Fast Track !','g',7000);journal('Retour dans la Fast Track');}
 if(S.ft)ftMonth(L);
 // conseils
 if(m<24&&m%2===1&&S.tipI<TIPS.length)toast('🧔 Le père riche : '+TIPS[S.tipI++],'c',9000);
 // événements
 S.evCd--;
 if(S.evCd<=0&&m>=1&&rnd()<.65){const e=randomEvent();if(e){queueEvent(e.id,e.ctx);S.evCd=1+Math.floor(rnd()*2);}}
 checkObjectives();
 save();
}
function forcedSale(){
 const own=S.props.filter(q=>q.owner===0&&!q.build);
 if(!own.length){
  if(stockValue()>0){for(const k in S.stk)sellStock(k,1);return;}
  if(S.P.livret>0){S.P.cash+=S.P.livret;S.P.livret=0;return;}
  if(!auto)gameOver();else S.over=true;return;
 }
 own.sort((a,b)=>propCashflow(a)-propCashflow(b));
 const q=own[0];sellProp(q,value(q)*.8,true);
 if(!auto)modalMsg('Vente forcée','<p>La banque a fait vendre ton '+TYPES[q.type].n.toLowerCase()+' ('+DIST[q.dist].n+') à 80 % de sa valeur pour combler ton découvert.</p><div class="lecon">💡 Une réserve de trésorerie évite de vendre au pire moment. Les investisseurs qui se font ruiner sont rarement ceux qui achètent mal : ce sont ceux qui manquent de liquidités.</div>');
}
function gameOver(){
 running=false;
 modal({title:'💀 Faillite personnelle',html:'<p>Tu n\'as plus rien à vendre et ton compte est dans le rouge.</p><div class="lecon">💡 Dans le vrai jeu de Kiyosaki comme dans la vie : trop de dettes de consommation et pas de réserve, c\'est la chute. Recommence en gardant un matelas de sécurité.</div>',buttons:[{t:'Recommencer',cls:'go',fn:showStart}]});
}

/* ---------- opérations ---------- */
function buyProp(p,price,fin){
 const fees=price*.08,loan=fin.cash?0:price*(1-fin.apport),need=price+fees-loan;
 if(S.P.cash<need){toast('Pas assez de trésorerie ('+fmt(need)+' nécessaires)','a');return false;}
 const rate=loanRate(fin.dur),pay=loan?payment(loan,rate,fin.dur*12):0;
 if(loan){const b=bankCheck(pay,isRentable(p)?rentBase(p):0);if(!b.ok){toast(b.msg,'a',6000);return false;}}
 S.P.cash-=need;
 if(p.owner>0){const r=S.rivals.find(r=>r.id===p.owner);const rl=r.loans.find(l=>l.prop===p.id);r.cash+=price-(rl?rl.rest:0);r.loans=r.loans.filter(l=>l!==rl);}
 p.owner=0;p.forSale=false;p.cost=price+fees;p.buyDay=S.day;p.renting=isRentable(p);p.rentLvl=1;p.travaux=0;p.selling=null;
 if(loan)newLoan('Crédit '+TYPES[p.type].n.toLowerCase()+' ('+DIST[p.dist].n+')',loan,rate,fin.dur*12,'immo',p.id);
 sceneDirty=true;journal('Achat : '+TYPES[p.type].n+' ('+DIST[p.dist].n+') pour '+fmt(price));
 toast('🎉 Achat signé : '+TYPES[p.type].n+' pour '+fmt(price),'g');
 checkObjectives();
 return true;
}
function sellCalc(p,price){
 const l=propLoan(p),rest=l?l.rest:0,ira=rest*.03;
 const years=(S.day-p.buyDay)/360,gain=price-p.cost-p.travaux;
 const tax=p.home?0:Math.max(0,gain)*.36*Math.max(0,1-years/22);
 return {rest,ira,tax,gain,net:price-rest-ira-tax};
}
function sellProp(p,price,forced){
 const s=sellCalc(p,price);
 S.P.cash+=s.net;S.loans=S.loans.filter(l=>l.prop!==p.id);
 if(p.home){p.home=false;S.P.home=null;}
 if(p.biz===0&&S.comp){closeCompany();toast('Ta boîte a dû fermer avec la vente de son local.','a');}
 p.owner=-1;p.selling=null;p.forSale=false;p.tenant=true;p.renting=true;
 sceneDirty=true;journal((forced?'Vente forcée : ':'Vente : ')+TYPES[p.type].n+' pour '+fmt(price)+' (net '+fmt(s.net)+')');

}
function renovCost(p){return Math.round(TYPES[p.type].work*(100-p.etat)/25/100)*100;}
function startRenov(p){
 const c=renovCost(p);if(S.P.cash<c){toast('Pas assez de trésorerie','a');return;}
 S.P.cash-=c;S.P.travauxM+=c;p.travaux+=c;p.renov=30+Math.round(100-p.etat);p.tenant=false;sceneDirty=true;
 toast('🔨 Travaux lancés ('+p.renov+' jours)');journal('Rénovation : '+TYPES[p.type].n+' pour '+fmt(c));
}
function buyStock(k,amt,silent){
 if(amt<=0||S.P.cash<amt)return;const s=S.stk[k];S.P.cash-=amt;s.q+=amt/s.p;s.c+=amt;
 if(!silent)toast('📈 Achat '+ASSETS[k].n+' : '+fmt(amt));
}
function sellStock(k,f){
 const s=S.stk[k];if(s.q<=0)return 0;
 const proceeds=s.q*f*s.p,gain=proceeds-s.c*f,tax=Math.max(0,gain)*.3;
 S.P.cash+=proceeds-tax;s.q*=1-f;s.c*=1-f;if(s.q<1e-9){s.q=0;s.c=0;}
 return proceeds-tax;
}

   let g=h.gross*(1+gauss()*.07)*(rec?.8:1);

   if(h.trouble>0){g*=.5;h.trouble--;}else if(h.age>3&&rnd()<.006){h.trouble=8;toast('⚠️ '+h.name+' traverse une mauvaise passe : revenus divisés par 2 pendant 8 mois.','a',7000);}

  }else if(h.kind==='promo'){

function ftAction(a,d){
 const f=S.ft;
 switch(a){
  case 'fttab':ftTab=d.t;return true;
  case 'ftbuy':{const dl=f.deals.find(x=>x.id===+d.id);if(!dl)return true;if(!confirmBox('Investir '+fmt(dealOut(dl))+' dans « '+dl.name+' » ?'))return true;buyDeal(dl);return true;}
  case 'ftsell':{const h=f.hold.find(x=>x.id===+d.id);if(h)sellHold(h);return true;}
  case 'ftlife':{const i=f.life.indexOf(d.k);if(i>=0)f.life.splice(i,1);else{f.life.push(d.k);buzz(10);}return true;}
  case 'fthouse':{if(S.P.home)return true;if(S.P.cash<4000){toast('Il te faut 4 000 € pour déménager','a');return true;}const o=HOUSES.find(x=>x.k===d.k);S.P.cash-=4000;f.house=o.k;S.P.logement=o.c==null?f.baseRent:o.c;journal('Déménagement : '+o.n);toast('📦 Tu emménages : '+o.n,'g');return true;}
  case 'ftach':achieveDream();closePanel();return 'stop';
  case 'ftnew':queueEvent('reve');closePanel();return 'stop';
 }
 return false;
}

function randomEvent(){
 const c=[];for(const id in EV){const e=EV[id];if(!e.w)continue;if(e.cond&&!e.cond())continue;c.push(id);}
 if(!c.length)return null;
 const o={};for(const id of c)o[id]=EV[id].w;const id=wpick(o);
 const ctx=EV[id].make?EV[id].make():{};if(ctx&&ctx.prop===undefined&&EV[id].make&&!ctx.prix&&!ctx.r&&!ctx.h)return null;
 return {id,ctx};
}
function queueEvent(id,ctx){S.evq.push({id,ctx:ctx||{}});}
function runEvents(){
 if(!S||!S.evq.length||$('#mod').className.indexOf('cache')<0||!$('#pan').classList.contains('cache'))return;
 const ev=S.evq.shift(),e=EV[ev.id],c=ev.ctx;
 if(c.prop&&(c.prop.owner===undefined))return;
 if(e.pre)e.pre(c);
 const ch=e.ch(c);
 if(auto){const ok=ch.filter(x=>!x.dis);const x=pick(ok.length?ok:ch);x.fx();if(x.then)x.then();sceneDirty=true;return;}
 buzz(ev.id==='victoire'?[80,60,80,60,220]:[18,40,18]);
 modal({title:e.t,html:e.txt(c),buttons:ch.map(x=>({t:x.t,dis:x.dis,keep:true,fn:()=>{
  const r=x.fx();if(x.then)x.then();sceneDirty=true;
  $('#modC').innerHTML='<h2>'+e.t+'</h2><div class="res">'+r+'</div><div class="lecon">💡 '+e.l+'</div><div class="btns"><button class="btn go" id="evok">Continuer</button></div>';
  $('#evok').onclick=closeModal;}}))});
}

function shade(hex,f){const n=parseInt(hex.slice(1),16);return 'rgb('+clamp(Math.round((n>>16&255)*f),0,255)+','+clamp(Math.round((n>>8&255)*f),0,255)+','+clamp(Math.round((n&255)*f),0,255)+')';}
function poly(g,pts,fill,stroke){g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=1;g.stroke();}}
const fp=(A,B,u,z)=>[A[0]+(B[0]-A[0])*u,A[1]+(B[1]-A[1])*u-z];
const up=(A,h)=>[A[0],A[1]-h];
function tileQ(x,y,s){return [P(x,y),P(x+s,y),P(x+s,y+s),P(x,y+s)];}
const isRoad=(x,y)=>x%6===0||y%6===0;
function drawGround(g){
 g.fillStyle='#0b121b';g.fillRect(0,0,SCW,SCH);
 for(let y=-4;y<0;y++)for(let x=-1;x<W+1;x++)poly(g,tileQ(x,y,1),(x+y)%2?'#3b78ad':'#3f7fb5','#3b78ad');
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const q=tileQ(x,y,1);
  if(isRoad(x,y)){
   poly(g,q,'#6e7378','#6e7378');
   const hx=y%6===0,vx=x%6===0;
   if(hx!==vx){g.strokeStyle='rgba(240,240,220,.55)';g.lineWidth=1.2;g.setLineDash([5,6]);g.beginPath();
    if(hx){const a=P(x,y+.5),b=P(x+1,y+.5);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}else{const a=P(x+.5,y),b=P(x+.5,y+1);g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);}
    g.stroke();g.setLineDash([]);}
  }else{
   const bx=Math.floor((x-1)/6),by=Math.floor((y-1)/6),d=distOf(bx,by);
   const c=d==='hauteurs'?(S.ft?['#6fb35a','#76ba60']:['#4c6b46','#52714b']):d==='centre'?['#a9a69d','#aeaba2']:d==='faubourg'?['#7e9f55','#84a55a']:['#89aa5e','#8daf62'];
   poly(g,q,c[(x*7+y*3)%2],c[0]);
   if(d!=='centre')for(let k=0;k<3;k++){const q2=P(x+((x*31+y*17+k*7)%10)/10,y+((x*13+y*29+k*11)%10)/10);g.fillStyle=k?'rgba(40,72,30,.32)':'rgba(190,220,140,.35)';g.fillRect(q2[0]-1.2,q2[1]-.6,2.4,1.2);}
  }
 }
 // trottoirs
 for(let by=0;by<4;by++)for(let bx=0;bx<5;bx++){const x0=1+bx*6,y0=1+by*6,o=tileQ(x0,y0,5),n=tileQ(x0+.11,y0+.11,4.78);
  g.beginPath();g.moveTo(o[0][0],o[0][1]);for(const q of o.slice(1))g.lineTo(q[0],q[1]);g.closePath();g.moveTo(n[0][0],n[0][1]);for(const q of n.slice(1))g.lineTo(q[0],q[1]);g.closePath();
  g.fillStyle='#cdc8bc';g.fill('evenodd');poly(g,o,null,'rgba(0,0,0,.28)');}
 // passages piétons
 for(let Y=0;Y<=H-1;Y+=6)for(let X=0;X<=W-1;X+=6)for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){const tx=X+dx,ty=Y+dy;if(tx<0||ty<0||tx>=W||ty>=H)continue;
  for(let k=0;k<5;k++){const a=.1+k*.17;let q;
   if(dx){const xs=dx>0?tx+.06:tx+.64;q=[P(xs,ty+a),P(xs+.3,ty+a),P(xs+.3,ty+a+.09),P(xs,ty+a+.09)];}
   else{const ys=dy>0?ty+.06:ty+.64;q=[P(tx+a,ys),P(tx+a+.09,ys),P(tx+a+.09,ys+.3),P(tx+a,ys+.3)];}
   poly(g,q,'rgba(245,245,235,.8)');}}
 if(!S.ft){const c=P(27.5,12.5);g.save();g.font='800 22px system-ui,"DejaVu Sans",sans-serif';g.textAlign='center';const t1='🔒 LES HAUTEURS',w1=g.measureText(t1).width+40;
  g.fillStyle='rgba(12,18,28,.88)';g.beginPath();if(g.roundRect)g.roundRect(c[0]-w1/2,c[1]-42,w1,66,16);else g.rect(c[0]-w1/2,c[1]-42,w1,66);g.fill();g.strokeStyle='rgba(245,196,81,.75)';g.lineWidth=2;g.stroke();
  g.fillStyle='#f5c451';g.fillText(t1,c[0],c[1]-11);g.font='600 13px system-ui,"DejaVu Sans",sans-serif';g.fillStyle='#cfdbe6';g.fillText('Réservé aux joueurs de la Fast Track',c[0],c[1]+12);g.restore();}
 // quai
 g.strokeStyle='#cfc7b4';g.lineWidth=3;const a=P(-1,0),b=P(W+1,0);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.stroke();
}
const WALL={studio:['#e8d9b8','#d9c6a0','#f0e2c8','#e3cfae'],appart:['#d8c3a5','#c9b08e','#e6d3b3','#d4bea0'],immeuble:['#cfc2ae','#b9a68c','#ddd0bd','#c4b59f'],boutique:['#e9dcc2','#d8c6a6','#f0e6d2','#ddd0b8'],maison:['#efe3cd','#e2d0ae','#f2e9d8','#e8d8bc'],bureau:['#8fb3cf','#a7bfd1','#9fb6c8','#86a8c4']};
const ROOF=['#b5532f','#8e4a2e','#6f6a66','#a14c3a'];
const OWNCOL=p=>p.owner===0?'#2f74e0':p.owner===1?S.rivals[0].col:p.owner===2?S.rivals[1].col:null;
function faceGrad(g,A,B2,h,col,f){const yb=(A[1]+B2[1])/2,gr=g.createLinearGradient(0,yb,0,yb-h);gr.addColorStop(0,shade(col,f*.8));gr.addColorStop(1,shade(col,f*1.07));return gr;}
function lgErase(pts){if(!LG)return;LG.globalCompositeOperation='destination-out';poly(LG,pts,'#000');LG.globalCompositeOperation='source-over';}
function box(g,x0,y0,x1,y1,h,wall,top){
 const T=P(x0,y0),R=P(x1,y0),B=P(x1,y1),L=P(x0,y1);
 const fl=[L,B,up(B,h),up(L,h)],fr=[B,R,up(R,h),up(B,h)],ft=[up(T,h),up(R,h),up(B,h),up(L,h)];
 poly(g,fl,h>3?faceGrad(g,L,B,h,wall,.74):shade(wall,.74),'rgba(0,0,0,.28)');
 poly(g,fr,h>3?faceGrad(g,B,R,h,wall,.98):shade(wall,.98),'rgba(0,0,0,.22)');
 if(top!==false)poly(g,ft,top||shade(wall,1.08),'rgba(0,0,0,.25)');
 if(h>4){g.strokeStyle='rgba(255,255,255,.24)';g.lineWidth=1;g.beginPath();g.moveTo(B[0],B[1]-1);g.lineTo(B[0],B[1]-h);g.stroke();const a=up(L,h),b=up(B,h),c=up(R,h);g.beginPath();g.moveTo(a[0],a[1]);g.lineTo(b[0],b[1]);g.lineTo(c[0],c[1]);g.stroke();}
 lgErase([L,B,R,up(R,h),up(T,h),up(L,h)]);
 return {T,R,B,L,h};
}
function wins(g,b,floors,per,col,z0,fh){
 for(const [A,B2] of [[b.L,b.B],[b.B,b.R]])for(let f=0;f<floors;f++)for(let i=0;i<per;i++){
  const u0=(i+.25)/per,u1=(i+.75)/per,za=z0+f*fh,zb=za+fh*.55;
  const q=[fp(A,B2,u0,za),fp(A,B2,u1,za),fp(A,B2,u1,zb),fp(A,B2,u0,zb)];poly(g,q,(i*7+f*3+b.h)%11===0?'#f3d27a':col);
  if(LG&&(i*13+f*7+Math.round(A[0]*.37+A[1]*.71))%9<4)poly(LG,q,(i+f)%4?'rgba(255,206,120,.95)':'rgba(255,236,190,.95)');
 }
}
function pyramid(g,b,rh,col){const c=[(b.T[0]+b.B[0])/2,(b.T[1]+b.B[1])/2-b.h-rh];lgErase([up(b.L,b.h),up(b.B,b.h),up(b.R,b.h),c]);
 poly(g,[up(b.L,b.h),up(b.B,b.h),c],shade(col,.8),'rgba(0,0,0,.3)');poly(g,[up(b.B,b.h),up(b.R,b.h),c],col,'rgba(0,0,0,.3)');}
function bigLabel(g,b,h,txt,bg,fg){g.font='bold 10px system-ui,"DejaVu Sans",sans-serif';g.textAlign='center';const w=g.measureText(txt).width+12;const sp=fp(b.B,b.R,.5,h+4);g.fillStyle=bg;g.fillRect(sp[0]-w/2,sp[1]-12,w,14);g.fillStyle=fg;g.fillText(txt,sp[0],sp[1]-1.5);}
function flag(g,pt,col){g.strokeStyle='#333';g.lineWidth=1.5;g.beginPath();g.moveTo(pt[0],pt[1]);g.lineTo(pt[0],pt[1]-16);g.stroke();g.fillStyle=col;g.beginPath();g.moveTo(pt[0],pt[1]-16);g.lineTo(pt[0]+11,pt[1]-12.5);g.lineTo(pt[0],pt[1]-9);g.fill();}
function sign(g,pt,txt,bg,fg){g.font='bold 8px "DejaVu Sans",sans-serif';const w=g.measureText(txt).width+6;g.fillStyle='#4a3a2a';g.fillRect(pt[0]-1,pt[1]-14,2,14);g.fillStyle=bg;g.fillRect(pt[0]-w/2,pt[1]-24,w,11);g.strokeStyle='rgba(0,0,0,.5)';g.strokeRect(pt[0]-w/2+.5,pt[1]-23.5,w-1,10);g.fillStyle=fg||'#111';g.textAlign='center';g.fillText(txt,pt[0],pt[1]-15.5);}
function tree(g,x,y,v,s){const p=P(x,y);s=s||1;g.fillStyle='rgba(0,0,0,.2)';g.beginPath();g.ellipse(p[0],p[1],9*s,4*s,0,0,7);g.fill();g.fillStyle='#5b3b1e';g.fillRect(p[0]-1.5,p[1]-11*s,3,11*s);const gs=['#2f6b2a','#38792f','#2a5f26','#43853a'];g.fillStyle=gs[v];g.beginPath();g.arc(p[0],p[1]-19*s,9*s,0,7);g.fill();g.fillStyle=gs[(v+1)%4];g.beginPath();g.arc(p[0]-5*s,p[1]-13*s,6*s,0,7);g.arc(p[0]+5*s,p[1]-14*s,6*s,0,7);g.fill();}
function carShape(g,x,y,dx,dy,col){
 const ax=dx*.28,ay=dy*.28,px=-dy*.14,py=dx*.14;
 const c=[[x+ax+px,y+ay+py],[x+ax-px,y+ay-py],[x-ax-px,y-ay-py],[x-ax+px,y-ay+py]].map(q=>P(q[0],q[1]));
 poly(g,c.map(q=>[q[0],q[1]-2]),col);
 poly(g,c.map((q,i)=>{const m=[(c[0][0]+c[2][0])/2,(c[0][1]+c[2][1])/2];return [m[0]+(q[0]-m[0])*.55,m[1]+(q[1]-m[1])*.55-6];}),shade(col,1.25));
}

 if(col)poly(g,base,null,col),g.lineWidth=1,(()=>{g.strokeStyle=col;g.lineWidth=2.5;poly(g,base,null,null);g.stroke();})();
 let b=null,top=null;

  const pr=1-p.build.d/p.build.T,h=TYPES[p.build.type].h*Math.max(.15,pr);

  g.strokeStyle='#e0b030';g.lineWidth=2;const c=up(b.R,h+10);g.beginPath();g.moveTo(c[0],c[1]+10);g.lineTo(c[0],c[1]-40);g.lineTo(c[0]-40,c[1]-34);g.stroke();
  top=up(b.T,h);
 }else switch(p.type){
  case 'studio':case 'appart':{const m=s===1?.14:.1;b=box(g,x0+m,y0+m,x0+s-m,y0+s-m,t.h,WALL[p.type][p.v]);wins(g,b,Math.floor(t.h/15),2,'#2b3f55',6,15);
   if(p.type==='studio')pyramid(g,b,14,ROOF[p.v]);else{poly(g,[up(b.T,b.h),up(b.R,b.h),up(b.B,b.h),up(b.L,b.h)],'#8c8a86');}top=up(b.T,t.h);break;}
  case 'immeuble':case 'bureau':{const m=.14;b=box(g,x0+m,y0+m,x0+s-m,y0+s-m,t.h+(p.v%2)*8,WALL[p.type][p.v],p.type==='bureau'?'#6d8aa0':'#8c8a86');
   if(p.type==='bureau'){for(const [A,B2] of [[b.L,b.B],[b.B,b.R]])for(let f=0;f<Math.floor(b.h/11);f++){const q=[fp(A,B2,.04,6+f*11),fp(A,B2,.96,6+f*11),fp(A,B2,.96,12+f*11),fp(A,B2,.04,12+f*11)];poly(g,q,f%3===1?'#c9e2f5':'#4f7591');if(LG&&(f+p.v+(A===b.L?1:0))%3!==0)poly(LG,q,'rgba(185,222,255,.55)');}}
   else wins(g,b,Math.floor(b.h/14),4,'#2b3f55',7,14);
   const c=up(b.T,b.h);g.fillStyle='#777';g.fillRect(c[0]-4,c[1]+14,10,6);top=c;break;}
  case 'boutique':{const m=.12;b=box(g,x0+m,y0+m,x0+s-m,y0+s-m,t.h,WALL.boutique[p.v],'#8c8a86');
   const aw=p.biz===0?'#2f74e0':p.biz>0?S.rivals[p.biz-1].col:['#c0392b','#27ae60','#2980b9','#d68910'][p.v];
   {const q=[fp(b.B,b.R,.08,8),fp(b.B,b.R,.92,8),fp(b.B,b.R,.92,22),fp(b.B,b.R,.08,22)];poly(g,q,'#33475b');if(LG)poly(LG,q,'rgba(255,214,150,.9)');}
   poly(g,[fp(b.B,b.R,.04,22),fp(b.B,b.R,.96,22),[fp(b.B,b.R,.96,22)[0]+5,fp(b.B,b.R,.96,22)[1]+6],[fp(b.B,b.R,.04,22)[0]+5,fp(b.B,b.R,.04,22)[1]+6]],aw);
   wins(g,{L:b.L,B:b.B,R:b.L,h:b.h},1,2,'#2b3f55',10,14);top=up(b.T,t.h);break;}
  case 'maison':{

   const m=.45;b=box(g,x0+m,y0+m,x0+s-m,y0+s-m,t.h,WALL.maison[p.v]);wins(g,b,1,2,'#2b3f55',9,16);pyramid(g,b,20,ROOF[p.v]);

  case 'parking':{poly(g,base,'#5d6166');g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1;

   carShape(g,x0+.3,y0+.32,0,1,['#c0392b','#2980b9','#f1c40f','#ecf0f1'][p.v]);if(p.v%2)carShape(g,x0+.7,y0+.32,0,1,'#7f8c8d');top=P(x0+.5,y0+.5);break;}

   bigLabel(g,b,t.h,'HÔTEL','#7a1f2b','#f5d58a');top=null;break;}

   for(const [A,B2] of [[b.L,b.B],[b.B,b.R]]){const q=[fp(A,B2,.05,6),fp(A,B2,.95,6),fp(A,B2,.95,24),fp(A,B2,.05,24)];poly(g,q,'#8fc1df');if(LG)poly(LG,q,'rgba(255,225,170,.85)');}
   bigLabel(g,b,t.h,'CENTRE COMMERCIAL','#1f2d3a','#f5c451');top=null;break;}
  case 'tour':{const m=.22;b=box(g,x0+m,y0+m,x0+s-m,y0+s-m,t.h,'#5f8fb0','#3e6a8a');
   for(const [A,B2] of [[b.L,b.B],[b.B,b.R]])for(let f=0;f<Math.floor(t.h/9);f++){const q=[fp(A,B2,.03,4+f*9),fp(A,B2,.97,4+f*9),fp(A,B2,.97,9+f*9),fp(A,B2,.03,9+f*9)];poly(g,q,f%4===1?'#cfe8f8':'#3d6684');if(LG&&(f+p.v+(A===b.L?1:0))%3)poly(LG,q,'rgba(190,228,255,.5)');}
   const c=[(b.T[0]+b.B[0])/2,(b.T[1]+b.B[1])/2-t.h];g.strokeStyle='#8a9aa8';g.lineWidth=2;g.beginPath();g.moveTo(c[0],c[1]);g.lineTo(c[0],c[1]-34);g.stroke();g.fillStyle='#ff4d4d';g.beginPath();g.arc(c[0],c[1]-35,2.5,0,7);g.fill();

function chart(cv,series,opt){
 const g=cv.getContext('2d'),w=cv.width,h=cv.height;g.clearRect(0,0,w,h);g.fillStyle='rgba(0,0,0,.22)';g.fillRect(0,0,w,h);
 let mn=Infinity,mx=-Infinity;for(const s of series)for(const v of s.d){mn=Math.min(mn,v);mx=Math.max(mx,v);}
 if(!isFinite(mn)){g.fillStyle='#9fb3c6';g.font='12px sans-serif';g.fillText('Pas encore de données',10,20);return;}
 if(opt&&opt.zero)mn=Math.min(mn,0);if(mx===mn)mx=mn+1;
 const Y=v=>h-6-(v-mn)/(mx-mn)*(h-14);
 if(mn<0){g.strokeStyle='#3f5973';g.beginPath();g.moveTo(0,Y(0));g.lineTo(w,Y(0));g.stroke();}
 for(const s of series){const n=s.d.length;if(n<2)continue;g.strokeStyle=s.c;g.lineWidth=Math.max(2,w/260);g.lineJoin='round';g.beginPath();s.d.forEach((v,i)=>{const x=i/(n-1)*(w-4)+2;i?g.lineTo(x,Y(v)):g.moveTo(x,Y(v));});g.stroke();}
}

 if(drag&&ptrs.size){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>(drag.touch?10:5))drag.m=true;if(drag.m){cam.x=drag.cx-dx/Z;cam.y=drag.cy-dy/Z;clampCam();}const tn=performance.now(),dtm=Math.max(8,tn-(drag.lt||tn));drag.vx=.6*(drag.vx||0)+.4*(e.clientX-(drag.lx??e.clientX))/dtm;drag.vy=.6*(drag.vy||0)+.4*(e.clientY-(drag.ly??e.clientY))/dtm;drag.lx=e.clientX;drag.ly=e.clientY;drag.lt=tn;}

 if(p&&!(drag&&drag.m)){const t=TYPES[p.type];tp.innerHTML='<b>'+t.ic+' '+t.n+'</b><br>'+(t.pub?'':DIST[p.dist].n+(p.forSale?'<br>À vendre : <b>'+fmt(p.ask)+'</b>':'')+(p.owner===0?'<br>À toi · '+sg(propCashflow(p))+'/mois':p.owner>0?'<br>'+S.rivals[p.owner-1].ic+' '+S.rivals[p.owner-1].name:''));
  tp.style.display='block';tp.style.left=Math.min(VW-270,e.clientX+14)+'px';tp.style.top=(e.clientY+14)+'px';}
 else tp.style.display='none';
});

function ptrEnd(e){
 if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
 if(pinch){if(ptrs.size<2){pinch=null;if(ptrs.size===1){const r=[...ptrs.values()][0];drag={x:r.x,y:r.y,cx:cam.x,cy:cam.y,m:true,touch:true};}else drag=null;}return;}
 if(!drag||ptrs.size)return;const d=drag;drag=null;
 if(d.m){if(d.touch&&d.lt&&performance.now()-d.lt<90&&Math.hypot(d.vx||0,d.vy||0)>.12)vel={x:d.vx,y:d.vy};return;}
 if(!running||e.type==='pointercancel')return;
 if(d.touch){const t=performance.now();if(lastTap&&t-lastTap.t<320&&Math.hypot(e.clientX-lastTap.x,e.clientY-lastTap.y)<40){lastTap=null;zoomAnim={from:Z,to:Z<1.05?Math.min(1.8,Z*1.8):fitZ(),x:e.clientX,y:e.clientY,t:0};return;}lastTap={t,x:e.clientX,y:e.clientY};}
 const p=pickAt(e.clientX,e.clientY);
 if(S.choosing&&p&&localOk(p,S.choosing.act)){sel=p;chooseLocal(p);return;}
 sel=p;lastActKey='';$('#info').scrollTop=0;if(p)buzz(8);
 if(p&&(p.type==='banque'||p.type==='bourse'))openPanel(p.type);
}
cv.addEventListener('pointerup',ptrEnd);cv.addEventListener('pointercancel',ptrEnd);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Z*(e.deltaY<0?1.15:1/1.15),e.clientX,e.clientY);},{passive:false});
const keys={};
addEventListener('keydown',e=>{
 if(!running)return;const k=e.key.toLowerCase();
 if(k==='escape'){if($('#mod').className==='ov'){if(!S.evq._cur)closeModal();}else if(panKind)closePanel();else if(S.choosing)S.choosing=null;else sel=null;lastActKey='';return;}
 if($('#mod').className==='ov'||panKind)return;
 keys[k]=true;
 if(k===' '){e.preventDefault();S.speed=S.speed?0:(S.prevSpeed||1);if(S.speed)S.prevSpeed=S.speed;}
 if(k==='1'||k==='2'||k==='3'){S.speed=+k;S.prevSpeed=S.speed;}

});

document.querySelectorAll('#vit button').forEach(b=>b.onclick=()=>{S.speed=+b.dataset.v;if(S.speed)S.prevSpeed=S.speed;drawTop();});

$('#bMenu').onclick=()=>{if(!running)return;modal({title:'☰ Menu',html:'<p>La partie est enregistrée automatiquement chaque mois.</p>',buttons:[{t:'Reprendre',cls:'go'},{t:'🗺️ Afficher les quartiers (Q) : '+(S.showDist?'oui':'non'),fn:()=>{S.showDist=!S.showDist;}},{t:'🌗 Jour et nuit : '+({auto:'cycle automatique',jour:'toujours le jour',nuit:'toujours la nuit'})[JN],fn:()=>{JN={auto:'jour',jour:'nuit',nuit:'auto'}[JN];try{localStorage.setItem('empire:jn',JN);}catch(e){}toast('🌗 '+({auto:'Cycle jour et nuit',jour:'Toujours le jour',nuit:'Toujours la nuit'})[JN]);}},{t:'📳 Vibrations : '+(VIB?'oui':'non'),fn:()=>{VIB=!VIB;try{localStorage.setItem('empire:vib',VIB?'on':'off');}catch(e){}if(VIB)buzz(30);}},{t:'📖 Aide et lexique',fn:showHelp},{t:'💾 Enregistrer maintenant',fn:()=>{save();toast('Partie enregistrée');}},{t:'🔄 Nouvelle partie',fn:()=>{if(confirmBox('Abandonner la partie en cours ?'))showStart();}},].concat(deferredInstall?[{t:'📲 Installer l\'appli sur cet appareil',fn:installApp}]:[]).concat(!STANDALONE&&document.fullscreenEnabled?[{t:document.fullscreenElement?'🗗 Quitter le plein écran':'⛶ Plein écran',fn:()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{});}}]:[]).concat(location.pathname.indexOf('/outils/')>=0?[{t:'⌂ Retour au tableau de bord',fn:()=>{save();location.href='../';}}]:[])});};
function showHelp(){modalMsg('📖 Aide et lexique','<p><b>Cashflow</b> : ce qui entre moins ce qui sort chaque mois.</p><p><b>Actif</b> : met de l\'argent dans ta poche (bien loué rentable, actions à dividende, boîte avec gérant). <b>Passif</b> : en retire (voiture à crédit, résidence principale).</p><p><b>Rendement brut</b> : loyer annuel ÷ prix. <b>Effet de levier</b> : acheter avec l\'argent de la banque ; le locataire rembourse le crédit.</p><p><b>Taux d\'endettement</b> : mensualités ÷ revenus. La banque refuse au-delà de 35 %.</p><p><b>Sortir de la Rat Race</b> : revenus passifs ≥ dépenses.</p><p><b>Commandes</b> : '+(TOUCH?'touche un bâtiment pour le sélectionner, glisse un doigt pour déplacer la carte, pince avec deux doigts pour zoomer. Les boutons ⏸ ▶ ⏩ ⏭ règlent la vitesse.':'clic pour sélectionner, glisser pour déplacer la carte, molette pour zoomer, Espace pour la pause, 1-2-3 pour la vitesse, Q pour les quartiers.')+'</p><div class="lecon">💡 Les chiffres du jeu (impôts, cotisations, taux) sont simplifiés pour rester lisibles. Ils donnent les bons ordres de grandeur, pas des conseils personnalisés.</div>');}

 S=s;S.di.hauteurs=S.di.hauteurs||1;S.dtr.hauteurs=S.dtr.hauteurs||0;rebuildGrid();
 for(const l of S.loans){}

/* ---------- boucle ---------- */
const DPS=[0,1.5,4,10];
let last=performance.now(),acc=0,uiT=0,rT=0,pedT=0;
function frame(t){
 const dt=Math.min(.1,(t-last)/1000);last=t;
 if(running&&S){
  const blocked=$('#mod').className==='ov'||!!panKind;
  if(!blocked){
   acc+=dt*DPS[S.speed];let n=0;
   while(acc>=1&&n<3){dayTick();acc-=1;n++;}if(n>=3)acc=0;
   runEvents();
  }
  const sp=keys.arrowleft||keys.q&&false;
  const ks=700*dt/Z;if(keys.arrowleft)cam.x-=ks;if(keys.arrowright)cam.x+=ks;if(keys.arrowup)cam.y-=ks;if(keys.arrowdown)cam.y+=ks;if(keys.arrowleft||keys.arrowright||keys.arrowup||keys.arrowdown)clampCam();
  if(!blocked&&S.speed){moveCars(dt*Math.min(2,DPS[S.speed]/1.5));
   for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<2);
   const c=S.comp,pr=c&&c.prop?propById(c.prop):null;
   if(pr&&c.last){pedT+=dt*Math.min(3,c.last.sold/30*DPS[S.speed]);while(pedT>=1&&peds.length<25){pedT--;const sx=pr.tx+pr.size+.5,sy=pr.ty+pr.size/2;const rx=Math.round(sx/6)*6+.5;peds.push({x0:rx,y0:sy+(rnd()-.5)*2,x1:pr.tx+pr.size/2,y1:pr.ty+pr.size/2,t:0,T:1.5+rnd(),c:pick(['#c0392b','#2980b9','#27ae60','#8e44ad','#f39c12'])});}}
   for(const q of peds)q.t+=dt;peds=peds.filter(q=>q.t<q.T);
  }
  uiT+=dt;if(uiT>.25){uiT=0;S.lastL=S.lastL||ledger();drawTop();drawBottom();}
  if(vel){cam.x-=vel.x*1000*dt/Z;cam.y-=vel.y*1000*dt/Z;const k=Math.exp(-dt*4.5);vel.x*=k;vel.y*=k;clampCam();if(Math.hypot(vel.x,vel.y)<.015)vel=null;}
  if(zoomAnim){zoomAnim.t=Math.min(1,zoomAnim.t+dt/.28);const e2=1-Math.pow(1-zoomAnim.t,3);zoomAt(zoomAnim.from+(zoomAnim.to-zoomAnim.from)*e2,zoomAnim.x,zoomAnim.y);if(zoomAnim.t>=1)zoomAnim=null;}
  if(!blocked&&S.speed&&JN==='auto')dayPh=(dayPh+dt*Math.min(2,DPS[S.speed]/1.5)/CYCLE)%1;
  wlT+=dt;if(wlT>2){wlT=0;keepAwake(!blocked&&S.speed>0);}
  const busy=(drag&&drag.m)||pinch||vel||zoomAnim;
  rT+=dt;if(rT>=(busy?1/60:(S.speed&&!blocked?1/30:1/12))||sceneDirty){rT=0;render();}
 }
 requestAnimationFrame(frame);
}
